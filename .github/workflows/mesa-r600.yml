#
# 构建 Mesa 21.3.9 r600 VA 驱动（修复 r600 VCE 编码上下文创建失败）
#
# 背景：DSM 7.2 / epyc7002 / AMD ARUBA 上 Emby 走 h264_vaapi 时报
#   "Failed to create encode pipeline context: 2"（VA_STATUS_ERROR_ALLOCATION_FAILED），
#   根因是 Mesa r600 的 rvce_create_encoder() 尾部无条件 goto error，
#   且版本相关的会话回调从未注册。
#
# 产物必须能被 Emby 容器的 glibc 2.27 + libva 2.22(VA API 1.22) 加载，
# 故编译放在 ubuntu:18.04 容器内（宿主机只做 checkout / 校验 / 上传）。
#

name: Build Mesa r600 VA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mesa-r600/**'
      - '.github/workflows/mesa-r600.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 在 Ubuntu 18.04 容器内构建（glibc 2.27）
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:18.04 \
            bash /work/mesa-r600/build.sh

      - name: 校验产物 ABI
        run: |
          set -euo pipefail
          SO=mesa-r600/out/libgallium_drv_video.so
          file "$SO"
          ls -l "$SO"
          python3 mesa-r600/verify.py "$SO"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mesa-r600-va-${{ github.sha }}
          path: mesa-r600/out/libgallium_drv_video.so
          if-no-files-found: error
