name: Update Support List

# 手动运行：更新每平台支持列表 支持列表.xlsx（网卡/无线网卡/串口/阵列卡/SAS-HBA/SATA转接/AMD/Intel/其他显卡）
# SATA 区同时列出生成器核对的内建 ahci 控制器（不是独立 ahci.ko）
# 数据源 = myp015/syno-modules/release（最新编译产物）
# 输出写入并 push 到 myp015/ainas-modules 仓库 main（支持列表归属地，用户原指令）
# 本 workflow 归属 ainas-build（与其它编译 workflow 同仓，可利用 secrets.AiNas 访问私有 ainas-modules）
# 用法：ainas-build → Actions → Update Support List → Run workflow

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '平台过滤（逗号分隔，留空=全部）'
        required: false
        default: ''

concurrency:
  group: support-list
  cancel-in-progress: false

# GITHUB_TOKEN 只用于读取公共 syno-modules；推送 ainas-modules 使用专用 AiNas token。
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ainas-modules (脚本 + 输出目标)
        # 私有仓库须 AiNas；脚本与 支持列表.xlsx 都在 ainas-modules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: myp015/ainas-modules
          ref: main
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Validate workflow inputs
        env:
          PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          set -eu
          python3 - <<'PY'
          import os
          import re
          import sys

          platforms = os.environ["PLATFORMS"]
          if platforms and not re.fullmatch(r"[A-Za-z0-9_-]+(?:,[A-Za-z0-9_-]+)*", platforms):
              sys.exit("platforms 格式非法")
          PY

      - name: Checkout syno-modules (release 数据源, 稀疏)
        # 数据源 public 仓库，GITHUB_TOKEN 可读
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: myp015/syno-modules
          ref: main
          path: syno-modules
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: release
          sparse-checkout-cone-mode: true

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kmod pciutils hwdata pci.ids usb.ids python3-venv
          python3 -m venv /tmp/venv
          # 锁版本：openpyxl 升级会改变 xlsx 字节 → "内容无变化跳过提交"失效
          /tmp/venv/bin/pip install -q openpyxl==3.1.5

      - name: Generate xlsx
        env:
          PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          set -eu
          cd "${{ github.workspace }}/ainas-modules"
          args=(--release "${{ github.workspace }}/syno-modules/release"
                --out "支持列表.xlsx" --parallel 8)
          if [ -n "$PLATFORMS" ]; then
            args+=(--platforms "$PLATFORMS")
          fi
          /tmp/venv/bin/python scripts/gen_support_list.py "${args[@]}"
          ls -la -- 支持列表.xlsx

      - name: Upload artifact (下载兜底)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: support-list
          path: "${{ github.workspace }}/ainas-modules/支持列表.xlsx"
          if-no-files-found: error

      - name: Commit and push (到 ainas-modules)
        if: ${{ github.event.inputs.platforms == '' }}
        # checkout 时 AiNas 已注入 git extraheader，push 自动带权限
        run: |
          set -eu
          cd "${{ github.workspace }}/ainas-modules"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add -- 支持列表.xlsx
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新支持列表（syno-modules 最新 release）"
            git push origin HEAD:main
            echo "已 push 更新后的支持列表"
          fi

      - name: Skip commit for filtered platforms
        if: ${{ github.event.inputs.platforms != '' }}
        run: echo "已生成过滤平台 artifact，不覆盖或提交完整支持列表"
