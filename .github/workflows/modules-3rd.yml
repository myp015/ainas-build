name: Get modules 3rd

on:
  workflow_dispatch:

jobs:
  i915:
    strategy:
      # 单个平台失败不取消其余 job：16 个平台共用一份矩阵，任一平台的头文件/
      # 配置差异都会让其余结果不可见（2026-10-20 r1000nk MCE 头差异实证）。
      fail-fast: false
      matrix:
        include:
          - version: 7.1
            platform: epyc7002

          - version: 7.2
            platform: epyc7002
          - version: 7.2
            platform: geminilakenk
          - version: 7.2
            platform: r1000nk
          - version: 7.2
            platform: v1000nk

          - version: 7.3
            platform: epyc7002
          - version: 7.3
            platform: geminilakenk
          - version: 7.3
            platform: r1000nk
          - version: 7.3
            platform: v1000nk

          - version: 7.4
            platform: epyc7002
          - version: 7.4
            platform: epyc7003
          - version: 7.4
            platform: epyc7003ntb
          - version: 7.4
            platform: geminilakenk
          - version: 7.4
            platform: icelaked
          - version: 7.4
            platform: r1000nk
          - version: 7.4
            platform: v1000nk

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/intel-gpu-i915-backports
          token: ${{ secrets.AiNas }}
          path: intel-gpu-i915-backports
          # Task#202：amdgpu/radeon 已并入 6.5 backport 栈（amd-backport 分支）。
          # 合入默认分支前必须显式指定，否则检出的是不含 amd 的 mainline-tracking-v6.5。
          ref: amd-backport

      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Build
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}
  
          echo "getting toolkit"
          for N in env dev; do
            curl -skL "https://global.synologydownload.com/download/ToolChain/toolkit/${VERSION}/${PLATFORM}/ds.${PLATFORM}-${VERSION}.${N}.txz" -o "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz"
          done

          for N in env dev; do
            [ ! -f "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz" ] && {
              echo "ds.${PLATFORM}-${VERSION}.${N}.txz file not found"
              exit 1
            }
            mkdir -p "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}"
            tar -xhf "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz" -C "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}"
          done

          echo "building modules"
          export CROSS_COMPILE=${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.env/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KLIB_BUILD=${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.dev/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${VERSION}/build
          # modinfo 标识：sed KLIB_BUILD module.h 的 MODULE_DESCRIPTION 宏追加
          # "(Compiled by ainas for DSM)"（不用 -include 注入：-include 抢先包含
          # module.h 破坏 kcompat.h「先于内核头」约束/提前定义 pr_fmt，epyc7003ntb
          # -Werror 实测编译失败）。改 KSRC 宏对用该 KSRC 编译的模块生效。
          if [ -f "${KLIB_BUILD}/include/linux/module.h" ] && ! grep -q 'MODULE_INFO(description, _description " (Compiled by ainas' "${KLIB_BUILD}/include/linux/module.h"; then
            sed -i 's/#define MODULE_DESCRIPTION(_description) MODULE_INFO(description, _description)/#define MODULE_DESCRIPTION(_description) MODULE_INFO(description, _description " (Compiled by ainas for DSM)")/' "${KLIB_BUILD}/include/linux/module.h"
          fi
          # Task#202：全部 5.10 平台统一 defconfig-amd —— Intel i915 与 AMD amdgpu/
          # radeon 共用同一套 6.5 DRM 栈（drm/ttm/gpu-sched/dmabuf 只由 update/ 提供）。
          # amdgpu.o 是 1462 个对象的 multi-object 链接，工作区路径下命令行约 180KB，
          # 超过 /bin/sh -c 的 MAX_ARG_STRLEN（128KB），make 会报
          # "/bin/sh: Argument list too long"（Error 127）。构建树复制到 /b 后
          # 命令行约 88KB，留出余量。
          BUILD_ROOT=/b
          sudo rm -rf "${BUILD_ROOT}"
          sudo mkdir -p "${BUILD_ROOT}"
          sudo chown "$(id -u):$(id -g)" "${BUILD_ROOT}"
          cp -a "${ROOT_PATH}/intel-gpu-i915-backports/." "${BUILD_ROOT}/"
          (
            cd "${BUILD_ROOT}"
            make defconfig-amd
            make -j"$(nproc)"
            make -C "${KLIB_BUILD}" M="${PWD}" INSTALL_MOD_PATH="${PWD}/intermediates" INSTALL_MOD_STRIP=1 CONFIG_MODULE_SIG_ALL= _emodinst_
          )
          KVERSION=$(cat ${KLIB_BUILD}/Makefile | grep ^VERSION | awk -F' ' '{print $3}')
          PATCHLEVEL=$(cat ${KLIB_BUILD}/Makefile | grep ^PATCHLEVEL | awk -F' ' '{print $3}')
          SUBLEVEL=$(cat ${KLIB_BUILD}/Makefile | grep ^SUBLEVEL | awk -F' ' '{print $3}')
          KVER="${KVERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          MODULES_INTERMEDIATES="${BUILD_ROOT}/intermediates"
          # 全平台统一 update/ 布局：Task#202 起 root 5.10 的 DRM/GPU 栈全部停编，
          # GPU 栈（drm/ttm/gpu-sched/dmabuf/drm_kms_helper + i915 + amdgpu/radeon）
          # 统一由本栈提供。仍放 update/ 而非扁平 root，是因为：depmod 让 updates/
          # 自带 dirname 优先；若扁平输出会与 modules.yml 阶段 root 产物的同名 .ko
          # 互相覆盖（v1000nk-7.2 上机 radeon/gpu-sched Unknown symbol ttm_*/drm_*
          # 实测根因即混合栈）。update/ 与 root 分离后由 modules.yml 的
          # 「update 同名删 root」规则统一清理。
          OUT_MODULES="${ROOT_PATH}/output/update"
          mkdir -p "${OUT_MODULES}"
          find "${MODULES_INTERMEDIATES}" -type f -name '*.ko' -exec mv {} "${OUT_MODULES}" \;

          tar -zcf ${ROOT_PATH}/i915-${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: i915-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            i915-*.tgz

  # ── 4.4.302 双 DRM 栈（i915 + amdgpu + radeon，Linux 5.4 OOT backport）─────
  # 来源：myp015/redpill-dual-drm-backports（我们自己的 fork）。该栈定位 headless
  # （不初始化 fbdev 模拟），构建方式为 make -C $KLIB_BUILD M=$OOT_ROOT，
  # KSRC 与上面 5.x 栈同源（群晖官方 dev txz）。
  # 产物统一放 output/update/，由 modules.yml 的「update 同名删 root」规则
  # 清理 root 4.4 的 DRM/FB 同名模块，避免混合栈。
  drm4:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 7.2
            platform: apollolake
          - version: 7.2
            platform: broadwell
          - version: 7.2
            platform: broadwellnk
          - version: 7.2
            platform: broadwellnkv2
          - version: 7.2
            platform: broadwellntbap
          - version: 7.2
            platform: denverton
          - version: 7.2
            platform: geminilake
          - version: 7.2
            platform: purley
          - version: 7.2
            platform: r1000
          - version: 7.2
            platform: v1000

          - version: 7.3
            platform: apollolake
          - version: 7.3
            platform: broadwell
          - version: 7.3
            platform: broadwellnk
          - version: 7.3
            platform: broadwellnkv2
          - version: 7.3
            platform: broadwellntbap
          - version: 7.3
            platform: denverton
          - version: 7.3
            platform: geminilake
          - version: 7.3
            platform: purley
          - version: 7.3
            platform: r1000
          - version: 7.3
            platform: v1000

          - version: 7.4
            platform: apollolake
          - version: 7.4
            platform: broadwell
          - version: 7.4
            platform: broadwellnk
          - version: 7.4
            platform: broadwellnkv2
          - version: 7.4
            platform: broadwellntbap
          - version: 7.4
            platform: denverton
          - version: 7.4
            platform: geminilake
          - version: 7.4
            platform: purley
          - version: 7.4
            platform: r1000
          - version: 7.4
            platform: v1000

    runs-on: ubuntu-latest
    steps:
      - name: Checkout redpill dual drm
        uses: actions/checkout@main
        with:
          repository: myp015/redpill-dual-drm-backports
          token: ${{ secrets.AiNas }}
          path: redpill-dual-drm-backports

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Build
        run: |
          set -euo pipefail
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}
          OOT_ROOT="${ROOT_PATH}/redpill-dual-drm-backports"

          echo "getting toolkit"
          for N in env dev; do
            for i in $(seq 1 3); do
              curl -skL --retry 3 "https://global.synologydownload.com/download/ToolChain/toolkit/${VERSION}/${PLATFORM}/ds.${PLATFORM}-${VERSION}.${N}.txz" -o "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz" \
                && [ -s "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz" ] && break
              echo "Retry download ${N} ${i}/3"
              sleep 5
            done
            mkdir -p "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}"
            tar -xhf "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz" -C "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}"
          done

          echo "building dual drm modules"
          export CROSS_COMPILE=${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.env/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KLIB_BUILD=${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.dev/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${VERSION}/build

          [ -d "${KLIB_BUILD}" ] || { echo "[E] KLIB_BUILD 不存在: ${KLIB_BUILD}"; exit 1; }

          # 与 5.x i915 栈一致的 modinfo 标识（区分自编与官方模块）
          if [ -f "${KLIB_BUILD}/include/linux/module.h" ] && ! grep -q 'MODULE_INFO(description, _description " (Compiled by ainas' "${KLIB_BUILD}/include/linux/module.h"; then
            sed -i 's/#define MODULE_DESCRIPTION(_description) MODULE_INFO(description, _description)/#define MODULE_DESCRIPTION(_description) MODULE_INFO(description, _description " (Compiled by ainas for DSM)")/' "${KLIB_BUILD}/include/linux/module.h"
          fi

          export KBUILD_MODPOST_WARN=1
          export OOT_KCPPFLAGS="\
            -I${OOT_ROOT}/compat/backport-include \
            -I${OOT_ROOT}/include \
            -I${OOT_ROOT}/include/uapi \
            -I${OOT_ROOT}/compat \
            -include ${OOT_ROOT}/compat/drm_compat.h \
            -include ${OOT_ROOT}/compat/kcl_compat.h \
            -DCONFIG_FB_DEFERRED_IO -DCONFIG_FB_NOTIFY"

          # geminilake/apollolake host 已内建 hdmi/drm_mipi_dsi/sync_file/interval_tree/
          # fb_notify/intel_gtt（实机 kallsyms 确认），重复生产会 "invalid module format"；
          # 其余 8 平台 host 没有，由栈内模块补齐。
          EXTRA_CONFIG="CONFIG_FB_NOTIFY_IN_KERNEL=y"
          NOHOST_CONFIG="CONFIG_AGP_INTEL=m CONFIG_DRM_MIPI_DSI=m"
          case "${PLATFORM}" in
            geminilake|apollolake)
              EXTRA_CONFIG="$EXTRA_CONFIG CONFIG_DRM_SYNC_FILE_IN_KERNEL=y CONFIG_INTERVAL_TREE_IN_KERNEL=y CONFIG_DRM_HDMI_IN_KERNEL=y"
              NOHOST_CONFIG=""
              OOT_KCPPFLAGS="$OOT_KCPPFLAGS -DCONFIG_DRM_HDMI_IN_KERNEL"
              ;;
          esac

          make -C "${KLIB_BUILD}" M="${OOT_ROOT}" \
            CONFIG_DRM=m CONFIG_DRM_KMS_HELPER=m \
            CONFIG_DRM_I915=m CONFIG_DRM_I915_USERPTR=y \
            CONFIG_DRM_TTM=m CONFIG_DRM_SCHED=m \
            CONFIG_DRM_AMDGPU=m \
            CONFIG_DRM_RADEON=m \
            ${NOHOST_CONFIG} \
            CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=m \
            ${EXTRA_CONFIG} \
            KCPPFLAGS="${OOT_KCPPFLAGS}" \
            modules 2>&1 | tee "${ROOT_PATH}/build.log"

          # fail-fast：未解析/重复导出符号一律视为构建失败（redpill CI 同款判据）
          if grep -E 'WARNING:.*undefined|WARNING:.*exported twice|Unknown symbol' "${ROOT_PATH}/build.log"; then
            echo "[E] MODPOST 报告未解析或重复符号" >&2
            exit 1
          fi

          KVERSION=$(grep ^VERSION "${KLIB_BUILD}/Makefile" | awk -F' ' '{print $3}')
          PATCHLEVEL=$(grep ^PATCHLEVEL "${KLIB_BUILD}/Makefile" | awk -F' ' '{print $3}')
          SUBLEVEL=$(grep ^SUBLEVEL "${KLIB_BUILD}/Makefile" | awk -F' ' '{print $3}')
          KVER="${KVERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          OUT_MODULES="${ROOT_PATH}/output/update"
          mkdir -p "${OUT_MODULES}"
          find "${OOT_ROOT}/drivers/gpu/drm" -name '*.ko' -exec cp -f {} "${OUT_MODULES}/" \;
          find "${OOT_ROOT}/drivers/char/agp" -name '*.ko' -exec cp -f {} "${OUT_MODULES}/" \; 2>/dev/null || true
          find "${OOT_ROOT}" -maxdepth 1 -name '*.ko' -exec cp -f {} "${OUT_MODULES}/" \;
          find "${OUT_MODULES}" -name '*.ko' -exec ${CROSS_COMPILE}strip --strip-debug {} \;

          COUNT=$(find "${OUT_MODULES}" -name '*.ko' | wc -l)
          echo "[${PLATFORM}-${VERSION}] 产出 ${COUNT} 个 .ko:"
          ls -l "${OUT_MODULES}"
          # 正常 17–20 个（Task#204 起含 radeon.ko）；少于 10 说明构建树/收集路径异常，尽早暴露
          [ "${COUNT}" -ge 10 ] || { echo "[E] 产物数量异常: ${COUNT}" >&2; exit 1; }

          tar -zcf "${ROOT_PATH}/drm4-${PLATFORM}-${VERSION}-${KVER}.tgz" -C "${ROOT_PATH}/output" .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drm4-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            drm4-*.tgz

  release:
    runs-on: ubuntu-latest
    needs: [i915, drm4]
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: download to artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: i915-*
          merge-multiple: true

      - name: download 4.x artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: drm4-*
          merge-multiple: true

      - name: delete-artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            i915-*
            drm4-*

      - name: firmware
        run: |
          ROOT_PATH=${{ github.workspace }}

          echo "extract all modules"
          OUT_MODULES="${ROOT_PATH}/syno-modules/thirdparty"
          for F in output/*.tgz; do
            echo "${F}"
            DIR_NAME="${OUT_MODULES}/$(echo $(basename "${F}" .tgz 2>/dev/null) | sed -E 's/^(i915|drm4)-//')"
            rm -rf "${DIR_NAME}"
            mkdir -p "${DIR_NAME}"
            tar -zxf "${F}" -C "${DIR_NAME}" || echo "Failed to extract ${F}"
          done

          SOURCE="${ROOT_PATH}/linux-firmware"
          DEST="${OUT_MODULES}/firmware"
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git ${SOURCE}
          [ -d "${SOURCE}/intel/iwlwifi" ] && cp -rf ${SOURCE}/intel/iwlwifi/* ${SOURCE}/ 2>/dev/null # Move intel firmware to top dir for easy search
          while read L; do
            [ -z "${L}" ] && continue
            if [ -e "${SOURCE}/${L}" ]; then
              mkdir -p "$(dirname "${DEST}/${L}")"
              cp -vf "${SOURCE}/${L}" "${DEST}/${L}"
            else
              echo "::warning ::Missing ${L}"
            fi
          done <<<$(find "${OUT_MODULES}" -name \*.ko -exec /sbin/modinfo -F firmware {} 2>/dev/null \;)

      - name: Check and Push
        run: |
          cd syno-modules
          git pull
          status=$(git status -s | grep -E 'thirdparty' | awk '{printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update $(date +%Y-%m-%d" "%H:%M:%S)"
            git push
          fi
