#
# 2in1 GPT 引导盘构建：
#   checkout myp015/ainas-2in1（secrets.AiNas）
#   → script/install-grub-2.14.sh 构建 grub-2.14（i386-pc/i386-efi/x86_64-efi）
#   → script/2in1_grubmake-gpt.sh 生成 18G GPT 双引导镜像
#   → push 回 myp015/ainas-2in1 的 img/（secrets.AiNas）
#
# 基础镜像按 DSM 版本族二选一（脚本第 3 个参数）：
#   7.2 → grub.img.gz       P1=16777216 扇区(8GiB)，起点 8192
#   6.2 → grub_6.2.img.gz   P1=4980480 扇区(2.375GiB)，起点 2048（对齐真机 synopartition）
# 两者 P6(RAMDISK) 均为 2560MiB = 2.5GiB：loader p3 载荷已约 2.0GB，2GiB 会 ENOSPC
# 下游 2in1func.sh 的 docker_build 按 DSM 主版本自动挑对应文件。
#
# 说明：2in1_grubmake-gpt.sh 直接使用脚本同目录的 mdadm-syno（<script_dir>/mdadm-syno）。
#

name: Build 2in1-grub

on:
  workflow_dispatch:
    inputs:
      push:
        description: "push"
        default: false
        type: boolean
      disk_size:
        description: "整盘大小 (如 18G / 20G)"
        default: "18G"
        type: string
      p6_size_mib:
        description: "P6(RAMDISK) 大小 MiB"
        default: "2560"
        type: string
      dsm_version:
        description: "DSM 版本族（决定 P1 布局与产物名）"
        type: choice
        options:
          - "7.2"
          - "6.2"
        default: "7.2"

jobs:
  grub:
    # 固定 24.04：ubuntu-latest 已于 2026-10-19 迁移到 Ubuntu 26.04，
    # 新版 binutils 的 `-Wl,-N` 会把 ELF 头映射进首个 PT_LOAD，
    # 导致 grub 2.14 i386-pc 的 kernel.img 链接错位（.text 落在 0x9074）。
    # 24.04 的 binutils 2.42 仍按旧行为产出，可避免该问题而不必改 grub 源码。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.AiNas }}

      - name: Checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: ainas-2in1

      - name: Initialization environment
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo apt update
          sudo apt install -y autoconf autoconf-archive automake autopoint build-essential pkg-config bison flex gettext gawk libtool
          sudo apt install -y libfreetype6-dev unifont fonts-dejavu libfuse-dev libzfslinux-dev liblzma-dev libdevmapper-dev
          sudo apt install -y dosfstools e2fsprogs btrfs-progs parted qemu-utils gzip grub-common

      - name: Build grub-2.14
        run: |
          bash ainas-2in1/script/install-grub-2.14.sh "grub-2.14" "i386-pc i386-efi x86_64-efi"

      - name: Make 2in1 GPT image
        run: |
          bash ainas-2in1/script/2in1_grubmake-gpt.sh "${{ inputs.disk_size }}" "${{ inputs.p6_size_mib }}" "${{ inputs.dsm_version }}"

      - name: Upload artifact
        if: success() && inputs.push == false
        uses: actions/upload-artifact@v7
        with:
          name: grub
          path: |
            grub*.img.gz
          retention-days: 5

      - name: Check and Push
        if: success() && inputs.push == true
        run: |
          # 产物名必须与 2in1_grubmake-gpt.sh 的 DSM 版本族一致
          case "${{ inputs.dsm_version }}" in
            6 | 6.*) IMG="grub_6.2.img.gz" ;;
            7 | 7.*) IMG="grub.img.gz" ;;
            *)
              echo "[E] 不支持的 DSM 版本: ${{ inputs.dsm_version }}"
              exit 1
              ;;
          esac
          [ -f "${IMG}" ] || { echo "[E] ${IMG} 未生成"; exit 1; }

          mv -f "${IMG}" "ainas-2in1/img/${IMG}"

          cd ainas-2in1
          echo "Git push ..."
          git pull
          status=$(git status -s | grep -F "img/${IMG}" | awk '{printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update $(date +%Y-%m-%d" "%H:%M:%S)"
            git push -f
          fi
