# RR 原版结构（保持不动），仅仓库地址适配 myp015：
#   checkout RROrg/buildroot        → myp015/ainas-buildroot（公开，免 RRORG token）
#   version 查 RROrg/rr-buildroot   → myp015/ainas-buildroot（公开 API 免 token）
#   Release 发 RROrg/rr-buildroot   → myp015/ainas-buildroot（GITHUB_TOKEN）
#

name: Build buildroot

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean
      br2ver:
        description: "buildroot version"
        default: "2024.02.x"
        type: string
      kerver:
        description: "kernel version"
        default: ""
        type: string
jobs:
  buildroot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
          repository: myp015/ainas-buildroot
          path: buildroot

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Initialization environment
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo apt update
          sudo apt install -y locales busybox dialog gettext sed gawk jq curl libncurses-dev
          sudo apt install -y python-is-python3 python3-pip libelf-dev qemu-utils parted dosfstools cpio xz-utils lz4 lzma bzip2 gzip zstd
          # sudo snap install yq
          if ! type yq >/dev/null 2>&1 || ! yq --version 2>/dev/null | grep -q "v4."; then
            sudo curl -kL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/bin/yq && sudo chmod a+x /usr/bin/yq
          fi

          df -h

      - name: Calculate version
        run: |
          # 按月低增版本号（26.10.0 / 26.10.1 ...），同月重复发布第 3 段 +1
          # 显式传入 version 且格式匹配当前年月时，以传入为准；否则自动计算
          # （对齐 cks.yml：原逻辑空输入时 VERSION 保持空 → 只出 test zip 不发布；
          # 修复后空输入也走自动计算并发布）
          if [ -n "${{ inputs.version }}" ] && [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 自动：查 ainas-buildroot 最新 tag，同月则第 3 段 +1，跨月则 .0
            # （ainas-buildroot 公开仓库，公开 API 免 token）
            LATEST_TAG="$(curl -skL "https://api.github.com/repos/myp015/ainas-buildroot/releases" | jq -r '.[0].tag_name' 2>/dev/null)"
            if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              if [ "$(echo ${LATEST_TAG} | awk -F '.' '{print NF}')" -ge 4 ]; then
                # 旧格式 4 段 tag（如 26.9.13.1）不参与低增，回退到月份首版
                VERSION="$(date +'%y.%-m').0"
              else
                VERSION="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              fi
            else
              VERSION="$(date +'%y.%-m').0"
            fi
          fi

          # 防残留 tag 冲突：Calculate version 只查 releases[0]，历史失败 run 可能
          # 留下 git tag 但无 release 对象 → release-action 422 already_exists。
          # 循环 +1 直到对应 git tag 不存在（最多 20 次防死循环）。
          for i in $(seq 1 20); do
            if curl -skL \
                 "https://api.github.com/repos/myp015/ainas-buildroot/git/refs/tags/${VERSION}" 2>/dev/null \
                 | grep -q '"ref"'; then
              VERSION="$(echo ${VERSION} | awk -F '.' '{$3=$3+1}1' OFS='.')"
            else
              break
            fi
          done

          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build buildroot
        run: |
          cd buildroot
          chmod +x ./build_rr.sh
          . ./build_rr.sh "${{ inputs.br2ver }}" "${{ inputs.kerver }}"

          [ -n "${BUILDROOT_VERSION}" ] && echo "BUILDROOT_VERSION=${BUILDROOT_VERSION}" >> $GITHUB_ENV || exit 1
          [ -n "${KERNEL_VERSION}" ] && echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV || exit 1

      - name: Zip modules
        run: |
          cp -f buildroot/.rr-buildroot/output/images/bzImage bzImage-rr || exit 1
          cp -f buildroot/.rr-buildroot/output/images/rootfs.cpio.zst initrd-rr || exit 1

          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          echo "${VERSION}" > "VERSION"
          zip -9 ${{ github.workspace }}/buildroot-${VERSION}.zip -j bzImage-rr initrd-rr VERSION

      - name: Upload artifact
        if: success() && env.VERSION == ''
        uses: actions/upload-artifact@v7
        with:
          name: buildroot
          path: |
            buildroot*.zip
          retention-days: 5

      - name: Release
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: buildroot*.zip
          body: |
            Buildroot version: ${{ env.BUILDROOT_VERSION }}
            Kernel version: ${{ env.KERNEL_VERSION }}
          owner: myp015
          repo: buildroot
          # GITHUB_TOKEN 仅限当前仓库（ainas-build），跨仓库发布 myp015/ainas-buildroot
          # 需 PAT（secrets.AiNas 即用户 PAT，实测对 buildroot 有 release 写权限）
          token: ${{ secrets.AiNas }}
