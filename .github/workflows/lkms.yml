name: Build lkms

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          # === 临时缩减矩阵：仅编译 4.x(geminilake) + 5.x(epyc7002) 验证本次改动，通过后恢复全矩阵 ===
          - version: 7.4
            platform: geminilake
          - version: 7.4
            platform: epyc7002

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-lkm
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
          repository: myp015/ainas-lkm
          path: ainas-lkm

      - name: Checkout ainas-lkm5
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
          repository: myp015/ainas-lkm5
          path: ainas-lkm5

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make lkms
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-lkm/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do
            if makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}"; then
              break
            fi
            if [ "${i}" -lt 3 ]; then
              echo "Retry makeEnvDeploy ${i}/3"
              sleep 30
            else
              echo "makeEnvDeploy failed after 3 tries"
              exit 1
            fi
          done

          echo "makelkms"
          SRC_DIR="$(_lkm_src "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          makelkms "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${SRC_DIR}" "${ROOT_PATH}/output"

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rp-lkms-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            output/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        run: |
          # 按月低增版本号（26.10.0 / 26.10.1 ...），同月重复发布第 3 段 +1
          # 显式传入 version 且格式匹配当前年月时，以传入为准；否则自动计算
          # （对齐 cks.yml：原逻辑空输入时 VERSION 保持空 → 只出 test zip 不发布；
          # 修复后空输入也走自动计算并发布）
          if [ -n "${{ inputs.version }}" ] && [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 自动：查 ainas-lkm 最新 tag，同月则第 3 段 +1，跨月则 .0
            LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.AiNas }}" "https://api.github.com/repos/myp015/ainas-lkm/releases" | jq -r '.[0].tag_name' 2>/dev/null)"
            if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              if [ "$(echo ${LATEST_TAG} | awk -F '.' '{print NF}')" -ge 4 ]; then
                # 旧格式 4 段 tag（如 26.9.13.1）不参与低增，回退到月份首版
                VERSION="$(date +'%y.%-m').0"
              else
                VERSION="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              fi
            else
              VERSION="$(date +'%y.%-m').0"
            fi
          fi

          # 防残留 tag 冲突：Calculate version 只查 releases[0]，历史失败 run 可能
          # 留下 git tag 但无 release 对象 → release-action 422 already_exists。
          # 循环 +1 直到对应 git tag 不存在（最多 20 次防死循环）。
          for i in $(seq 1 20); do
            if curl -skLH "Authorization: token ${{ secrets.AiNas }}" \
                 "https://api.github.com/repos/myp015/ainas-lkm/git/refs/tags/${VERSION}" 2>/dev/null \
                 | grep -q '"ref"'; then
              VERSION="$(echo ${VERSION} | awk -F '.' '{$3=$3+1}1' OFS='.')"
            else
              break
            fi
          done

          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: download to artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: rp-lkms-*
          merge-multiple: true

      - name: delete-artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            rp-lkms-*

      - name: Zip lkms
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          echo "${VERSION}" > "output/VERSION"
          zip -9 rp-lkms-${VERSION}.zip -j output/*

      - name: Upload to Artifacts
        if: success() && env.VERSION == ''
        uses: actions/upload-artifact@v7
        with:
          name: rp-lkms
          path: |
            rp-lkms*.zip
          retention-days: 5

      - name: Release
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: rp-lkms*.zip
          owner: myp015
          repo: ainas-lkm
          token: ${{ secrets.AiNas }}
