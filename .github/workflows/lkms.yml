name: Build lkms

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean
      lkm_ref:
        description: "ainas-lkm and ainas-lkm5 ref"
        default: main
        type: string

jobs:
  # 平台×版本矩阵的单一来源：.github/matrix/build.json
  # （modules.yml / lkms.yml 原本各自内联了 195 行逐字节相同的 include 块）
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Generate matrix
        id: gen
        run: |
          echo "matrix=$(jq -c '{include: .include}' .github/matrix/build.json)" >>"$GITHUB_OUTPUT"
          echo "生效 $(jq '.include | length' .github/matrix/build.json) 项；" \
               "已禁用 $(jq '.disabled | length' .github/matrix/build.json) 项；" \
               "不支持 $(jq '.unsupported | length' .github/matrix/build.json) 项"
  build:
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-lkm
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
          repository: myp015/ainas-lkm
          ref: ${{ inputs.lkm_ref }}
          path: ainas-lkm

      - name: Checkout ainas-lkm5
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
          repository: myp015/ainas-lkm5
          ref: ${{ inputs.lkm_ref }}
          path: ainas-lkm5

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make lkms
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-lkm/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do
            if makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}"; then
              break
            fi
            if [ "${i}" -lt 3 ]; then
              echo "Retry makeEnvDeploy ${i}/3"
              sleep 30
            else
              echo "makeEnvDeploy failed after 3 tries"
              exit 1
            fi
          done

          echo "makelkms"
          SRC_DIR="$(_lkm_src "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          makelkms "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${SRC_DIR}" "${ROOT_PATH}/output"

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rp-lkms-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            output/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/calc_version.sh" "myp015/ainas-lkm" "${{ inputs.version }}"

      - name: download to artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: rp-lkms-*
          merge-multiple: true

      - name: delete-artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            rp-lkms-*

      - name: Zip lkms
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          echo "${VERSION}" > "output/VERSION"
          zip -9 rp-lkms-${VERSION}.zip -j output/*

      - name: Release
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: rp-lkms*.zip
          owner: myp015
          repo: ainas-lkm
          token: ${{ secrets.AiNas }}
