name: Build lkms

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean
      lkm_ref:
        description: "ainas-lkm and ainas-lkm5 ref"
        default: main
        type: string

