#
# Task#202 测试工作流：在 Intel i915 6.5 backport 栈中编译 amdgpu（AMD/Intel 共存）
#
# 与 modules-3rd.yml 的区别：
#   1. checkout 的是 kernel 仓库的 amd-backport 分支（尚未合并到默认分支）；
#   2. 使用 make defconfig-amd（i915 + amdgpu，参数对齐 root 5.10 版）；
#   3. 只跑 geminilakenk，产物仅上传 artifact，不回写 syno-modules。
# 验证通过后再把同样步骤合入 modules-3rd.yml。
#
name: AMD backport test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'kernel fork 分支'
        required: false
        default: 'amd-backport'

jobs:
  amd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 7.4
            platform: geminilakenk
          - version: 7.2
            platform: geminilakenk

    runs-on: ubuntu-latest
    steps:
      - name: Checkout backport fork
        uses: actions/checkout@main
        with:
          repository: myp015/intel-gpu-i915-backports
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AiNas }}
          path: intel-gpu-i915-backports

      - name: Build
        run: |
          set -euo pipefail
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          echo "getting toolkit"
          for N in env dev; do
            curl -skL "https://global.synologydownload.com/download/ToolChain/toolkit/${VERSION}/${PLATFORM}/ds.${PLATFORM}-${VERSION}.${N}.txz" -o "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz"
          done

          for N in env dev; do
            [ ! -f "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz" ] && {
              echo "ds.${PLATFORM}-${VERSION}.${N}.txz file not found"
              exit 1
            }
            mkdir -p "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}"
            tar -xhf "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}.txz" -C "${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.${N}"
          done

          export CROSS_COMPILE=${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.env/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KLIB_BUILD=${ROOT_PATH}/ds.${PLATFORM}-${VERSION}.dev/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${VERSION}/build

          cd "${ROOT_PATH}/intel-gpu-i915-backports"
          make defconfig-amd
          make -j"$(nproc)" 2>&1 | tee "${ROOT_PATH}/build.log"
          make -C "${KLIB_BUILD}" M="${PWD}" INSTALL_MOD_PATH="${PWD}/intermediates" \
               INSTALL_MOD_STRIP=1 CONFIG_MODULE_SIG_ALL= _emodinst_

          mkdir -p "${ROOT_PATH}/output/update"
          find "${PWD}/intermediates" -type f -name '*.ko' -exec mv {} "${ROOT_PATH}/output/update" \;
          ls -lh "${ROOT_PATH}/output/update"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.version }}-${{ matrix.platform }}
          path: build.log
          if-no-files-found: warn

      - name: Upload modules
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amd-modules-${{ matrix.version }}-${{ matrix.platform }}
          path: output/update
          if-no-files-found: warn
