# 双源 RR 工作流：每次编译选择一个 RR 源
#   ainas → myp015/ainas-rr（镜像 myp015/rr，支持 DSM 6.2）
#   RROrg → RROrg/rr（镜像 wjz304/rr，不支持 DSM 6.2）
# Release 命名：ainas → ainas-rr-<版本>；RROrg → RROrg-rr-<版本>
# 型号勾选项只用 7 个通用型号；DVA 系列等请通过 custom_models 手动输入。
name: Build RR
on:
  workflow_dispatch:
    inputs:
      rr_source:
        description: "RR 源（每次编译只能选一个）"
        type: choice
        options:
          - ainas
          - RROrg
        default: ainas
      all_models:
        description: "编译模式"
        type: choice
        options:
          - 自选
          - 全选
        default: 全选
      model_ds918p:
        description: "DS918+"
        type: boolean
        default: false
      model_ds920p:
        description: "DS920+"
        type: boolean
        default: false
      model_ds923p:
        description: "DS923+"
        type: boolean
        default: false
      model_ds925p:
        description: "DS925+"
        type: boolean
        default: false
      model_ds3622xsp:
        description: "DS3622xs+"
        type: boolean
        default: false
      model_sa6400:
        description: "SA6400"
        type: boolean
        default: false
      model_ds425p:
        description: "DS425+"
        type: boolean
        default: false
      custom_models:
        description: "自定义型号(工作流未列出的,多个用逗号分隔,如 DS1621+,DVA3221,RS4021xs+)"
        type: string
        default: ""
      overwrite_base:
        description: "覆盖所选源的 rr-base（默认复用 Release 中已存在的 base）"
        type: boolean
        default: false
      overwrite_update:
        description: "覆盖所选型号的 update 包（默认复用 Release 中已存在的 updateall-<型号>-<RR版本>.zip）"
        type: boolean
        default: false
      build_rr_original:
        description: "生成原版 RR 镜像（rr-版本号.img.zip，跳过 Docker 编译）默认开启，可取消"
        type: boolean
        default: true
      rr_version:
        description: "RR version (可选,留空=latest;指定版本必须在所选源中存在，不做回退)"
        type: string
        default: ""
      dsm_version:
        description: "DSM 版本编号（6.2.4 仅 ainas 源支持；RROrg 源不支持 6.2）"
        type: choice
        options:
          - "6.2.4"
          - "7.2.1"
          - "7.2.2"
          - "7.3.0"
          - "7.3.1"
          - "7.3.2"
          - "7.4.1"
        default: "7.2.1"

jobs:
  # 一次性解析源版本、选择型号并生成 matrix 任务，下游只读 needs.plan.outputs。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.plan.outputs.source }}
      rr_tag: ${{ steps.plan.outputs.rr_tag }}
      rr_asset_url: ${{ steps.plan.outputs.rr_asset_url }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_title: ${{ steps.plan.outputs.release_title }}
      release_notes: ${{ steps.plan.outputs.release_notes }}
      base_asset: ${{ steps.plan.outputs.base_asset }}
      docker_image: ${{ steps.plan.outputs.docker_image }}
      docker_tag: ${{ steps.plan.outputs.docker_tag }}
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7

      - name: 规划源与构建任务
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
          RR_SOURCE: ${{ inputs.rr_source }}
          RR_VERSION: ${{ inputs.rr_version }}
          DSM_VERSION: ${{ inputs.dsm_version }}
          ALL_MODELS: ${{ inputs.all_models }}
          CUSTOM_MODELS: ${{ inputs.custom_models }}
          BUILD_RR_ORIGINAL: ${{ inputs.build_rr_original }}
          MODEL_DS918P: ${{ inputs.model_ds918p }}
          MODEL_DS920P: ${{ inputs.model_ds920p }}
          MODEL_DS923P: ${{ inputs.model_ds923p }}
          MODEL_DS925P: ${{ inputs.model_ds925p }}
          MODEL_DS3622XSP: ${{ inputs.model_ds3622xsp }}
          MODEL_SA6400: ${{ inputs.model_sa6400 }}
          MODEL_DS425P: ${{ inputs.model_ds425p }}
        run: bash .github/scripts/plan_sources.sh rr

  # 单独串行创建并确认 Release，避免原版/update matrix 任务同时创建/查询同一标签。
  ensure-release:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: 创建或确认 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.plan.outputs.release_title }}
          RELEASE_NOTES: ${{ needs.plan.outputs.release_notes }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          for attempt in $(seq 1 12); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "[INFO] Release 已确认可见: $RELEASE_TAG（源=${SOURCE}）"
              exit 0
            fi
            echo "[INFO] 创建或确认 Release: $RELEASE_TAG（源=${SOURCE}）(${attempt}/12)"
            set +e
            create_out=$(gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest=false 2>&1)
            create_rc=$?
            set -e
            if [ "$create_rc" -eq 0 ]; then
              echo "[INFO] Release 创建成功，等待 API 可见"
            else
              echo "$create_out"
              if ! echo "$create_out" | grep -qiE 'already exists|already_exists|Validation Failed|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate'; then
                exit "$create_rc"
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "[E] Release ${RELEASE_TAG} 创建/查询连续失败" >&2
          exit 1

  # 公共 base：下载 RR、cpuinfo/initrd 补丁这些与型号无关的工作每个源只做一次，
  # 作为 Release 资产永久存放。不在本 job 做 patch_part1（grub.cfg 与型号/原版相关）。
  prepare-base:
    needs: [plan, ensure-release]
    runs-on: ubuntu-24.04
    env:
      RR_ASSET_URL: ${{ needs.plan.outputs.rr_asset_url }}
      RR_TAG: ${{ needs.plan.outputs.rr_tag }}
      TAG: ${{ needs.plan.outputs.rr_tag }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      BASE_ASSET: ${{ needs.plan.outputs.base_asset }}
      SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查是否复用已有 base
        id: check
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          OVERWRITE_BASE: ${{ inputs.overwrite_base }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          EXISTS="false"
          if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "$BASE_ASSET" \
             || printf '%s\n' "$ASSET_NAMES" | grep -Fxq "${BASE_ASSET}.part.000"; then
            EXISTS="true"
          fi

          if [ "$EXISTS" = "true" ] && [ "${OVERWRITE_BASE:-false}" != "true" ]; then
            echo "[INFO] Release ${RELEASE_TAG}（源=${SOURCE}）已存在 ${BASE_ASSET}，复用（未勾选覆盖）"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] 需要构建 base（exists=${EXISTS} overwrite=${OVERWRITE_BASE:-false}）"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout ainas-2in1
        if: steps.check.outputs.rebuild == 'true'
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载 RR 镜像
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${RR_TAG:?缺少 RR_TAG}"
          : "${RR_ASSET_URL:?缺少 RR_ASSET_URL}"
          RR_FILENAME="rr-${RR_TAG}.img.zip"
          curl -fsSL --connect-timeout 10 "$RR_ASSET_URL" -o "$RR_FILENAME"
          echo "RR_FILENAME=${RR_FILENAME}" >> "$GITHUB_ENV"

      - name: 构建公共 base
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PART3_PATH="/mnt/p3"

          . "$AINAS2IN1_DIR/script/2in1func.sh"

          echo "[INFO] 安装构建依赖"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext cpio zstd dosfstools rsync qemu-utils >/dev/null

          unzip -q "$RR_FILENAME" -d rr rr.img

          # ── p3：cpuinfo + initrd 补丁（与型号无关）─────────────────
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img

          # 分区节点异步创建，等待就绪后再挂载
          for _ in $(seq 1 40); do [ -b "${DISK_LOOP}p3" ] && break; sleep 0.25; done
          [ -b "${DISK_LOOP}p3" ] || { echo "[E] 镜像分区未就绪：${DISK_LOOP}p3" >&2; exit 1; }
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"

          # addons/modules/lkms/cks 全部取自 rr.img：不调用 get* 覆盖 myp015 Release 资产
          for d in cks lkms addons modules; do
            if [ ! -d "${PART3_PATH}/${d}" ] || [ -z "$(ls -A "${PART3_PATH}/${d}")" ]; then
              echo "[E] rr.img 的 p3 缺少内置资产目录或为空: ${d}" >&2
              exit 1
            fi
          done
          for f in "addons/cpuinfo/all.tgz"; do
            if [ ! -f "${PART3_PATH}/${f}" ]; then
              echo "[E] rr.img 的 p3 缺少内置资产: ${f}" >&2
              exit 1
            fi
          done
          # lkm 也直接用 rr.img 内置的（不做 ainas-lkm 覆盖）
          echo "[INFO] 源=${SOURCE}：lkms/cks/addons/modules 均取自 rr.img"

          patch_cpuinfo "${PART3_PATH}/addons" "rr"
          patch_ram "$PART3_PATH" rr "$WORKDIR" verify

          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          sudo rm -rf "$PART3_PATH"

          rm -rf "$AINAS2IN1_DIR"

          # 预压缩；Release 单文件超过 2GB 时上传前再分卷
          zstd -3 -T0 -q -f rr/rr.img -o rr-base.img.zst

      # 上传到 ainas-2in1 的 Release（与最终镜像放在一起），Release 资产默认永久保存。
      # 单文件超过 GitHub 2GB 上限时按 release_publish.sh 同样的 1900MB 规则分卷。
      - name: 上传公共 base 到 Release
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          mv -f rr-base.img.zst "$BASE_ASSET"
          SIZE=$(stat -c%s "$BASE_ASSET")
          echo "[INFO] base 大小=${SIZE} 字节"
          UPLOAD_FILES=()
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "[INFO] 超过 GitHub 单文件 2GB 上限，按 1900MB 分卷"
            rm -f "${BASE_ASSET}.part."*
            split -b 1900M -d -a 3 "$BASE_ASSET" "${BASE_ASSET}.part."
            UPLOAD_FILES=("${BASE_ASSET}".part.*)
          else
            UPLOAD_FILES=("$BASE_ASSET")
          fi

          # 先删除同名旧资产，避免单文件/分卷形态切换后残留旧内容
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$BASE_ASSET"|"$BASE_ASSET".part.*) gh release delete-asset "$RELEASE_TAG" "$name" --yes ;;
            esac
          done

          gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}"
          echo "[INFO] base 已上传到 Release: ${RELEASE_TAG}"

  build:
    name: ${{ matrix.kind == 'original' && 'build (rr-original)' || format('build ({0})', matrix.model) }}
    needs: [plan, prepare-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      IMAGE_FORMAT: img
      LANGUAGE: zh_CN
      KERNEL: official
      ADDONS: acpid,reboottoloader,addincards,cpuinfo,expands,diskcompat,lsiutil,nvmevolume,powersched,remotefs,storagepanel,smartctl,trivial,apppatch,vmtools
      ACTION_TOKEN: ${{ secrets.AiNas }}
      LINE: ${{ inputs.dsm_version }}
      SOURCE: ${{ needs.plan.outputs.source }}
      TAG: ${{ needs.plan.outputs.rr_tag }}
      RR_TAG: ${{ needs.plan.outputs.rr_tag }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_NOTES: ${{ needs.plan.outputs.release_notes }}
      BASE_ASSET: ${{ needs.plan.outputs.base_asset }}
      RR_DOCKER_IMAGE: ${{ needs.plan.outputs.docker_image }}
      RR_DOCKER_TAG: ${{ needs.plan.outputs.docker_tag }}
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7

      - name: 初始化环境
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载公共 base
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          : "${BASE_ASSET:?缺少 BASE_ASSET}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          mkdir -p base
          gh release download "$RELEASE_TAG" \
            --pattern "${BASE_ASSET}*" \
            --dir base --clobber
          if [ -f "base/${BASE_ASSET}" ]; then
            echo "[INFO] base 为单文件"
          else
            # 超过 2GB 时 Release 只存分卷，编译步骤按文件名顺序流式合并解压
            compgen -G "base/${BASE_ASSET}.part.*" >/dev/null || {
              echo "[E] Release ${RELEASE_TAG} 中未找到 base 资产 ${BASE_ASSET}" >&2
              exit 1
            }
            echo "[INFO] base 为分卷，编译步骤将流式合并解压（不落盘合并文件）"
          fi

      - name: 编译镜像
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
          OVERWRITE_UPDATE: ${{ inputs.overwrite_update }}
        run: |
          set -euo pipefail

          # ── 系统依赖 ───────────────────────────────────────────────
          echo "[INFO] 安装构建依赖"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext cpio zstd dosfstools rsync qemu-utils >/dev/null

          # ── 恢复公共 base ──────────────────────────────────────────
          # 下载 RR、cpuinfo/initrd 补丁等与型号无关的步骤已在 prepare-base 完成，
          # 这里只解压，供后续按型号/场景收尾。
          mkdir -p rr
          if [ -f "base/${BASE_ASSET}" ]; then
            zstd -d -q -f "base/${BASE_ASSET}" -o rr/rr.img
          else
            # 分卷直接流式解压，避免额外落盘一份合并文件占用 runner 磁盘
            compgen -G "base/${BASE_ASSET}.part.*" >/dev/null || {
              echo "[E] 未找到公共 base: base/${BASE_ASSET}" >&2
              exit 1
            }
            cat base/${BASE_ASSET}.part.* | zstd -d -q -f - -o rr/rr.img
          fi
          rm -rf base

          # ── 目录与常量 ────────────────────────────────────────────
          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          # 流程函数库（patch_* / docker_* / repack_*）
          . "$AINAS2IN1_DIR/script/2in1func.sh"

          # DSM 版本映射由上面 source 的 2in1func.sh 提供（pick_dsm_version）

          LINE_REQ="${LINE:-7.2.1}"
          if echo "${MODEL}" | grep -Eq '^(DS925\+|DS425\+)$' && [ "${LINE_REQ}" = "7.2.1" ]; then
            echo "[INFO] ${MODEL} 不支持 DSM 7.2.1，自动切换到 7.2.2"
            LINE_REQ="7.2.2"
          fi

          VERSION="$(pick_dsm_version "${LINE_REQ}")"
          VER_MAIN="${VERSION%%-*}"
          VER_MAIN_NODOT="${VER_MAIN//./}"
          VER_BUILD="${VERSION#*-}"
          VER_BUILD="${VER_BUILD%%-*}"
          VER_SLUG="${VER_MAIN_NODOT}_${VER_BUILD}"
          # 制品品牌随源区分：RROrg → RROrg_rr，ainas → ainas_rr
          if [ "${SOURCE}" = "RROrg" ]; then ARTIFACT_BRAND="RROrg_rr"; else ARTIFACT_BRAND="ainas_rr"; fi
          if [ "${MODEL}" = "__RR_ORIGINAL__" ]; then
            ARTIFACT_NAME="${ARTIFACT_BRAND}-${RR_TAG}"
            echo "[INFO] 原版 RR 镜像任务：ARTIFACT_NAME=${ARTIFACT_NAME}"
          else
            ARTIFACT_NAME="${MODEL}_${VER_SLUG}_${ARTIFACT_BRAND}"
          fi
          echo "[INFO] 型号=${MODEL} 目标DSM版本=${VERSION} DSM系列=${LINE_REQ} 版本slug=${VER_SLUG} 源=${SOURCE}"

          # ── GRUB 修补 ─────────────────────────────────────────────
          # RR 原版镜像任务无型号，MODEL_ENV 置空 → patch 脚本默认 model=Boot DSM
          # 官方 p1 没有 .locale，gettext 会回退原始 msgid；显式设为中文，
          # 确保 zh_CN/rr.mo 中的 AiNas 文案生效；后续可在菜单切换其他语言。
          if [ "${MODEL}" = "__RR_ORIGINAL__" ]; then
            GRUB_MODEL_ENV=""
            GRUB_LOCALE="zh_CN.UTF-8"
          else
            GRUB_MODEL_ENV="$MODEL"
            GRUB_LOCALE=""
          fi
          patch_part1 rr/rr.img "$PART1_PATH" rr "$GRUB_MODEL_ENV" "$GRUB_LOCALE"

          # 原版 RR 镜像任务跳过 Docker 编译，镜像无需 attached；
          # 其它型号必须保持 attached：容器内 .bashrc 按分区 label 挂载 p1/p2/p3
          if [ "${MODEL}" != "__RR_ORIGINAL__" ]; then
            DISK_LOOP=$(sudo losetup -f)
            sudo losetup -P "$DISK_LOOP" rr/rr.img

            # 分区节点异步创建，等待就绪后再挂载
            for _ in $(seq 1 40); do [ -b "${DISK_LOOP}p3" ] && break; sleep 0.25; done
            [ -b "${DISK_LOOP}p3" ] || { echo "[E] 镜像分区未就绪：${DISK_LOOP}p3" >&2; exit 1; }
            sudo mkdir -p "$PART1_PATH" "$PART3_PATH"

            # ── 使用 RR Docker 编译镜像 ─────────────────────────────
            docker_build rr "$MODEL" "$VERSION" "$LANGUAGE" "$ADDONS" "$RR_DOCKER_TAG" \
              "$WORKDIR"

            # ── 清理 p3 临时文件 + 按型号裁剪资产 ───────────────────
            sudo mkdir -p "$PART3_PATH"
            sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
            sudo rm -rf "$PART3_PATH/dl" "$PART3_PATH/auxfiles" "$PART3_PATH/logs"
            trim_p3_assets "$PART3_PATH" "$MODEL"
            sudo umount "$PART3_PATH"
            sudo losetup --detach "$DISK_LOOP"

            # ── 型号升级包 ──────────────────────────────────────────
            # p3 已按平台裁剪，lkm/modules/cks 与该型号对应，因此升级包按型号拆分：
            # updateall-<型号>-<RR 版本>.zip。Release 已有且未勾选覆盖时直接复用。
            UPDATE_ZIP=""
            UPDATE_ASSET="updateall-${MODEL}-${RR_TAG}.zip"
            UPDATE_ASSETS="$(GH_TOKEN="$ACTION_TOKEN" GH_REPO="myp015/ainas-2in1" \
              gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$UPDATE_ASSETS" | grep -Fxq "$UPDATE_ASSET" \
               && [ "${OVERWRITE_UPDATE:-false}" != "true" ]; then
              echo "[INFO] Release ${RELEASE_TAG} 已存在 ${UPDATE_ASSET}，复用（未勾选覆盖）"
            else
              AINAS2IN1_DIR="$AINAS2IN1_DIR" bash -c "$(declare -f pack_update); pack_update \"\$@\"" _ rr/rr.img "$GITHUB_WORKSPACE" "" "rr"
              RAW_UPDATE_ZIP="$(find . -maxdepth 1 -name 'updateall-*.zip' -print -quit)"
              [ -n "$RAW_UPDATE_ZIP" ] && [ -f "$RAW_UPDATE_ZIP" ] || {
                echo "[E] 未生成 updateall-*.zip" >&2
                exit 1
              }
              mv -f "$RAW_UPDATE_ZIP" "$UPDATE_ASSET"
              UPDATE_ZIP="$UPDATE_ASSET"
              echo "[INFO] 升级包已生成: ${UPDATE_ASSET}"
            fi
            echo "UPDATE_ZIP=$UPDATE_ZIP" >> "$GITHUB_ENV"

            rm -f "$WORKDIR/2in1func.sh"
          fi

          # ── 提取 user-config.yml + 选择引导镜像 + Repack 镜像 ─────
          # 镜像大小固定 2.5GB（原 image_size 选项已移除），写法对齐 ova.yml
          if [ "${MODEL}" = "__RR_ORIGINAL__" ]; then
            repack_rr rr/rr.img "$RR_TAG" "$WORKDIR" "2.5GB" keep
          else
            repack_rr rr/rr.img "$RR_TAG" "$WORKDIR" "2.5GB"
          fi

          # ── 导出并打包制品 ────────────────────────────────────────
          case "$IMAGE_FORMAT" in
            img)
              if [ "${MODEL}" = "__RR_ORIGINAL__" ]; then
                # 原版 RR 镜像：保持 rr.img 文件名（官方格式），zip 名带版本号
                mv -f rr/rr.img rr.img
              else
                mv -f rr/rr.img "${ARTIFACT_NAME}.img"
              fi
              [ "$USER_CONFIG_FILE" = "user-config.yml" ] || mv -f "$USER_CONFIG_FILE" "user-config.yml"
              ;;
            *)
              echo "[E] 不支持的镜像格式: $IMAGE_FORMAT"
              exit 1
              ;;
          esac

          rm -f rr/rr.img

          if [ "${MODEL}" = "__RR_ORIGINAL__" ]; then
            # 原版 RR 镜像：官方压缩命令 zip -9，命名 rr-<版本>.img.zip，打包 rr.img + exe（不含 user-config.yml）
            ARTIFACT_ZIP="${ARTIFACT_BRAND}-${RR_TAG}.img.zip"
            rm -f "${ARTIFACT_NAME}.img"
            zip -9 -q "$ARTIFACT_ZIP" rr.img
            if [ -d "ainas" ]; then
              for exe in ainas/*.exe; do
                [ -f "$exe" ] && zip -qj "$ARTIFACT_ZIP" "$exe"
              done
            fi
          else
            ARTIFACT_ZIP="${ARTIFACT_NAME}.zip"
            zip -qr "$ARTIFACT_ZIP" "${ARTIFACT_NAME}.img" user-config.yml
            if [ -d "ainas" ]; then
              for exe in ainas/*.exe; do
                [ -f "$exe" ] && zip -qj "$ARTIFACT_ZIP" "$exe"
              done
            fi
          fi
          echo "[INFO] 产物 ${ARTIFACT_ZIP} 已生成（$(du -h "$ARTIFACT_ZIP" | cut -f1)，含 exe $(zipinfo -1 "$ARTIFACT_ZIP" | grep -c '\.exe$') 个）"

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=$ARTIFACT_ZIP" >> "$GITHUB_ENV"

      - name: 发布制品到 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"

          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          # 分卷、Release 自愈、退避重试统一在 .github/scripts/release_publish.sh 里
          ASSET_ARGS=()
          [ -n "${ARTIFACT_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$ARTIFACT_ZIP")
          [ -n "${UPDATE_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$UPDATE_ZIP")

          bash "$GITHUB_WORKSPACE/.github/scripts/release_publish.sh" \
            "$RELEASE_TAG" "${RELEASE_NOTES:-RR build artifacts}" "${ASSET_ARGS[@]}"
