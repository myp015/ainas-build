#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - version: "7.4"
            platform: apollolake
          - version: "7.4"
            platform: epyc7002

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules (vxlan chain only)"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          # 只编译 vxlan 链：临时把 defines 全部 =m 改为 =n（=n 作 make 参数不编任何
          # 模块），仅保留 vxlan/udp_tunnel 为 =m → 只编 vxlan.ko/udp_tunnel.ko/
          # ip6_udp_tunnel.ko，验证自编译（M 树 obj-y 仍会编，属 make 行为）。
          DEF="${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}"
          sed -i 's/=m$/=n/' "${DEF}"
          sed -i 's/^CONFIG_NET_UDP_TUNNEL=n$/CONFIG_NET_UDP_TUNNEL=m/' "${DEF}"
          grep -q '^CONFIG_VXLAN=m' "${DEF}" || printf 'CONFIG_VXLAN=m\n' >> "${DEF}"
          cp -f "${DEF}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
