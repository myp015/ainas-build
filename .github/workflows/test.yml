#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ Task#191 F8/F9/F10 验证矩阵（4.x 树）============
          # 5.x 侧 F1/F5/F6 已由 run 39043563163 验证通过（三 job 全绿：F5 产物
          # nm UND 与 RR 逐符号一致 __udp4_lib_lookup+udp_table；F6 page_pool
          # tracepoint 元符号 12→0，UND 26）。
          # F8 判据：nf_conntrack.ko 的 nm UND 应无 __siphash_aligned，改为
          # __siphash_unaligned（官方 4.4 导出面只含后者）。
          # F9 判据：sdhci-pci.ko 的 nm UND 应无 sdhci_pci_spt_drive_strength
          # （302 树改为编进 sdhci-pci.ko 自身；180 树保持独立 sdhci-pci-data.ko）。
          # F10 判据：broadwell 的 sdhci-pci.ko/sdhci-acpi.ko UND 应无 iosf_mbi_*；
          # apollolake 仍应保留（其 defines 开 CONFIG_IOSF_MBI=m、有 iosf_mbi.ko，
          # RR 同平台 sdhci 依赖确实含 iosf_mbi）。
          # 302 树：F8+F9+F10 三族同验（broadwell 非 apollolake → 应无 iosf_mbi）
          - version: "7.4"
            platform: broadwell
          # 302 树：F10 正向对照（apollolake 应保留 iosf_mbi 依赖）
          - version: "7.4"
            platform: apollolake
          # 180 树：F8 同步改动 + F9/F10 回归（180 走独立 sdhci-pci-data.ko 分支，
          # 且 kconfig-flags 本无 IOSF 注入 → 应保持既有行为不变）
          - version: "7.0"
            platform: broadwell

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
