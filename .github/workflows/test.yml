#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ Task#191 F2 验证矩阵（5.x 树）============
          # 4.x 侧 F8/F9/F10 已由 run 39045196240 验证通过（三 job 全绿，产物 nm
          # UND 逐项与 RR 对齐：F8 改用 __siphash_unaligned；F9 spt_drive 自包含
          # 无 U；F10 broadwell 无 iosf_mbi_*、apollolake 正向保留）。
          # 5.x 侧 F1/F5/F6 已由 run 39043563163 验证通过。
          # F2 判据：binder_linux.ko 的 nm UND 应无
          #   __close_fd_get_file can_nice mmput_async task_work_add zap_page_range
          #   security_binder_{set_context_mgr,transaction,transfer_binder,transfer_file}
          # （epyc7002 另有 put_ipc_ns / init_ipc_ns），这些符号改为模块内 T
          # （同名转发层，链接期接管 U 引用）；新增 UND 仅 register_kprobe /
          # unregister_kprobe。对照 RR 同平台 binder_linux.ko 应逐符号一致。
          # epyc7002：覆盖 binderfs 路径（defines 开 CONFIG_ANDROID_BINDERFS=m
          # 且 KSRC IPC_NS=y → 需 put_ipc_ns 转发 + init_ipc_ns getter）
          - version: "7.4"
            platform: epyc7002
          # geminilakenk / r1000nk：无 binderfs 路径，顺带回归 F1 irq_poll 门控
          - version: "7.4"
            platform: geminilakenk
          - version: "7.4"
            platform: r1000nk

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
