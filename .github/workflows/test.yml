#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ 4.4.180 树（7.0/7.1：无线/SND/netfilter 关闭、kvm/mmc 回退） ============
          # apollolake / broadwell / broadwellnk / denverton / geminilake / purley / v1000：双版本
          - version: "7.0"
            platform: apollolake
          - version: "7.1"
            platform: apollolake
          - version: "7.0"
            platform: broadwell
          - version: "7.1"
            platform: broadwell
          - version: "7.0"
            platform: broadwellnk
          - version: "7.1"
            platform: broadwellnk
          - version: "7.0"
            platform: denverton
          - version: "7.1"
            platform: denverton
          - version: "7.0"
            platform: geminilake
          - version: "7.1"
            platform: geminilake
          - version: "7.0"
            platform: purley
          - version: "7.1"
            platform: purley
          - version: "7.0"
            platform: v1000
          - version: "7.1"
            platform: v1000
          # broadwellnkv2 / broadwellntbap / r1000：仅 7.1
          - version: "7.1"
            platform: broadwellnkv2
          - version: "7.1"
            platform: broadwellntbap
          - version: "7.1"
            platform: r1000
          # ============ 4.4.302 树（7.2/7.3/7.4：无线/IOSF_MBI 宏、kvm/mmc backport 保留） ============
          - version: "7.2"
            platform: apollolake
          - version: "7.3"
            platform: apollolake
          - version: "7.4"
            platform: apollolake
          - version: "7.2"
            platform: broadwell
          - version: "7.3"
            platform: broadwell
          - version: "7.4"
            platform: broadwell
          - version: "7.2"
            platform: broadwellnk
          - version: "7.3"
            platform: broadwellnk
          - version: "7.4"
            platform: broadwellnk
          - version: "7.2"
            platform: broadwellnkv2
          - version: "7.3"
            platform: broadwellnkv2
          - version: "7.4"
            platform: broadwellnkv2
          - version: "7.2"
            platform: broadwellntbap
          - version: "7.3"
            platform: broadwellntbap
          - version: "7.4"
            platform: broadwellntbap
          - version: "7.2"
            platform: denverton
          - version: "7.3"
            platform: denverton
          - version: "7.4"
            platform: denverton
          - version: "7.2"
            platform: geminilake
          - version: "7.3"
            platform: geminilake
          - version: "7.4"
            platform: geminilake
          - version: "7.2"
            platform: purley
          - version: "7.3"
            platform: purley
          - version: "7.4"
            platform: purley
          - version: "7.2"
            platform: r1000
          - version: "7.3"
            platform: r1000
          - version: "7.4"
            platform: r1000
          - version: "7.2"
            platform: v1000
          - version: "7.3"
            platform: v1000
          - version: "7.4"
            platform: v1000

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          # 生成 modules.dep（验证 #135 逻辑，与 modules.yml 合并流一致）：
          # 格式对齐官方 'xxx.ko: dep1.ko dep2.ko'，依赖名补 .ko 后缀
          rm -f "${ROOT_PATH}/output/modules.dep"
          for M in $(ls "${ROOT_PATH}/output"/*.ko 2>/dev/null); do
            DEPS=""
            for d in $(modinfo -F depends "${M}" 2>/dev/null | sed 's/,/ /g'); do
              DEPS="${DEPS} ${d}.ko"
            done
            printf '%s:%s\n' "$(basename "${M}")" "${DEPS}" >> "${ROOT_PATH}/output/modules.dep"
          done

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
