#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ Task#191 F11 验证矩阵（4.4 双树）============
          # 已闭环：F1/F5/F6（run 39043563163）、F2（39071641854）、F8/F9/F10
          # （39045196240）、F3/F4（39083162441），均产物级 nm UND 与 RR 逐项对齐。
          # F11 判据：自编 qedr.ko 的 nm UND 应含 qede_rdma_register_driver /
          # qede_rdma_unregister_driver / qed_get_rdma_ops（不再有 qede_roce_*），
          # 且全部 UND 落在官方导出面 ∪ qed.ko/qede.ko 导出面内。
          # 对照 RR：/www/project/rr-modules/extracted/broadwell-7.4-4.4.302/qedr.ko
          # （83 UND，含同三符号）—— RR 直接用官方 hda1 qedr.ko。
          # 双树覆盖：broadwell-7.4（4.4.302 树）/ broadwell-7.1（4.4.180 树）；
          # 另带 epyc7002-7.4 作 5.x binderfs 回归。
          - version: "7.4"
            platform: broadwell
          - version: "7.1"
            platform: broadwell
          - version: "7.4"
            platform: epyc7002

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
