#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ Task#192 官方内核导出面核对（26.10.9 产物）三族修复验证 ====
          # 用 syno 官方内核导出面（/www/tmp/official-zimage/exports_<plat>_74.txt）
          # 核对 modules/ 自编产物，40 个不可解析符号中 5 个为我方独有（RR 可解析），
          # 收敛为三族真缺陷，本矩阵逐族产物级验证：
          #
          # 族1 mlx5e_init/mlx5e_cleanup（37 target = 4.4 八平台 × 版本）：
          #   CONFIG_MLX5_CORE_EN 是 bool，defines 却写 =m → 4.4 kbuild 的
          #   multi-used-m（scripts/Makefile.lib:51）不认 -m，`mlx5_core-$(CONFIG_
          #   MLX5_CORE_EN) += en_*.o` 的子对象全被丢弃；而 C 层由 kconfig-flags
          #   注入 -DCONFIG_MLX5_CORE_EN=1 仍编译引用 → UND。修复=16 个 defines
          #   改 =y。判据：mlx5_core.ko 应出现 T mlx5e_init/mlx5e_cleanup
          #   （对齐 RR 4.x mlx5_core.ko）。
          # 族2 genphy_config_init（9 target = r1000/v1000 × 4 版本）：
          #   v1000/r1000 的 defines 使 phy/Makefile 注入 -DMY_DEF_HERE，厂商原版把
          #   EXPORT_SYMBOL(genphy_config_init) 放在该宏的 #else 分支内 → 两平台
          #   libphy.ko 不导出该符号，而自编 realtek.ko 依赖它（官方 4.4 内核全平台
          #   亦不导出）→ realtek.ko 无法加载。修复=EXPORT 移到函数定义之后（两树）。
          #   判据：libphy.ko 含 __ksymtab_genphy_config_init，且 realtek.ko 的
          #   U genphy_config_init 有提供者。
          # 族3 sync_file_create/sync_file_get_fence（1 target = icelaked-7.4）：
          #   官方 icelaked 内核导出面不含主线 sync_file_*（backport 栈用
          #   dmabufbkpt_*），dev txz auto.conf 亦未设置 → sync_file.o 未链入自编
          #   dmabuf.ko；而自编 root drm.ko 经 defines_cfg.h 的 CONFIG_SYNC_FILE=1
          #   编译出引用 → drm.ko 加载失败。修复=defines.icelaked 加
          #   CONFIG_SYNC_FILE=y。判据：dmabuf.ko 导出面 61→63（含 2 符号），
          #   与 geminilakenk 逐符号一致。
          #
          # 平台覆盖：4.4 两树 × MY_DEF_HERE 两平台（r1000/v1000）+ mlx5 非 Realtek
          # 平台 broadwell（两树）；5.x icelaked。前序 Task#191 矩阵（5.x HBA
          # syno_sdev_info_enum）已闭环，见 ainas-modules tasks/todo.md。
          - version: "7.1"
            platform: r1000
          - version: "7.1"
            platform: v1000
          - version: "7.4"
            platform: r1000
          - version: "7.4"
            platform: v1000
          - version: "7.1"
            platform: broadwell
          - version: "7.4"
            platform: broadwell
          - version: "7.4"
            platform: icelaked

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
