#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ Task#193 与 RR 同样不可加载的模块修复验证 ====
          # 背景：Task#192 把 4.x 残余 35 个不可解析符号判为"与 RR 同样的生态状态、
          # 不修"。本轮复核后只剩两族真缺陷（另 2 个符号 amd_e400_c1e_detected /
          # sk_receive_skb 只在 4.4.180 target 上出现，是"拿 4.4.302 导出面核对
          # 4.4.180"造成的假阳性——官方 7.1 模块自己就引用它们），本矩阵逐族产物级
          # 验证：
          #
          # 族1 dib* 28 符号（消费者 dvb-usb-dib0700.ko，4.x 全平台）：
          #   我们 src 树 dvb-frontends/Makefile 的 dib 行（30-34、68-69）被官方裁剪
          #   注释，defines 只开了 CONFIG_DVB_USB_DIB0700=m 没开任何 demod/tuner →
          #   28 个直接引用无提供者，模块永不加载。修复=取消 Makefile 注释 + 20 个
          #   4.x defines 加 7 个 CONFIG_DVB_DIB*/TUNER_DIB* 键。
          #   判据：新增 8 个 .ko（dib3000mc/dib7000m/dib7000p/dib8000/dib9000/
          #   dib0070/dib0090/dibx000_common），且 dvb-usb-dib0700.ko 的 dib* UND
          #   全部可解析（本 target 全部 .ko 导出面 ∪ 官方导出面）。
          #
          # 族2 syno_libata_* 5 符号（消费者 sata_sil.ko，4.x 全平台）：
          #   KSRC include/linux/libata.h 的 SYNO_* 宏（MY_ABC_HERE）把 5 个回调塞进
          #   ATA_BASE_SHT，官方 4.4 内核只导出 syno_libata_index_get 且仅 r1000/v1000
          #   → sata_sil.ko 全平台 Unknown symbol。修复=sata_sil.c 里 #undef/#define
          #   这两个宏：只留 .syno_port_type = SYNO_PORT_TYPE_SATA，去掉 5 个回调。
          #   判据：sata_sil.ko 无任何 syno_libata_* UND，其余 UND 全在官方导出面内。
          #
          # 平台覆盖：4.4 两树 × MY_DEF_HERE 平台（v1000/r1000，index_get 被官方
          # 导出的那类）+ 非 MY_DEF_HERE 平台 broadwell（index_get 不导出）。其余
          # 4.x 平台改动同形，由下一次 modules.yml 全量发布构建复核。
          - version: "7.1"
            platform: broadwell
          - version: "7.4"
            platform: broadwell
          - version: "7.1"
            platform: v1000
          - version: "7.4"
            platform: r1000

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
