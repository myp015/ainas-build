#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ Task#126 F1 + Task#191 F5/F6 验证矩阵（5.10.55 树）============
          # F1 判据：产物 mpt3sas.ko/megaraid_sas.ko/ib_core.ko/mlx4_ib.ko/mlx5_ib.ko
          # 的 nm UND 中 irq_poll_* 应为 —— n 侧 0 个、y 侧保留（5/5/4/2/2）。
          # F5 判据：nf_socket_ipv4.ko/nf_tproxy_ipv4.ko 的 nm UND 应无
          # udp4_lib_lookup（改为 __udp4_lib_lookup + udp_table，两平台内核均不导出前者）。
          # F6 判据：geminilakenk page_pool.ko 的 nm UND 应无 __tracepoint_page_pool_* /
          # __SCK__tp_func_* / __SCT__tp_func_*（12 个），对齐 RR 24 UND 基础符号面。
          # 官方内核 IRQ_POLL=n 平台（不导出 irq_poll_* → 必须编译排除）
          - version: "7.4"
            platform: r1000nk
          - version: "7.4"
            platform: geminilakenk
          # 官方内核 IRQ_POLL=y 平台（导出 irq_poll_* → 保留路径，无功能降级）
          - version: "7.4"
            platform: epyc7002

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
