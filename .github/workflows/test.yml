#
# Test build modules — 编译模块测试（简化版）
# 基于 modules.yml 精简：
#   - 只保留 build job 的编译核心（makeEnvDeploy + makemodules + 产物 tgz）
#   - 去掉 firmware / release job（不发布、不推送 syno-modules）
#   - 去掉官方/第三方合并打包逻辑（纯编译产物，便于验证 defines/源码/依赖）
# 用法：workflow_dispatch 手动触发；矩阵按需增删平台
#

name: Test build modules

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ KCFLAGS 宏精简验证（Task#156）：覆盖三种主流程树 ============
          # 7.1 老平台 × 3 → 4.4.180 树（新建 src/4.4.180/kconfig-flags）
          - version: "7.1"
            platform: geminilake
          - version: "7.1"
            platform: purley
          - version: "7.1"
            platform: v1000
          # 7.4 apollolake → 4.4.302 树（kconfig-flags 前段公共宏 + 删 apollolake
          #   分支重复 REGDB 后，无线驱动仍需正常编译）
          - version: "7.4"
            platform: apollolake
          # 7.4 icelaked → 5.10.55 树（新建 src/5.10.55/kconfig-flags，含 iwlwifi/
          #   snd LED/FB_MODE_HELPERS 公共宏读取验证）
          - version: "7.4"
            platform: icelaked

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout ainas-modules
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
