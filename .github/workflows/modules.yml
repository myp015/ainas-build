          - version: 7.1
            platform: broadwellnk
          - version: 7.1
            platform: broadwellnkv2
          - version: 7.1
            platform: broadwellntbap
          #- version: 7.1
          #  platform: bromolow
          - version: 7.1
            platform: denverton
          - version: 7.1
            platform: epyc7002
          - version: 7.1
            platform: geminilake
          #- version: 7.1
          #  platform: grantley
          #- version: 7.1
          #  platform: kvmx64
          - version: 7.1
            platform: purley
          - version: 7.1
            platform: r1000
          - version: 7.1
            platform: v1000

          - version: 7.2
            platform: apollolake
          #- version: 7.2
          #  platform: braswell
          - version: 7.2
            platform: broadwell
          - version: 7.2
            platform: broadwellnk
          - version: 7.2
            platform: broadwellnkv2
          - version: 7.2
            platform: broadwellntbap
          #- version: 7.2
          #  platform: bromolow
          - version: 7.2
