name: Build modules main

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  # 平台×版本矩阵的单一来源：.github/matrix/build.json
  # （modules.yml / lkms.yml 原本各自内联了 195 行逐字节相同的 include 块）
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Generate matrix
        id: gen
        run: |
          echo "matrix=$(jq -c '{include: .include}' .github/matrix/build.json)" >>"$GITHUB_OUTPUT"
          echo "生效 $(jq '.include | length' .github/matrix/build.json) 项；" \
               "已禁用 $(jq '.disabled | length' .github/matrix/build.json) 项；" \
               "不支持 $(jq '.unsupported | length' .github/matrix/build.json) 项"
  build:
    needs: setup
    strategy:
      # 单个平台失败（如 toolchain 下载瞬时网络错误）不取消其余 job，
      # 避免一次网络抖动让全量验收整体取消（2026-09-23 epyc7003-7.4 教训）
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules


      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

          # 规则（用户 2026-10-21）：即便模块会被官方 OM 覆盖，自编面也必须有我们的版本。
          # 判据在 scripts/ref/selfbuilt-required.txt；此处是**纯编译面**（output/ 尚未合并
          # 官方/第三方），fail-fast 可直接指向 defines.${PLATFORM} 里被写成 =n 的那行。
          echo "check selfbuilt-required"
          bash "${ROOT_PATH}/ainas-modules/scripts/check_selfbuilt.sh" "${KVER}" "${ROOT_PATH}/output"

      - name: ABI probe
        # 工具②：在同一个 KSRC 上编两路探针（A = KSRC 原生 = 官方内核条件；
        # B = KSRC + 本次实际生效的 KCFLAGS），pahole dump 后差分。两路只要有一处
        # 字段偏移不同，就说明**我们的宏注入改变了官方结构体布局** —— 这类缺陷
        # 符号层面完全干净（模块能加载），只在运行期崩，符号级门禁抓不到。
        # KCFLAGS 由 compile.sh 落盘到 output/.kbuild-flags（单一真相源，不在此重推导）。
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          sudo apt-get update -qq
          sudo apt-get install -y -qq dwarves

          bash "${ROOT_PATH}/ainas-modules/scripts/abi-probe/run_probe.sh" \
            "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" \
            "${ROOT_PATH}/abi-${PLATFORM}-${VERSION}.txt"

      - name: Upload ABI probe
        uses: actions/upload-artifact@v7
        with:
          name: abi-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            abi-*.txt

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          OFFICIAL_PATH="${ROOT_PATH}/syno-modules/official/hda1/${PLATFORM}-${VERSION}-${KVER}"
          PARTY3RD_PATH="${ROOT_PATH}/syno-modules/thirdparty/${PLATFORM}-${VERSION}-${KVER}"

          # =====================================================================
          # 双目录打包：
          #   output/       = makemodules 编译产物（纯编译）-> 给 modules/
          #   output_all/   = 编译 + 官方 + 第三方（合集）   -> 给 release/
          # =====================================================================

          # 纯编译产物 tgz（给 modules/）。排除 .kbuild-flags：它是 compile.sh 落盘的
          # 构建元数据（供 ABI 探针回放 KCFLAGS），不属于发布产物。
          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz --exclude=./.kbuild-flags -C ${ROOT_PATH}/output .

          # 建合集目录：先复制编译产物，再追加官方/第三方
          mkdir -p ${ROOT_PATH}/output_all
          cp -rf ${ROOT_PATH}/output/* ${ROOT_PATH}/output_all/

          echo "copy official modules"
          IU="apollolake braswell broadwell broadwellnk broadwellnkv2 broadwellntbap bromolow denverton geminilake grantley purley geminilakenk icelaked"
          AU="r1000 v1000 epyc7002 epyc7003 epyc7003ntb r1000nk v1000nk"
          # OM（官方模块强制覆盖）名单的**唯一真相源** = ainas-modules/scripts/ref/om-override.txt，
          # 经 om_list.sh 按 KVER 做条件过滤（4.x 才覆盖 i915/OFED 栈）。
          # 原来在这里内联 Bash 数组 —— 那会让发布后校验覆盖是否生效的 D1 判据
          # （scripts/check_om_override.sh）与这里各写一份名单，一旦漂移，D1 校验的就是**旧名单**，
          # 覆盖静默失效也查不出来（正是本判据要防的场景）。故改为读同一份。
          mapfile -t OM < <(bash "${ROOT_PATH}/ainas-modules/scripts/om_list.sh" "${KVER:-4}")
          [ "${#OM[@]}" -gt 0 ] || { echo "[E] OM 名单读空（om_list.sh 路径或名单文件有问题）"; exit 1; }
          echo "OM 名单 ${#OM[@]} 项（KVER=${KVER:-4}）: ${OM[*]}"
          # vxlan 链（vxlan/udp_tunnel/ip6_udp_tunnel）已自编译（defines 开
          # CONFIG_VXLAN=m+CONFIG_NET_UDP_TUNNEL=m，src/{4.x,5.x}），不再拷贝官方
          # vxlan.ko。背景：RR 内核 CONFIG_VXLAN=y 内建 vxlan，RR 发布物无 vxlan.ko，
          # 之前对齐 RR 拷贝数量时 vxlan 不构成缺口被落下；我们自编 i40e 引用
          # vxlan_get_rx_port 且官方内核 CONFIG_VXLAN=m → 需 vxlan.ko 模块。自编译后
          # 依赖由 depends 链（vxlan→udp_tunnel,ip6_udp_tunnel）自动补齐，cks 流同样
          # 不再依赖官方拷贝。
          # 上面 om-override.txt 里的 `kver<5` 条件项 = 4.x 的 i915/OFED 栈（5.x 这两个栈
          # 已自编并对齐 RR，不覆盖）；`all` 项含 kvm 三件套 —— 官方有则强制覆盖（Intel 平台
          # kvm-intel / AMD 平台 kvm-amd），官方没有的（AMD 平台 kvm-intel / Intel 平台
          # kvm-amd）保留自编译产物补齐。
          for M in ${OM[@]}; do
            function _copydepends() {
              # 官方模块强制覆盖自编译产物（4.x/5.x 全平台）：官方有的同名模块一律用
              # 官方版（符号集匹配官方内核最可靠，如 i40e/auxiliary/processor/exfat/kvm
              # 等；官方 i40e 自包含版修复 v1000nk 上机 i40e FAILED）。官方没有的保留
              # 自编译产物。rd 目录（官方只读版）是 hda1 的子集（重叠文件内容一致，
              # 另有 pgdrv.ko 独有），hda1 优先、rd 兜底，避免 rd 存在时误跳过覆盖。
              [ -f "${OFFICIAL_PATH}/${1}" ] && cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output_all"
              [ -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && cp -f "${OFFICIAL_PATH/hda1/rd}/${1}" "${ROOT_PATH}/output_all"
              # 探测型：模块文件不存在时 modinfo 会返回非零，视为无依赖（非构建错误）
              depends=($(modinfo -F depends "${OFFICIAL_PATH}/${1}" 2>/dev/null | sed 's/,/ /g' || :))
              if [ ${#depends[*]} -gt 0 ]; then
                for k in ${depends[@]}; do
                  _copydepends "${k}.ko"
                done
              fi
            }
            _copydepends "${M}"
          done

          echo "copy 3rd modules"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/output_all/

          echo "check depends"
          for M in $(ls ${ROOT_PATH}/output_all 2>/dev/null); do
            function _copydepends() {
              if [ ! -f "${ROOT_PATH}/output_all/${1}" ] && [ ! -f "${OFFICIAL_PATH/hda1/rd}/${1}" ]; then
                if [ -f "${OFFICIAL_PATH}/${1}" ]; then
                  cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output_all"
                else
                  echo "[E] '${PLATFORM}-${KVER}' - '${M}' depends '${1}' does not exist."
                fi
              fi
              D=""
              [ -z "${D}" ] && [ -f "${ROOT_PATH}/output_all/${1}" ] && D="${ROOT_PATH}/output_all/${1}"
              [ -z "${D}" ] && [ -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && D="${OFFICIAL_PATH/hda1/rd}/${1}"
              if [ -n "${D}" ]; then
                # modinfo "${D}"
                # 探测型：modinfo 失败时视为无依赖（非构建错误）
                depends=($(modinfo -F depends "${D}" 2>/dev/null | sed 's/,/ /g' || :))
                if [ ${#depends[*]} -gt 0 ]; then
                  for k in ${depends[@]}; do
                    [ -f "${ROOT_PATH}/output_all/${k}.ko" ] && continue # Recursively skip wext-priv and wext-core dependencies on each other.
                    _copydepends "${k}.ko"
                  done
                fi
              fi
            }
            _copydepends "${M}"
          done

          # Task#202（通用规则，取代 Task#148 针对 geminilakenk dmabuf 的特例）：
          # update/ 里存在的同名 .ko，一律删除 root 同名产物。
          # 5.x 的 GPU 栈（drm/ttm/gpu-sched/dmabuf/drm_kms_helper/i915/amdgpu/
          # radeon…）自 Task#202 起统一由 update/ 的 6.5 backport 栈提供；root 5.10
          # 同名模块若残留，depmod 会把两份当成同一模块的不同版本，generic 依赖可能
          # 解析到 5.10 版 → 混合栈 ABI 断裂（v1000nk-7.2 Unknown symbol 实测）。
          # dmabuf 的额外理由：update 栈需要 dmabufbkpt_*，root 主线版为 0 bkpt，
          # 双份存在会让 generic "dmabuf" 依赖解析到 root 版致断链。
          if [ -d "${ROOT_PATH}/output_all/update" ]; then
            for U in "${ROOT_PATH}/output_all/update"/*.ko; do
              [ -f "${U}" ] || continue
              B=$(basename "${U}")
              if [ -f "${ROOT_PATH}/output_all/${B}" ]; then
                rm -f "${ROOT_PATH}/output_all/${B}"
                echo "[Task#202] 移除 root 同名模块 ${B}（保留 update/ 版）"
              fi
            done
          fi

          # 合集 tgz（给 release/）：文件名不带 -all，放 all/ 子目录区分纯编译
          mkdir -p ${ROOT_PATH}/all
          tar -zcf ${ROOT_PATH}/all/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output_all .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          # 命名 all-*（不带 modules- 前缀）：与纯编译 modules-* 区分，
          # 避免 download-artifact 的 modules-* glob 误匹配合集
          name: all-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            all/*.tgz

  firmware:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: download to artifacts
        uses: actions/download-artifact@v8
        with:
          # 合集 all-* 含编译+官方+第三方全部 ko，firmware 提取需要全集
          path: output
          pattern: all-*
          merge-multiple: true

      - name: firmware
        run: |
          # 固件汇总逻辑统一在 .github/scripts/collect_firmware.sh
          # 参数依次为：工作区根、第三方固件目录、仓库固件根、仓库固件子目录、白名单文件
          # 末尾可变参数 = 额外扫描 *.ko 的根目录（release/ 是官方全平台模块全集，
          # 一并扫描其 modinfo 固件请求，使 firmware.tgz 覆盖所有官方平台 - Task#188+）
          bash "$GITHUB_WORKSPACE/.github/scripts/collect_firmware.sh" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/syno-modules/thirdparty/firmware" \
            "$GITHUB_WORKSPACE/ainas-modules/firmware" \
            "4.x,5.x" \
            "missing-whitelist-5x.txt,missing-whitelist-4x.txt" \
            "$GITHUB_WORKSPACE/syno-modules/release"

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          # 去掉 modules- 前缀：避免与纯编译 modules-* 下载冲突
          name: firmware
          path: |
            firmware.tgz

  release:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout syno-modules
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules
      - name: Checkout ainas-modules
        # 发布门禁脚本（gate_release.py 与 scripts/abi-probe/）随 ainas-modules 仓库发布，
        # 与 build job 编译用的是同一个 commit（同仓库同 ref）。
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/calc_version.sh" "myp015/syno-modules" "${{ inputs.version }}"

      - name: download to artifacts (compile)
        # v8 批量下载大 artifact 偶发 digest-mismatch（127 个 modules-* 全量下载）→
        # 降 v4（无 digest 校验，成熟稳定）。pattern 单行：v4 也不支持多行负 pattern。
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: modules-*
          merge-multiple: true

      - name: download to artifacts (all)
        uses: actions/download-artifact@v4
        with:
          path: output_all
          pattern: all-*
          merge-multiple: true

      - name: download to artifacts (firmware)
        # Task#188+：固件也随 release 产物发布 → 下载 firmware.tgz
        uses: actions/download-artifact@v4
        with:
          path: firmware_out
          pattern: firmware
          merge-multiple: true

      - name: download to artifacts (abi probe)
        # 工具② 的 ABI 偏移指纹 dump（每个 target 几 KB）
        uses: actions/download-artifact@v4
        with:
          path: abi_out
          pattern: abi-*
          merge-multiple: true

      - name: Gate selftest (negative test)
        # 门禁自身的负向测试：证明 G1-G6 的判据**能失败**。没有这一步，判据逻辑写反、
        # 路径失效、或产物为空导致判据在空集上"全绿"，报告依然是绿的而无人察觉
        # （实测：空产物在修复前的门禁下是 PASS 退出 0）。
        # 夹具取自 syno-modules/official 的真 .ko，不编译，几秒跑完。
        run: |
          bash "${GITHUB_WORKSPACE}/ainas-modules/scripts/gate_selftest.sh" \
            "${GITHUB_WORKSPACE}"

      - name: Release gate
        # 发布门禁（工具① G1-G4 + 工具② G5 + G6 产物加载面）。**硬阻断**：本 job 无
        # continue-on-error，且后续 push 与建 Release 步骤全带 `if: success() && env.VERSION != ''`
        # → 本步骤非零退出即天然中止整条发布链（不 push syno-modules、不建 Release）。
        # 此刻 syno-modules 工作区仍是上一版发布状态，故可直接作为"产物不缩水"的基线。
        # --expect-targets：产物 target 数必须等于 build 矩阵项数 —— 防"矩阵里某个平台
        # 的 build job 静默失败/artifact 没上传"，那种情况下产物变少但每条判据都还是绿的。
        run: |
          ROOT_PATH=${{ github.workspace }}
          sudo apt-get update -qq
          sudo apt-get install -y -qq dwarves
          python3 "${ROOT_PATH}/ainas-modules/scripts/gate_release.py" \
            --output "${ROOT_PATH}/output" \
            --official "${ROOT_PATH}/syno-modules/official" \
            --thirdparty "${ROOT_PATH}/syno-modules/thirdparty" \
            --prev "${ROOT_PATH}/syno-modules/modules" \
            --abi "${ROOT_PATH}/abi_out" \
            --expect-targets "$(jq '.include | length' "${ROOT_PATH}/.github/matrix/build.json")" \
            --report "${ROOT_PATH}/gate_report.txt"

      - name: Upload gate report
        # 无论门禁成败都留档：失败时报告明确指出是哪条判据、哪个 target、哪个符号。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: gate_report.txt
          if-no-files-found: ignore

      - name: delete-artifact
        # 仅「成功且确实要发布」时才删（if: success() && env.VERSION != ''）：
        #   · download 失败 → 保留 artifacts，否则无法重跑 Extract/手动下载验证；
        #   · 未填版本号（env.VERSION == ''）→ calc_version.sh 按设计不发布，此时更
        #     不能删：本 run 的成果就是那批编译产物，删了 run 结束即不可取回
        #     （artifact 默认 90 天过期，足够复跑验证或手工取件）。
        if: success() && env.VERSION != ''
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            modules-*
            all-*
            abi-*
            firmware

      - name: Zip modules
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          # release 压缩包 = 合集（output_all/，含官方+编译+第三方）
          echo "${VERSION}" > "output_all/VERSION"
          zip -9 modules-${VERSION}.zip -j output_all/*

          # Task#188+：固件也随 release 产物发布（firmware.tgz 一并入 zip）
          if [ -f "firmware_out/firmware.tgz" ]; then
            zip -9 modules-${VERSION}.zip -j firmware_out/firmware.tgz
          else
            echo "WARN: firmware.tgz 未下载，zip 不含固件"
          fi

      - name: Extract to syno-modules/modules
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"

          # output/ 下是各平台纯编译 tgz（download compile 产物），形如
          # apollolake-7.0-4.4.180.tgz / broadwell-7.4-4.4.302.tgz 等
          # 每个 tgz 解压到 syno-modules/modules/<platform>-<version>-<kver>/ 目录
          mkdir -p syno-modules/modules
          # 先清空旧内容，避免版本混合残留（fail fast：find 失败直接中止）
          find syno-modules/modules -mindepth 1 -delete

          COUNT=0
          for tgz in output/*.tgz; do
            [ -e "${tgz}" ] || continue
            name="$(basename "${tgz}" .tgz)"   # apollolake-7.0-4.4.180
            mkdir -p "syno-modules/modules/${name}"
            tar -zxf "${tgz}" -C "syno-modules/modules/${name}"
            COUNT=$((COUNT+1))
          done
          echo "${VERSION}" > syno-modules/modules/VERSION

          echo "=== 解压 ${COUNT} 个平台，modules/ 目录结构 ==="
          ls syno-modules/modules/
          echo "ko 总数: $(find syno-modules/modules -name '*.ko' | wc -l)"

          # 断言：纯编译 tgz 未下载则 COUNT=0，直接失败而非提交空目录
          if [ "${COUNT}" -eq 0 ]; then
            echo "FATAL: 未解压任何平台（download compile 异常），中止提交"
            exit 1
          fi

      - name: Commit and push modules
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          cd syno-modules
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add modules/
          if git diff --cached --quiet; then
            echo "modules/ 无变化，跳过提交"
          else
            git commit -m "modules: update ${VERSION}" || echo "commit 无变化跳过"
            git push origin main
          fi

      - name: Extract release to syno-modules/release and push
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"

          # output_all/ 下是各平台合集 tgz（download all 产物，编译+官方+第三方），
          # 与 modules/ 一致：按平台分目录 release/<plat>-<ver>-<kver>/
          mkdir -p syno-modules/release
          # 先清空旧内容，避免版本混合残留（fail fast：find 失败直接中止）
          find syno-modules/release -mindepth 1 -delete

          COUNT=0
          for tgz in output_all/*.tgz; do
            [ -e "${tgz}" ] || continue
            name="$(basename "${tgz}" .tgz)"   # apollolake-7.0-4.4.180
            mkdir -p "syno-modules/release/${name}"
            tar -zxf "${tgz}" -C "syno-modules/release/${name}"
            COUNT=$((COUNT+1))
          done
          echo "${VERSION}" > syno-modules/release/VERSION

          # Task#188+：固件也解压进 release/firmware/，随 release/ 一并提交推送
          if [ -f "firmware_out/firmware.tgz" ]; then
            mkdir -p syno-modules/release/firmware
            tar -zxf "firmware_out/firmware.tgz" -C syno-modules/release/firmware
            echo "固件文件数: $(find syno-modules/release/firmware -type f | wc -l)"
          else
            echo "WARN: firmware.tgz 未下载，release/ 不含固件"
          fi

          echo "=== 解压 ${COUNT} 个平台，release/ 目录结构 ==="
          ls syno-modules/release/
          echo "ko 总数: $(find syno-modules/release -name '*.ko' | wc -l)"

          # 断言：合集 tgz 未下载则 COUNT=0，直接失败而非提交空目录
          if [ "${COUNT}" -eq 0 ]; then
            echo "FATAL: 未解压任何平台（download all 异常），中止提交"
            exit 1
          fi

          # D1：OM 覆盖**单向**不变量 —— build job 里 _copydepends 用官方版覆盖自编版，
          # 这条链一旦静默失效（OM 名单读空 / 路径写错 / cp 失败），release/ 里就会是自编版：
          # 自编版符号可能一样全（G1 看不出来），实机却加载失败（官方 i40e 自包含版正是为修
          # v1000nk 上机 FAILED）。必须在这里查 —— 门禁跑在 release/ 解压**之前**，那时还看不到
          # 覆盖结果。非零退出即中止（set -e + 本步骤后才是 push）。
          bash "${GITHUB_WORKSPACE}/ainas-modules/scripts/check_om_override.sh" \
            syno-modules/release syno-modules/official

          # 提交并推送 release/
          cd syno-modules
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add release/
          if git diff --cached --quiet; then
            echo "release/ 无变化，跳过提交"
          else
            git commit -m "release: update ${VERSION}" || echo "commit 无变化跳过"
            git push origin main
          fi

      - name: Release
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: modules*.zip
          owner: myp015
          repo: syno-modules
          token: ${{ secrets.AiNas }}
