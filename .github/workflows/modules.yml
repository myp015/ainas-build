name: Build modules main

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          #- version: 6.2
          #  platform: apollolake
          ##- version: 6.2
          ##  platform: braswell
          #- version: 6.2
          #  platform: broadwell
          #- version: 6.2
          #  platform: broadwellnk
          ##- version: 6.2
          ##  platform: bromolow
          #- version: 6.2
          #  platform: denverton
          #- version: 6.2
          #  platform: geminilake
          ##- version: 6.2
          ##  platform: grantley
          ##- version: 6.2
          ##  platform: kvmx64
          #- version: 6.2
          #  platform: purley
          #- version: 6.2
          #  platform: v1000

          - version: "7.0"
            platform: apollolake
          #- version: "7.0"
          #  platform: braswell
