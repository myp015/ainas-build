            platform: epyc7003
          - version: 7.4
            platform: epyc7003ntb
          - version: 7.4
            platform: geminilake
          - version: 7.4
            platform: geminilakenk
          #- version: 7.4
          #  platform: grantley
          - version: 7.4
            platform: icelaked
          #- version: 7.4
          #  platform: kvmx64
          - version: 7.4
            platform: purley
          - version: 7.4
            platform: r1000
          - version: 7.4
            platform: r1000nk
          - version: 7.4
            platform: v1000
          - version: 7.4
            platform: v1000nk

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules


      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          OFFICIAL_PATH="${ROOT_PATH}/syno-modules/official/hda1/${PLATFORM}-${VERSION}-${KVER}"
          PARTY3RD_PATH="${ROOT_PATH}/syno-modules/thirdparty/${PLATFORM}-${VERSION}-${KVER}"


          echo "copy official modules"
          IU="apollolake braswell broadwell broadwellnk broadwellnkv2 broadwellntbap bromolow denverton geminilake grantley purley geminilakenk icelaked"
          AU="r1000 v1000 epyc7002 epyc7003 epyc7003ntb r1000nk v1000nk"
          OM=(auxiliary.ko i40e.ko ixgbe.ko processor.ko vfio.ko exfat.ko ehci-hcd.ko ehci-pci.ko uhci-hcd.ko xhci-hcd.ko xhci-pci.ko etxhci-hcd.ko)
          [ "$(echo "${KVER:-4}" | cut -d'.' -f1)" -lt 5 ] && OM+=(i915.ko mlx_compat.ko mlx4_core.ko mlx4_en.ko mlx4_ib.ko mlx5_core.ko mlx5_ib.ko ib_core.ko qed.ko qede.ko qedr.ko)
          echo "${IU}" | grep -qw "${PLATFORM}" && OM+=(irqbypass.ko kvm.ko kvm-intel.ko) || OM+=(irqbypass.ko kvm.ko kvm-amd.ko)
          for M in ${OM[@]}; do
            function _copydepends() {
              [ -f "${OFFICIAL_PATH}/${1}" ] && [ ! -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output"
              depends=($(modinfo -F depends "${OFFICIAL_PATH}/${1}" 2>/dev/null | sed 's/,/ /g')) || true
              if [ ${#depends[*]} -gt 0 ]; then
                for k in ${depends[@]}; do
                  _copydepends "${k}.ko"
                done
              fi
            }
            _copydepends "${M}"
          done

          echo "copy 3rd modules"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/output/

          echo "check depends"
          for M in $(ls ${ROOT_PATH}/output 2>/dev/null); do
            function _copydepends() {
              if [ ! -f "${ROOT_PATH}/output/${1}" ] && [ ! -f "${OFFICIAL_PATH/hda1/rd}/${1}" ]; then
                if [ -f "${OFFICIAL_PATH}/${1}" ]; then
                  cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output"
                else
                  echo "[E] '${PLATFORM}-${KVER}' - '${M}' depends '${1}' does not exist."
                fi
              fi
              D=""
              [ -z "${D}" ] && [ -f "${ROOT_PATH}/output/${1}" ] && D="${ROOT_PATH}/output/${1}"
              [ -z "${D}" ] && [ -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && D="${OFFICIAL_PATH/hda1/rd}/${1}"
              if [ -n "${D}" ]; then
                # modinfo "${D}" || true
                depends=($(modinfo -F depends "${D}" 2>/dev/null | sed 's/,/ /g')) || true
                if [ ${#depends[*]} -gt 0 ]; then
                  for k in ${depends[@]}; do
                    [ -f "${ROOT_PATH}/output/${k}.ko" ] && continue # Recursively skip wext-priv and wext-core dependencies on each other.
                    _copydepends "${k}.ko"
                  done
                fi
              fi
            }
            _copydepends "${M}"
          done

          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz

  firmware:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: download to artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: modules-*
          merge-multiple: true

      - name: firmware
        run: |
          ROOT_PATH=${{ github.workspace }}

          mkdir -p ${ROOT_PATH}/firmware

          echo "copy 3rd modules"
          PARTY3RD_PATH="${ROOT_PATH}/syno-modules/thirdparty/firmware"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/firmware/

          echo "extract all modules"
          for F in output/*.tgz; do
            echo "${F}"
            mkdir -p "${F%.tgz}"
            tar -zxf "${F}" -C "${F%.tgz}" || echo "Failed to extract ${F}"
          done

          echo "get firmware"
          SOURCE=/tmp/linux-firmware
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git ${SOURCE}
          cp -rf ${SOURCE}/intel/iwlwifi/* ${SOURCE}/ 2>/dev/null || true # Move intel firmware to top dir for easy search
          while read L; do
            [ -z "${L}" ] && continue
            if [ -e "${SOURCE}/${L}" ]; then
              mkdir -p "$(dirname "firmware/${L}")"
              cp -f "${SOURCE}/${L}" "firmware/${L}"
            else
              [ -e "firmware/${L}" ] && echo "Used thirdparty ${L}" || echo "::warning ::Missing ${L}"
            fi
          done <<<$(find output -name \*.ko -exec /sbin/modinfo -F firmware {} 2>/dev/null \;)

          tar -zcf firmware.tgz -C firmware .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-firmware
          path: |
            firmware.tgz

  release:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout syno-modules
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        run: |
          # 默认以当天日期为版本号（如 26.9.12），同日重复跑则自动递增补丁位
          VERSION="$(date +'%y.%-m.%-d')"
          # 显式传入 version 且格式匹配当前年月时，以传入为准
          if [ -n "${{ inputs.version }}" ] && [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
            VERSION="${{ inputs.version }}"
          fi
          # 查 syno-modules 最新 tag：若前 3 段与当前版本相同（同日），则递增第 4 段
          LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.AiNas }}" "https://api.github.com/repos/myp015/syno-modules/releases" | jq -r '.[0].tag_name' 2>/dev/null)"
          if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2,3)" = "${VERSION}" ]; then
            if [ "$(echo ${LATEST_TAG} | awk -F '.' '{print NF}')" -ge 4 ]; then
              VERSION="$(echo ${LATEST_TAG} | awk -F '.' '{$4=$4+1}1' OFS='.')"
            else
              VERSION="${VERSION}.1"
            fi
          fi

          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: download to artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: modules-*
          merge-multiple: true

      - name: delete-artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            modules-*

      - name: Zip modules
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          echo "${VERSION}" > "output/VERSION"
          zip -9 modules-${VERSION}.zip -j output/*

      - name: Extract to syno-modules/modules
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"

          # output/ 下是各平台 tgz（download-artifact merge 后），形如
          # apollolake-7.0-4.4.180.tgz / broadwell-7.4-4.4.302.tgz 等
          # 每个 tgz 解压到 syno-modules/modules/<platform>-<version>-<kver>/ 目录
          mkdir -p syno-modules/modules
          # 清空旧内容避免残留
          find syno-modules/modules -mindepth 1 -delete 2>/dev/null || true

          COUNT=0
          for tgz in output/*.tgz; do
            [ -e "${tgz}" ] || continue
            name="$(basename "${tgz}" .tgz)"   # apollolake-7.0-4.4.180
            mkdir -p "syno-modules/modules/${name}"
            tar -zxf "${tgz}" -C "syno-modules/modules/${name}"
            COUNT=$((COUNT+1))
          done
          echo "${VERSION}" > syno-modules/modules/VERSION

          echo "=== 解压 ${COUNT} 个平台，modules/ 目录结构 ==="
          ls syno-modules/modules/
          echo "ko 总数: $(find syno-modules/modules -name '*.ko' | wc -l)"

      - name: Commit and push modules
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          cd syno-modules
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add modules/
          if git diff --cached --quiet; then
            echo "modules/ 无变化，跳过提交"
          else
            git commit -m "modules: update ${VERSION}" || echo "commit 无变化跳过"
            git push origin main
          fi

      - name: Extract release to syno-modules/release and push
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          ZIP="modules-${VERSION}.zip"

          # 解压 release 压缩包（各平台合集 tgz）到 syno-modules/release/
          mkdir -p syno-modules/release
          find syno-modules/release -mindepth 1 -delete 2>/dev/null || true
          unzip -o "${ZIP}" -d syno-modules/release/
          echo "${VERSION}" > syno-modules/release/VERSION

          echo "=== release/ 内容预览 ==="
          ls syno-modules/release/ | head -20

          # 提交并推送 release/
          cd syno-modules
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add release/
          if git diff --cached --quiet; then
            echo "release/ 无变化，跳过提交"
          else
            git commit -m "release: update ${VERSION}" || echo "commit 无变化跳过"
            git push origin main
          fi

      - name: Upload to Artifacts
        if: success() && env.VERSION == ''
        uses: actions/upload-artifact@v7
        with:
          name: modules
          path: |
            modules*.zip
          retention-days: 5

      - name: Release
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: modules*.zip
          owner: myp015
          repo: syno-modules
          token: ${{ secrets.AiNas }}
