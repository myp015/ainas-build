name: Build modules main

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    strategy:
      # 单个平台失败（如 toolchain 下载瞬时网络错误）不取消其余 job，
      # 避免一次网络抖动让全量验收整体取消（2026-09-23 epyc7003-7.4 教训）
      fail-fast: false
      matrix:
        include:
          #- version: 6.2
          #  platform: apollolake
          ##- version: 6.2
          ##  platform: braswell
          #- version: 6.2
          #  platform: broadwell
          #- version: 6.2
          #  platform: broadwellnk
          ##- version: 6.2
          ##  platform: bromolow
          #- version: 6.2
          #  platform: denverton
          #- version: 6.2
          #  platform: geminilake
          ##- version: 6.2
          ##  platform: grantley
          ##- version: 6.2
          ##  platform: kvmx64
          #- version: 6.2
          #  platform: purley
          #- version: 6.2
          #  platform: v1000

          - version: "7.0"
            platform: apollolake
          #- version: "7.0"
          #  platform: braswell
          - version: "7.0"
            platform: broadwell
          - version: "7.0"
            platform: broadwellnk
          #- version: "7.0"
          #  platform: bromolow
          - version: "7.0"
            platform: denverton
          - version: "7.0"
            platform: geminilake
          #- version: "7.0"
          #  platform: grantley
          #- version: "7.0"
          #  platform: kvmx64
          - version: "7.0"
            platform: purley
          - version: "7.0"
            platform: v1000

          - version: 7.1
            platform: apollolake
          #- version: 7.1
          #  platform: braswell
          - version: 7.1
            platform: broadwell
          - version: 7.1
            platform: broadwellnk
          - version: 7.1
            platform: broadwellnkv2
          - version: 7.1
            platform: broadwellntbap
          #- version: 7.1
          #  platform: bromolow
          - version: 7.1
            platform: denverton
          - version: 7.1
            platform: epyc7002
          - version: 7.1
            platform: geminilake
          #- version: 7.1
          #  platform: grantley
          #- version: 7.1
          #  platform: kvmx64
          - version: 7.1
            platform: purley
          - version: 7.1
            platform: r1000
          - version: 7.1
            platform: v1000

          - version: 7.2
            platform: apollolake
          #- version: 7.2
          #  platform: braswell
          - version: 7.2
            platform: broadwell
          - version: 7.2
            platform: broadwellnk
          - version: 7.2
            platform: broadwellnkv2
          - version: 7.2
            platform: broadwellntbap
          #- version: 7.2
          #  platform: bromolow
          - version: 7.2
            platform: denverton
          - version: 7.2
            platform: epyc7002
          - version: 7.2
            platform: geminilake
          - version: 7.2
            platform: geminilakenk
          #- version: 7.2
          #  platform: grantley
          #- version: 7.2
          #  platform: kvmx64
          - version: 7.2
            platform: purley
          - version: 7.2
            platform: r1000
          - version: 7.2
            platform: r1000nk
          - version: 7.2
            platform: v1000
          - version: 7.2
            platform: v1000nk

          - version: 7.3
            platform: apollolake
          #- version: 7.3
          #  platform: braswell
          - version: 7.3
            platform: broadwell
          - version: 7.3
            platform: broadwellnk
          - version: 7.3
            platform: broadwellnkv2
          - version: 7.3
            platform: broadwellntbap
          #- version: 7.3
          #  platform: bromolow
          - version: 7.3
            platform: denverton
          - version: 7.3
            platform: epyc7002
          - version: 7.3
            platform: geminilake
          - version: 7.3
            platform: geminilakenk
          #- version: 7.3
          #  platform: grantley
          #- version: 7.3
          #  platform: kvmx64
          - version: 7.3
            platform: purley
          - version: 7.3
            platform: r1000
          - version: 7.3
            platform: r1000nk
          - version: 7.3
            platform: v1000
          - version: 7.3
            platform: v1000nk

          - version: 7.4
            platform: apollolake
          #- version: 7.4
          #  platform: braswell
          - version: 7.4
            platform: broadwell
          - version: 7.4
            platform: broadwellnk
          - version: 7.4
            platform: broadwellnkv2
          - version: 7.4
            platform: broadwellntbap
          #- version: 7.4
          #  platform: bromolow
          - version: 7.4
            platform: denverton
          - version: 7.4
            platform: epyc7002
          - version: 7.4
            platform: epyc7003
          - version: 7.4
            platform: epyc7003ntb
          - version: 7.4
            platform: geminilake
          - version: 7.4
            platform: geminilakenk
          #- version: 7.4
          #  platform: grantley
          - version: 7.4
            platform: icelaked
          #- version: 7.4
          #  platform: kvmx64
          - version: 7.4
            platform: purley
          - version: 7.4
            platform: r1000
          - version: 7.4
            platform: r1000nk
          - version: 7.4
            platform: v1000
          - version: 7.4
            platform: v1000nk

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules


      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh

          echo "makeEnvDeploy"
          for i in $(seq 1 3); do makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" && break || { echo "Retry makeEnvDeploy ${i}/3"; sleep 5; }; done

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}" "${ROOT_PATH}/output"

      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}")"

          OFFICIAL_PATH="${ROOT_PATH}/syno-modules/official/hda1/${PLATFORM}-${VERSION}-${KVER}"
          PARTY3RD_PATH="${ROOT_PATH}/syno-modules/thirdparty/${PLATFORM}-${VERSION}-${KVER}"

          # =====================================================================
          # 双目录打包：
          #   output/       = makemodules 编译产物（纯编译）-> 给 modules/
          #   output_all/   = 编译 + 官方 + 第三方（合集）   -> 给 release/
          # =====================================================================

          # 纯编译产物 tgz（给 modules/）
          tar -zcf ${ROOT_PATH}/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output .

          # 建合集目录：先复制编译产物，再追加官方/第三方
          mkdir -p ${ROOT_PATH}/output_all
          cp -rf ${ROOT_PATH}/output/* ${ROOT_PATH}/output_all/

          echo "copy official modules"
          IU="apollolake braswell broadwell broadwellnk broadwellnkv2 broadwellntbap bromolow denverton geminilake grantley purley geminilakenk icelaked"
          AU="r1000 v1000 epyc7002 epyc7003 epyc7003ntb r1000nk v1000nk"
          OM=(auxiliary.ko i40e.ko ixgbe.ko processor.ko vfio.ko exfat.ko ehci-hcd.ko ehci-pci.ko uhci-hcd.ko xhci-hcd.ko xhci-pci.ko etxhci-hcd.ko)
          # vxlan 链（vxlan/udp_tunnel/ip6_udp_tunnel）已自编译（defines 开
          # CONFIG_VXLAN=m+CONFIG_NET_UDP_TUNNEL=m，src/{4.x,5.x}），不再拷贝官方
          # vxlan.ko。背景：RR 内核 CONFIG_VXLAN=y 内建 vxlan，RR 发布物无 vxlan.ko，
          # 之前对齐 RR 拷贝数量时 vxlan 不构成缺口被落下；我们自编 i40e 引用
          # vxlan_get_rx_port 且官方内核 CONFIG_VXLAN=m → 需 vxlan.ko 模块。自编译后
          # 依赖由 depends 链（vxlan→udp_tunnel,ip6_udp_tunnel）自动补齐，cks 流同样
          # 不再依赖官方拷贝。
          [ "$(echo "${KVER:-4}" | cut -d'.' -f1)" -lt 5 ] && OM+=(i915.ko mlx_compat.ko mlx4_core.ko mlx4_en.ko mlx4_ib.ko mlx5_core.ko mlx5_ib.ko ib_core.ko qed.ko qede.ko qedr.ko)
          # 所有平台全部添加 kvm_intel + kvm_amd（对齐 RR 全平台 kvm 三件套）：
          # 官方有则强制覆盖（Intel 平台 kvm-intel / AMD 平台 kvm-amd），官方没有的
          # （AMD 平台 kvm-intel / Intel 平台 kvm-amd）保留自编译产物补齐
          OM+=(irqbypass.ko kvm.ko kvm-intel.ko kvm-amd.ko)
          for M in ${OM[@]}; do
            function _copydepends() {
              # 官方模块强制覆盖自编译产物（4.x/5.x 全平台）：官方有的同名模块一律用
              # 官方版（符号集匹配官方内核最可靠，如 i40e/auxiliary/processor/exfat/kvm
              # 等；官方 i40e 自包含版修复 v1000nk 上机 i40e FAILED）。官方没有的保留
              # 自编译产物。rd 目录（官方只读版）是 hda1 的子集（重叠文件内容一致，
              # 另有 pgdrv.ko 独有），hda1 优先、rd 兜底，避免 rd 存在时误跳过覆盖。
              [ -f "${OFFICIAL_PATH}/${1}" ] && cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output_all"
              [ -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && cp -f "${OFFICIAL_PATH/hda1/rd}/${1}" "${ROOT_PATH}/output_all"
              depends=($(modinfo -F depends "${OFFICIAL_PATH}/${1}" 2>/dev/null | sed 's/,/ /g')) || true
              if [ ${#depends[*]} -gt 0 ]; then
                for k in ${depends[@]}; do
                  _copydepends "${k}.ko"
                done
              fi
            }
            _copydepends "${M}"
          done

          echo "copy 3rd modules"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/output_all/

          echo "check depends"
          for M in $(ls ${ROOT_PATH}/output_all 2>/dev/null); do
            function _copydepends() {
              if [ ! -f "${ROOT_PATH}/output_all/${1}" ] && [ ! -f "${OFFICIAL_PATH/hda1/rd}/${1}" ]; then
                if [ -f "${OFFICIAL_PATH}/${1}" ]; then
                  cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output_all"
                else
                  echo "[E] '${PLATFORM}-${KVER}' - '${M}' depends '${1}' does not exist."
                fi
              fi
              D=""
              [ -z "${D}" ] && [ -f "${ROOT_PATH}/output_all/${1}" ] && D="${ROOT_PATH}/output_all/${1}"
              [ -z "${D}" ] && [ -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && D="${OFFICIAL_PATH/hda1/rd}/${1}"
              if [ -n "${D}" ]; then
                # modinfo "${D}" || true
                depends=($(modinfo -F depends "${D}" 2>/dev/null | sed 's/,/ /g')) || true
                if [ ${#depends[*]} -gt 0 ]; then
                  for k in ${depends[@]}; do
                    [ -f "${ROOT_PATH}/output_all/${k}.ko" ] && continue # Recursively skip wext-priv and wext-core dependencies on each other.
                    _copydepends "${k}.ko"
                  done
                fi
              fi
            }
            _copydepends "${M}"
          done

          # A 类（Task#148）：geminilakenk 的 dmabuf 布局对齐 RR——RR root 无 dmabuf
          # （update/ backport 独占）。root 主线 dmabuf.ko 是冗余 over-provision：
          #   - root 栈（i915/drm/ttm）引裸 dma_buf_*/dma_fence_* 由内核 built-in 提供
          #     （modpost 未给它们加 dmabuf 模块依赖）→ 无需 root dmabuf.ko；
          #   - update backport 栈需要 dmabufbkpt_* → 由 update/dmabuf.ko（backport）提供，
          #     双份存在时 generic "dmabuf" 依赖可能解析到 root 主线版（0 bkpt）致断链。
          # 删 root 主线版：消除 ~47 裸 dma extra（对齐 RR∪amd），并消除 update 栈解析歧义。
          if [[ "${PLATFORM}" == "geminilakenk" ]] && [ -f "${ROOT_PATH}/output_all/dmabuf.ko" ] && [ -f "${ROOT_PATH}/output_all/update/dmabuf.ko" ]; then
            rm -f "${ROOT_PATH}/output_all/dmabuf.ko"
            echo "[A-class] geminilakenk: 移除 root 主线 dmabuf（保留 update/ backport 版，对齐 RR）"
          fi

          # 合集 tgz（给 release/）：文件名不带 -all，放 all/ 子目录区分纯编译
          mkdir -p ${ROOT_PATH}/all
          tar -zcf ${ROOT_PATH}/all/${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output_all .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          # 命名 all-*（不带 modules- 前缀）：与纯编译 modules-* 区分，
          # 避免 download-artifact 的 modules-* glob 误匹配合集
          name: all-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            all/*.tgz

  firmware:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: download to artifacts
        uses: actions/download-artifact@v8
        with:
          # 合集 all-* 含编译+官方+第三方全部 ko，firmware 提取需要全集
          path: output
          pattern: all-*
          merge-multiple: true

      - name: firmware
        run: |
          ROOT_PATH=${{ github.workspace }}

          mkdir -p ${ROOT_PATH}/firmware

          echo "copy 3rd modules"
          PARTY3RD_PATH="${ROOT_PATH}/syno-modules/thirdparty/firmware"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/firmware/

          echo "extract all modules"
          for F in output/*.tgz; do
            echo "${F}"
            mkdir -p "${F%.tgz}"
            tar -zxf "${F}" -C "${F%.tgz}" || echo "Failed to extract ${F}"
          done

          echo "get firmware"
          SOURCE=/tmp/linux-firmware
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git ${SOURCE}
          cp -rf ${SOURCE}/intel/iwlwifi/* ${SOURCE}/ 2>/dev/null || true # Move intel firmware to top dir for easy search
          while read L; do
            [ -z "${L}" ] && continue
            if [ -e "${SOURCE}/${L}" ]; then
              mkdir -p "$(dirname "firmware/${L}")"
              cp -f "${SOURCE}/${L}" "firmware/${L}"
            else
              [ -e "firmware/${L}" ] && echo "Used thirdparty ${L}" || echo "::warning ::Missing ${L}"
            fi
          done <<<$(find output -name \*.ko -exec /sbin/modinfo -F firmware {} 2>/dev/null \;)

          tar -zcf firmware.tgz -C firmware .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          # 去掉 modules- 前缀：避免与纯编译 modules-* 下载冲突
          name: firmware
          path: |
            firmware.tgz

  release:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout syno-modules
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        run: |
          # 按月低增版本号（26.9.0 / 26.9.1 / 26.9.2 ...），同月重复发布第 3 段 +1
          # 显式传入 version 且格式匹配当前年月时，以传入为准（切换新格式首发可显式传 26.9.1）
          if [ -n "${{ inputs.version }}" ] && [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 自动：查 syno-modules 最新 tag，同月则第 3 段 +1，跨月则 .0
            LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.AiNas }}" "https://api.github.com/repos/myp015/syno-modules/releases" | jq -r '.[0].tag_name' 2>/dev/null)"
            if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              if [ "$(echo ${LATEST_TAG} | awk -F '.' '{print NF}')" -ge 4 ]; then
                # 旧格式 4 段 tag（如 26.9.13.1）不参与低增，回退到月份首版
                VERSION="$(date +'%y.%-m').0"
              else
                VERSION="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              fi
            else
              VERSION="$(date +'%y.%-m').0"
            fi
          fi

          # 防残留 tag 冲突：Calculate version 只查 releases[0]，历史失败 run 可能
          # 留下 git tag 但无 release 对象（如 26.9.12）→ release-action 422
          # already_exists。循环 +1 直到对应 git tag 不存在（最多 20 次防死循环）。
          for i in $(seq 1 20); do
            if curl -skLH "Authorization: token ${{ secrets.AiNas }}" \
                 "https://api.github.com/repos/myp015/syno-modules/git/refs/tags/${VERSION}" 2>/dev/null \
                 | grep -q '"ref"'; then
              VERSION="$(echo ${VERSION} | awk -F '.' '{$3=$3+1}1' OFS='.')"
            else
              break
            fi
          done

          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: download to artifacts (compile)
        # v8 批量下载大 artifact 偶发 digest-mismatch（127 个 modules-* 全量下载）→
        # 降 v4（无 digest 校验，成熟稳定）。pattern 单行：v4 也不支持多行负 pattern。
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: modules-*
          merge-multiple: true

      - name: download to artifacts (all)
        uses: actions/download-artifact@v4
        with:
          path: output_all
          pattern: all-*
          merge-multiple: true

      - name: delete-artifact
        # 仅 download 成功才删（if: success()）：download 失败时保留 artifacts，
        # 否则编译产物被无条件删除后无法重跑 Extract/手动下载验证。
        if: success()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            modules-*
            all-*
            firmware

      - name: Zip modules
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          # release 压缩包 = 合集（output_all/，含官方+编译+第三方）
          echo "${VERSION}" > "output_all/VERSION"
          zip -9 modules-${VERSION}.zip -j output_all/*

      - name: Extract to syno-modules/modules
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"

          # output/ 下是各平台纯编译 tgz（download compile 产物），形如
          # apollolake-7.0-4.4.180.tgz / broadwell-7.4-4.4.302.tgz 等
          # 每个 tgz 解压到 syno-modules/modules/<platform>-<version>-<kver>/ 目录
          mkdir -p syno-modules/modules
          # 先清空旧内容，避免版本混合残留（fail fast：find 失败直接中止）
          find syno-modules/modules -mindepth 1 -delete

          COUNT=0
          for tgz in output/*.tgz; do
            [ -e "${tgz}" ] || continue
            name="$(basename "${tgz}" .tgz)"   # apollolake-7.0-4.4.180
            mkdir -p "syno-modules/modules/${name}"
            tar -zxf "${tgz}" -C "syno-modules/modules/${name}"
            COUNT=$((COUNT+1))
          done
          echo "${VERSION}" > syno-modules/modules/VERSION

          echo "=== 解压 ${COUNT} 个平台，modules/ 目录结构 ==="
          ls syno-modules/modules/
          echo "ko 总数: $(find syno-modules/modules -name '*.ko' | wc -l)"

          # 断言：纯编译 tgz 未下载则 COUNT=0，直接失败而非提交空目录
          if [ "${COUNT}" -eq 0 ]; then
            echo "FATAL: 未解压任何平台（download compile 异常），中止提交"
            exit 1
          fi

      - name: Commit and push modules
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          cd syno-modules
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add modules/
          if git diff --cached --quiet; then
            echo "modules/ 无变化，跳过提交"
          else
            git commit -m "modules: update ${VERSION}" || echo "commit 无变化跳过"
            git push origin main
          fi

      - name: Extract release to syno-modules/release and push
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"

          # output_all/ 下是各平台合集 tgz（download all 产物，编译+官方+第三方），
          # 与 modules/ 一致：按平台分目录 release/<plat>-<ver>-<kver>/
          mkdir -p syno-modules/release
          # 先清空旧内容，避免版本混合残留（fail fast：find 失败直接中止）
          find syno-modules/release -mindepth 1 -delete

          COUNT=0
          for tgz in output_all/*.tgz; do
            [ -e "${tgz}" ] || continue
            name="$(basename "${tgz}" .tgz)"   # apollolake-7.0-4.4.180
            mkdir -p "syno-modules/release/${name}"
            tar -zxf "${tgz}" -C "syno-modules/release/${name}"
            COUNT=$((COUNT+1))
          done
          echo "${VERSION}" > syno-modules/release/VERSION

          echo "=== 解压 ${COUNT} 个平台，release/ 目录结构 ==="
          ls syno-modules/release/
          echo "ko 总数: $(find syno-modules/release -name '*.ko' | wc -l)"

          # 断言：合集 tgz 未下载则 COUNT=0，直接失败而非提交空目录
          if [ "${COUNT}" -eq 0 ]; then
            echo "FATAL: 未解压任何平台（download all 异常），中止提交"
            exit 1
          fi

          # 提交并推送 release/
          cd syno-modules
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add release/
          if git diff --cached --quiet; then
            echo "release/ 无变化，跳过提交"
          else
            git commit -m "release: update ${VERSION}" || echo "commit 无变化跳过"
            git push origin main
          fi

      - name: Upload to Artifacts
        if: success() && env.VERSION == ''
        uses: actions/upload-artifact@v7
        with:
          name: modules
          path: |
            modules*.zip
          retention-days: 5

      - name: Release
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: modules*.zip
          owner: myp015
          repo: syno-modules
          token: ${{ secrets.AiNas }}
