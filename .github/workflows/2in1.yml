# 双源 2in1 工作流：每次编译选择一个 RR 源
#   ainas → myp015/ainas-rr（镜像 myp015/rr）
#   RROrg → RROrg/rr（镜像 wjz304/rr）
# 两种源的 addons/modules/lkms/cks 全部取自 rr.img，不再调用 get* 覆盖。
# Release 命名：ainas → ainas-2in1_<版本>；RROrg → RROrg-2in1_<版本>
# 型号勾选项只用 7 个通用型号；DVA 系列等请通过 custom_models 手动输入。
name: Build RR-2in1
on:
  workflow_dispatch:
    inputs:
      rr_source:
        description: "RR 源（每次编译只能选一个）"
        type: choice
        options:
          - ainas
          - RROrg
        default: ainas
      all_models:
        description: "编译模式"
        type: choice
        options:
          - 自选
          - 全选
        default: 全选
      model_ds918p:
        description: "DS918+"
        type: boolean
        default: false
      model_ds920p:
        description: "DS920+"
        type: boolean
        default: false
      model_ds923p:
        description: "DS923+"
        type: boolean
        default: false
      model_ds925p:
        description: "DS925+"
        type: boolean
        default: false
      model_ds3622xsp:
        description: "DS3622xs+"
        type: boolean
        default: false
      model_sa6400:
        description: "SA6400"
        type: boolean
        default: false
      model_ds425p:
        description: "DS425+"
        type: boolean
        default: false
      custom_models:
        description: "自定义型号(工作流未列出的,多个用逗号分隔,如 DS1621+,DVA3221,DS3617xs)"
        type: string
        default: ""
      build_update_zip:
        description: "编译升级包（updateall-*.zip）默认开启"
        type: boolean
        default: true
      overwrite_base:
        description: "覆盖所选源的 2in1-base（默认复用 Release 中已存在的 base）"
        type: boolean
        default: false
      rr_version:
        description: "RR version (可选，留空=latest；指定版本必须在所选源中存在，不做回退)"
        type: string
        default: ""
      dsm_version:
        description: "DSM 版本编号（6.2.4 仅 ainas 源支持；RROrg 源不支持 6.2）"
        type: choice
        options:
          - "6.2.4"
          - "7.2.1"
          - "7.2.2"
          - "7.3.0"
          - "7.3.1"
          - "7.3.2"
          - "7.4.1"
        default: "7.4.1"

jobs:
  # 一次性解析源版本、选择型号并生成 matrix 任务，下游只读 needs.plan.outputs。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.plan.outputs.source }}
      rr_tag: ${{ steps.plan.outputs.rr_tag }}
      rr_asset_url: ${{ steps.plan.outputs.rr_asset_url }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_title: ${{ steps.plan.outputs.release_title }}
      release_notes: ${{ steps.plan.outputs.release_notes }}
      base_asset: ${{ steps.plan.outputs.base_asset }}
      docker_image: ${{ steps.plan.outputs.docker_image }}
      docker_tag: ${{ steps.plan.outputs.docker_tag }}
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7

      - name: 规划源与构建任务
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
          RR_SOURCE: ${{ inputs.rr_source }}
          RR_VERSION: ${{ inputs.rr_version }}
          DSM_VERSION: ${{ inputs.dsm_version }}
          ALL_MODELS: ${{ inputs.all_models }}
          CUSTOM_MODELS: ${{ inputs.custom_models }}
          BUILD_UPDATE_ZIP: ${{ inputs.build_update_zip }}
          MODEL_DS918P: ${{ inputs.model_ds918p }}
          MODEL_DS920P: ${{ inputs.model_ds920p }}
          MODEL_DS923P: ${{ inputs.model_ds923p }}
          MODEL_DS925P: ${{ inputs.model_ds925p }}
          MODEL_DS3622XSP: ${{ inputs.model_ds3622xsp }}
          MODEL_SA6400: ${{ inputs.model_sa6400 }}
          MODEL_DS425P: ${{ inputs.model_ds425p }}
        run: bash .github/scripts/plan_sources.sh 2in1

  # 单独串行创建并确认 Release，避免 matrix 任务并发创建同一标签触发 429/503。
  ensure-release:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: 创建或确认 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.plan.outputs.release_title }}
          RELEASE_NOTES: ${{ needs.plan.outputs.release_notes }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          # 单个 job 仍可能遇到 GitHub 短暂 429/503；串行重试创建/查询，避免 matrix 一开始被阻断。
          for attempt in $(seq 1 12); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "[INFO] Release 已确认可见: $RELEASE_TAG（源=${SOURCE}）"
              exit 0
            fi
            echo "[INFO] 创建或确认 Release: $RELEASE_TAG（源=${SOURCE}）(${attempt}/12)"
            set +e
            create_out=$(gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest=false 2>&1)
            create_rc=$?
            set -e
            if [ "$create_rc" -eq 0 ]; then
              echo "[INFO] Release 创建成功，等待 API 可见"
            else
              echo "$create_out"
              if ! echo "$create_out" | grep -qiE 'already exists|already_exists|Validation Failed|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate'; then
                exit "$create_rc"
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "[E] Release ${RELEASE_TAG} 创建/查询连续失败" >&2
          exit 1

  # 公共 base：下载 RR、改分区 label、资产包、addons/initrd 补丁这些与型号和
  # DSM 版本线都无关的工作，每个源只做一次，作为 Release 资产永久存放。
  # 不在本 job 做 patch_part1（grub.cfg 与型号相关），也不跑 docker make。
  prepare-base:
    needs: [plan, ensure-release]
    runs-on: ubuntu-24.04
    env:
      RR_ASSET_URL: ${{ needs.plan.outputs.rr_asset_url }}
      RR_TAG: ${{ needs.plan.outputs.rr_tag }}
      TAG: ${{ needs.plan.outputs.rr_tag }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      BASE_ASSET: ${{ needs.plan.outputs.base_asset }}
      SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查是否复用已有 base
        id: check
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          OVERWRITE_BASE: ${{ inputs.overwrite_base }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${TAG:?缺少 TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          EXISTS="false"
          if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "$BASE_ASSET" \
             || printf '%s\n' "$ASSET_NAMES" | grep -Fxq "${BASE_ASSET}.part.000"; then
            EXISTS="true"
          fi

          if [ "$EXISTS" = "true" ] && [ "${OVERWRITE_BASE:-false}" != "true" ]; then
            echo "[INFO] Release ${RELEASE_TAG}（源=${SOURCE}）已存在 ${BASE_ASSET}，复用（未勾选覆盖）"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] 需要构建 base（exists=${EXISTS} overwrite=${OVERWRITE_BASE:-false}）"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout ainas-2in1
        if: steps.check.outputs.rebuild == 'true'
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载 RR 镜像
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${RR_TAG:?缺少 RR_TAG}"
          : "${RR_ASSET_URL:?缺少 RR_ASSET_URL}"
          FILENAME="rr-${RR_TAG}.zip"
          curl -fsSL --connect-timeout 10 "$RR_ASSET_URL" -o "$FILENAME"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

      - name: 构建公共 base
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          . "$AINAS2IN1_DIR/script/2in1func.sh"

          sudo apt-get update
          sudo apt-get install -y gettext cpio zstd dosfstools rsync qemu-utils

          unzip "$FILENAME" -d rr rr.img

          # ── 改分区 label ──────────────────────────────────────────
          GRUB_LOOP=$(sudo losetup -f)
          sudo mkdir -p "$PART1_PATH" "$PART3_PATH"
          sudo losetup -P "$GRUB_LOOP" rr/rr.img
          sudo e2label "${GRUB_LOOP}p2" RDGZ
          sudo e2label "${GRUB_LOOP}p3" RAMDISK
          sudo fatlabel "${GRUB_LOOP}p1" AiNasloader
          sudo losetup --detach "$GRUB_LOOP"

          # ── p3：bzImage 改名 + 资产包 + addons/cpuinfo/initrd 补丁 ──
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"

          if [ -f "$PART3_PATH/bzImage-rr" ]; then
            sudo mv -f "$PART3_PATH/bzImage-rr" "$PART3_PATH/bzImage-ainas"
            echo "[INFO] 已将 bzImage-rr 重命名为 bzImage-ainas"
          else
            echo "[INFO] p3 分区中未找到 bzImage-rr，跳过重命名"
          fi

          # addons/modules/lkms/cks 全部取自 rr.img：不调用 get* 覆盖 myp015 Release 资产。
          # 缺失任何一个都立即失败，避免静默跳过导致产物与源不一致。
          echo "[INFO] 源=${SOURCE}：使用 rr.img 内置资产"
          for d in cks lkms addons modules; do
            if [ ! -d "${PART3_PATH}/${d}" ] || [ -z "$(ls -A "${PART3_PATH}/${d}")" ]; then
              echo "[E] rr.img 的 p3 缺少内置资产目录或为空: ${d}" >&2
              exit 1
            fi
          done
          for f in "addons/cpuinfo/all.tgz" "addons/disks/all.tgz"; do
            if [ ! -f "${PART3_PATH}/${f}" ]; then
              echo "[E] rr.img 的 p3 缺少内置资产: ${f}" >&2
              exit 1
            fi
          done

          # MODEL 仅用于日志，patch_addons_disk 本身不区分型号
          patch_addons_disk "$PART3_PATH" "BASE"
          patch_cpuinfo "${PART3_PATH}/addons" "2in1_patch-cpuinfo.py" verify
          patch_ram "$PART3_PATH" 2in1 "$WORKDIR" "$TAG"

          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          sudo rm -rf "$PART3_PATH"

          # ── p1：生成 AINAS_VERSION ─────────────────────────────────
          # update 包只从 p1 取 AINAS_VERSION + EFI 两个文件（不含 grub.cfg），
          # 该文件与型号无关，在这里生成后 update job 不再需要 patch_part1。
          PL1=$(sudo losetup -f)
          sudo losetup -P "$PL1" rr/rr.img
          sudo mount "${PL1}p1" "$PART1_PATH"
          if [ -f "$PART1_PATH/RR_VERSION" ]; then
            sudo cp -f "$PART1_PATH/RR_VERSION" "$PART1_PATH/AINAS_VERSION"
            echo "[INFO] base p1 已生成 AINAS_VERSION: $(sudo cat "$PART1_PATH/AINAS_VERSION" | tr -d '\r\n ')"
          elif [ -f "$PART1_PATH/AINAS_VERSION" ]; then
            echo "[INFO] base p1 AINAS_VERSION 已存在"
          else
            echo "[E] base p1 既无 RR_VERSION 也无 AINAS_VERSION" >&2
            sudo umount "$PART1_PATH"
            sudo losetup --detach "$PL1"
            exit 1
          fi
          sudo umount "$PART1_PATH"
          sudo losetup --detach "$PL1"

          rm -rf "$AINAS2IN1_DIR"

          # 预压缩；Release 单文件超过 2GB 时上传前再分卷
          zstd -3 -T0 -q -f rr/rr.img -o 2in1-base.img.zst
          ls -lh 2in1-base.img.zst

      # 上传到 ainas-2in1 的 Release（与最终镜像放在一起），Release 资产默认永久保存。
      # 单文件超过 GitHub 2GB 上限时按 release_publish.sh 同样的 1900MB 规则分卷。
      # 仅在需要构建（缺失或勾选覆盖）时执行，上传前删除同名旧资产以完成替换。
      - name: 上传公共 base 到 Release
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${TAG:?缺少 TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          mv -f 2in1-base.img.zst "$BASE_ASSET"
          SIZE=$(stat -c%s "$BASE_ASSET")
          echo "[INFO] base 大小=${SIZE} 字节"
          UPLOAD_FILES=()
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "[INFO] 超过 GitHub 单文件 2GB 上限，按 1900MB 分卷"
            rm -f "${BASE_ASSET}.part."*
            split -b 1900M -d -a 3 "$BASE_ASSET" "${BASE_ASSET}.part."
            UPLOAD_FILES=("${BASE_ASSET}".part.*)
          else
            UPLOAD_FILES=("$BASE_ASSET")
          fi

          # 先删除同名旧资产，避免单文件/分卷形态切换后残留旧内容
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$BASE_ASSET"|"$BASE_ASSET".part.*) gh release delete-asset "$RELEASE_TAG" "$name" --yes ;;
            esac
          done

          gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}"
          echo "[INFO] base 已上传到 Release: ${RELEASE_TAG}"

  build:
    name: ${{ matrix.kind == 'update' && 'build (update)' || format('build ({0})', matrix.model) }}
    needs: [plan, prepare-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      LANGUAGE: zh_CN
      KERNEL: official
      ADDONS: acpid,reboottoloader,addincards,cpuinfo,expands,diskcompat,lsiutil,nvmevolume,powersched,remotefs,storagepanel,smartctl,trivial,apppatch,vmtools,resizepart
      ACTION_TOKEN: ${{ secrets.AiNas }}
      LINE: ${{ inputs.dsm_version }}
      SOURCE: ${{ needs.plan.outputs.source }}
      TAG: ${{ needs.plan.outputs.rr_tag }}
      RR_TAG: ${{ needs.plan.outputs.rr_tag }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_NOTES: ${{ needs.plan.outputs.release_notes }}
      BASE_ASSET: ${{ needs.plan.outputs.base_asset }}
      RR_DOCKER_IMAGE: ${{ needs.plan.outputs.docker_image }}
      RR_DOCKER_TAG: ${{ needs.plan.outputs.docker_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: 初始化环境
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载公共 base
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          : "${BASE_ASSET:?缺少 BASE_ASSET}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          mkdir -p base
          gh release download "$RELEASE_TAG" \
            --pattern "${BASE_ASSET}*" \
            --dir base --clobber
          if [ -f "base/${BASE_ASSET}" ]; then
            echo "[INFO] base 为单文件"
          else
            # 超过 2GB 时 Release 只存分卷，编译步骤按文件名顺序流式合并解压
            compgen -G "base/${BASE_ASSET}.part.*" >/dev/null || {
              echo "[E] Release ${RELEASE_TAG} 中未找到 base 资产 ${BASE_ASSET}" >&2
              exit 1
            }
            echo "[INFO] base 为分卷，编译步骤将流式合并解压（不落盘合并文件）"
          fi

      - name: 编译镜像
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail

          # ── 目录变量 ──────────────────────────────────────────────
          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          REPACK_STAGE_DIR="/tmp/repack-stage"
          PAT_XLSX_URL="https://raw.githubusercontent.com/myp015/ainas-rr/main/docs/pats.xlsx"
          PAT_XLSX="/tmp/pats.xlsx"
          DSM_INSTALL_DIR="/tmp/dsm-install"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          # 流程函数库（patch_* / docker_* / repack_* / dsm_setup）
          . "$AINAS2IN1_DIR/script/2in1func.sh"

          # ── UPDATE 特殊处理 ────────────────────────────────────────
          # 升级包只出一份，不再按 DT / 非 DT 平台区分：update-list.yml 只取 p1/p3 的通用文件，
          # patch_ram（2in1 变体）与 patch_addons_disk 都不依赖型号，被 patch_part1 改写的
          # grub.cfg 也不在 update 包里 —— 两个任务的产物本来就逐字节等价。
          # 占位型号仅用于跑通主流程；6.2 没有 epyc7002，故按版本线挑一个存在的型号。
          UPDATE_ONLY="false"
          if [ "${MODEL}" = "__UPDATE__" ]; then
            UPDATE_ONLY="true"
            if [ "${LINE:-7.3.2}" = "6.2.4" ]; then
              MODEL="DS918+"
            else
              MODEL="SA6400"
            fi
          fi

          # DSM 版本映射由上面 source 的 2in1func.sh 提供（pick_dsm_version）

          LINE_REQ="${LINE:-7.3.2}"
          export LINE_REQ
          if echo "${MODEL}" | grep -Eq '^(DS925\+|DS425\+)$' && [ "${LINE_REQ}" = "7.2.1" ]; then
            echo "[INFO] ${MODEL} 不支持 DSM 7.2.1，自动切换到 7.2.2"
            LINE_REQ="7.2.2"
          fi

          VERSION="$(pick_dsm_version "${LINE_REQ}")"
          LINE_SHORT="${LINE_REQ%.*}"
          export LINE_SHORT

          VER_MAIN="${VERSION%%-*}"
          VER_MAIN_NODOT="${VER_MAIN//./}"
          VER_BUILD="${VERSION#*-}"
          VER_BUILD="${VER_BUILD%%-*}"
          VER_SLUG="${VER_MAIN_NODOT}_${VER_BUILD}"
          SAFE_TAG="${TAG//./_}"
          echo "SAFE_TAG=${SAFE_TAG}" >> "$GITHUB_ENV"

          # 制品名的容量后缀跟随基础镜像的实际大小（GiB，四舍五入），镜像扩容后自动同步。
          case "${LINE_REQ}" in
            6.2*) GRUB_IMAGE="grub_6.2.img.gz" ;;
            *)    GRUB_IMAGE="grub.img.gz" ;;
          esac
          IMG_GIB=$(( ( $(gzip -l "${AINAS2IN1_DIR}/img/${GRUB_IMAGE}" | awk 'NR==2{print $2}') + 536870912 ) / 1073741824 ))

          # 制品品牌随源区分：RROrg 源产物名带 RROrg-2in1，ainas 源保持 Ainas2in1
          if [ "${SOURCE}" = "RROrg" ]; then ARTIFACT_BRAND="RROrg-2in1"; else ARTIFACT_BRAND="Ainas2in1"; fi
          ARTIFACT="${MODEL}_${VER_SLUG}_${IMG_GIB}g_${ARTIFACT_BRAND}_${SAFE_TAG}"
          echo "[INFO] 型号=${MODEL} 目标DSM版本=${VERSION} DSM系列=${LINE_REQ} 制品版本=${VER_SLUG} 源=${SOURCE}"

          # ── 系统依赖 ───────────────────────────────────────────────
          # pigz 用于镜像压缩：gzip -1 单线程约 144s，pigz 可降到数十秒
          sudo apt-get update
          sudo apt-get install -y gettext cpio zstd dosfstools rsync qemu-utils pigz

          # ── 恢复公共 base ──────────────────────────────────────────
          # 下载 RR、分区 label、资产包、addons/initrd 补丁等与型号无关的步骤
          # 已在 prepare-base 完成；这里只解压并挂上分区，供型号相关步骤使用。
          mkdir -p rr
          if [ -f "base/${BASE_ASSET}" ]; then
            zstd -d -q -f "base/${BASE_ASSET}" -o rr/rr.img
          else
            # 分卷直接流式解压，避免额外落盘一份合并文件占用 runner 磁盘
            compgen -G "base/${BASE_ASSET}.part.*" >/dev/null || {
              echo "[E] 未找到公共 base: base/${BASE_ASSET}" >&2
              exit 1
            }
            cat base/${BASE_ASSET}.part.* | zstd -d -q -f - -o rr/rr.img
          fi
          rm -rf base

          # rr.img 必须保持 attached：容器内 .bashrc 按分区 label 挂载 p1/p2/p3
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          sudo mkdir -p "$PART1_PATH" "$PART3_PATH"

          # ── docker_build 的 initrd 依赖 ────────────────────────────
          # docker_build 会读取 /tmp/initrd_work/opt/ainas 与 root/.bashrc。
          # base 里已由 patch_ram 生成 initrd-ainas，这里重新解包即可（约 10-20s）。
          if [ "${UPDATE_ONLY}" != "true" ]; then
            sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
            sudo rm -rf /tmp/initrd_work
            unpackInitrd "${PART3_PATH}/initrd-ainas" /tmp/initrd_work
            sudo umount "$PART3_PATH"
          fi

          # ── GRUB 修补（只有 grub.cfg 与型号相关，必须在型号 job 内做）──
          if [ "${UPDATE_ONLY}" != "true" ]; then
            patch_part1 rr/rr.img "$PART1_PATH" 2in1 "$MODEL" "$LINE_SHORT"
          fi

          # ── 使用 RR Docker 编译镜像（非 UPDATE 模式）─────────────
          if [ "${UPDATE_ONLY}" != "true" ]; then
            docker_build 2in1 "$MODEL" "$VERSION" "$LANGUAGE" "$ADDONS" "$RR_DOCKER_TAG" \
              "$WORKDIR" "$REPACK_STAGE_DIR"
          fi

          # ── 清理 p3 临时文件 ──────────────────────────────────────
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
          sudo rm -rf "$PART3_PATH/dl" "$PART3_PATH/auxfiles" "$PART3_PATH/logs"
          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"

          # ── UPDATE 包构建 ─────────────────────────────────────────
          UPDATE_ZIP=""
          ZIP_NAME=""

          if [ "${UPDATE_ONLY}" = "true" ]; then
            bash "$AINAS2IN1_DIR/script/2in1_build_update.sh" rr/rr.img "$GITHUB_WORKSPACE" ""
            # find 无匹配时返回 0 且输出为空（`ls | head` 在 pipefail 下会因 ls 的退出码中断）
            RAW_UPDATE_ZIP="$(find . -maxdepth 1 -name 'updateall-*.zip' -print -quit)"
            if [ -n "$RAW_UPDATE_ZIP" ] && [ -f "$RAW_UPDATE_ZIP" ]; then
              # 保持 updateall-*.zip 原名上传，不再重命名
              UPDATE_ZIP="$(basename "$RAW_UPDATE_ZIP")"
            else
              echo "[E] 未生成 updateall-*.zip" >&2
              exit 1
            fi
          else
            # ── 2in1 镜像重打包 ───────────────────────────────────
            repack_2in1 "$WORKDIR" "$REPACK_STAGE_DIR"

            # ── DSM 自动安装（解析 pats.xlsx → 启容器 → 安装 → 停容器）──
            dsm_setup "$MODEL" "$LINE_REQ" "$PAT_XLSX_URL" "$DSM_INSTALL_DIR" \
              "$WORKDIR" \
              "$AINAS2IN1_DIR/docker/docker-compose.yaml" "$DSM_INSTALL_DIR/docker-compose.yaml" \
              "_${IMG_GIB}g_${ARTIFACT_BRAND}" "$SAFE_TAG" "180" \
              "s#\./rr.img:/rr.img#${WORKDIR}/rr/rr.img:/rr.img#g"

            cd "$WORKDIR"
            echo "[INFO] 开始重命名并导出镜像（img.gz）"
            mv -f rr/rr.img "${ARTIFACT}.img"
            echo "[INFO] 开始 gzip 压缩: ${ARTIFACT}.img -> ${ARTIFACT}.img.gz"
            pigz -1 -p "$(nproc)" -c "${ARTIFACT}.img" > "${ARTIFACT}.img.gz"
            echo "[INFO] gzip 压缩完成: ${ARTIFACT}.img.gz"
            ZIP_NAME="${ARTIFACT}.img.gz"
          fi

          rm -f "$WORKDIR/2in1func.sh"
          rm -rf "$AINAS2IN1_DIR" "${REPACK_STAGE_DIR:-}"

          echo "ARTIFACT=${ARTIFACT}"   >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "UPDATE_ZIP=$UPDATE_ZIP" >> "$GITHUB_ENV"

      - name: 发布制品到 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"

          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          # 分卷、Release 自愈、退避重试统一在 .github/scripts/release_publish.sh 里
          ASSET_ARGS=()
          [ -n "${ARTIFACT_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$ARTIFACT_ZIP")
          [ -n "${UPDATE_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$UPDATE_ZIP")

          bash "$GITHUB_WORKSPACE/.github/scripts/release_publish.sh" \
            "$RELEASE_TAG" "${RELEASE_NOTES:-RR build artifacts}" "${ASSET_ARGS[@]}"

      # 串口完整日志、套件检查输出、结论摘要统一由 dsm_setup 写到 /tmp/dsm-install/logs。
      # 无论成功失败都上传 Actions artifact，便于后续分析（默认保留 90 天，这里显式 30 天）。
      - name: 上传 DSM 构建日志（串口/套件检查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsm-logs-${{ matrix.kind == 'update' && 'update' || matrix.model }}-${{ github.run_id }}
          path: /tmp/dsm-install/logs
          if-no-files-found: warn
          retention-days: 30

      # 套件检查或安装失败时，把日志压缩后附加到本次构建对应的 Release，
      # 无需登录 runner 也能下载现场日志。成功构建不附加，避免污染制品列表。
      - name: 失败时将 DSM 日志附加到 Release
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          LOG_DIR=/tmp/dsm-install/logs
          if [ ! -d "$LOG_DIR" ]; then
            echo "[INFO] 无日志目录，跳过 Release 日志上传"
            exit 0
          fi
          shopt -s nullglob
          files=("$LOG_DIR"/*.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "[INFO] 无日志文件，跳过 Release 日志上传"
            exit 0
          fi
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "[WARN] RELEASE_TAG 未设置（失败发生在加载源配置之前），跳过 Release 日志上传"
            exit 0
          fi
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          for f in "${files[@]}"; do
            gzip -1 -c "$f" > "$f.gz"
          done
          gh release upload "${RELEASE_TAG}" "$LOG_DIR"/*.log.gz --clobber
