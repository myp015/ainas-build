name: Build RR-2in1
on:
  workflow_dispatch:
    inputs:
      all_models:
        description: "编译模式"
        type: choice
        options:
          - 自选
          - 全选
        default: 全选
      model_ds918p:
        description: "DS918+"
        type: boolean
        default: false
      model_ds920p:
        description: "DS920+"
        type: boolean
        default: false
      model_ds923p:
        description: "DS923+"
        type: boolean
        default: false
      model_ds925p:
        description: "DS925+"
        type: boolean
        default: false
      model_ds3622xsp:
        description: "DS3622xs+"
        type: boolean
        default: false
      model_sa6400:
        description: "SA6400"
        type: boolean
        default: false
      model_ds425p:
        description: "DS425+"
        type: boolean
        default: false
      model_dva3221:
        description: "DVA3221"
        type: boolean
        default: false
      model_dva1622:
        description: "DVA1622"
        type: boolean
        default: false
      custom_models:
        description: "自定义型号(工作流未列出的,多个用逗号分隔,如 DS1621+,RS4021xs+)"
        type: string
        default: ""      
        
      build_update_zip:
        description: "编译升级包（updateall-*.zip）默认开启"
        type: boolean
        default: true
      rr_version:
        description: "RR version (可选，留空=latest；示例：26.4.0 或 v26.4.0)"
        type: string
        default: ""
      dsm_version:
        description: "DSM 版本编号（从 pats.xlsx 获取，选择 >= 7.2.1 的所有版本）"
        type: choice
        options:
          - "7.2.1"
          - "7.2.2"
          - "7.3.0"
          - "7.3.1"
          - "7.3.2"
          - "7.4.1"
        default: "7.4.1"

jobs:
  resolve-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      asset_url: ${{ steps.pick.outputs.asset_url }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          REQ_RAW="${{ inputs.rr_version }}"
          REQ_TAG="$(printf '%s' "$REQ_RAW" | tr -d '[:space:]')"
          REQ_TAG="${REQ_TAG#rr-}"
          REQ_TAG="${REQ_TAG%.img.zip}"
          REQ_TAG="${REQ_TAG#v}"

          # 必须带凭据：runner 是共享出口 IP，匿名调用只有 60 次/小时，实测撞过 403
          fetch_latest() {
            curl -fsSL --connect-timeout 10 -H "Authorization: Bearer ${{ secrets.AiNas }}" "https://api.github.com/repos/RROrg/rr/releases/latest"
          }
          fetch_tag() {
            local t="$1"
            curl -fsSL --connect-timeout 10 -H "Authorization: Bearer ${{ secrets.AiNas }}" "https://api.github.com/repos/RROrg/rr/releases/tags/${t}"
          }

          if [ -z "$REQ_TAG" ] || [ "$REQ_TAG" = "latest" ]; then
            JSON="$(fetch_latest)"
          else
            if ! JSON="$(fetch_tag "$REQ_TAG" 2>/dev/null)"; then
              echo "[INFO] 指定版本 rr_version=${REQ_RAW} 未找到，回退到最新版本"
              JSON="$(fetch_latest)"
            fi
          fi

          RR_TAG="$(printf '%s' "$JSON" | jq -r '.tag_name' | sed 's/^v//')"
          ASSET_URL="$(printf '%s' "$JSON" | jq -r '.assets[]? | select(.name | test("^rr-.*[.]img[.]zip$")) | .browser_download_url' | head -n1)"
          if [ -z "$RR_TAG" ] || [ "$RR_TAG" = "null" ] || [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "[E] 下载失败 (rr_version=${REQ_RAW:-latest})"
            exit 1
          fi

          echo "tag=$RR_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

  select-models:
    runs-on: ubuntu-24.04
    outputs:
      models: ${{ steps.pick.outputs.models }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          MODELS=()

          if [ "${{ inputs.all_models }}" = "全选" ]; then
            echo "[INFO] 已开启全选，将编译所有支持的型号"
            MODELS+=("DS918+" "DS920+" "DS923+" "DS925+" "DS3622xs+" "SA6400" "DS425+" "DVA3221" "DVA1622")
          else
            [ "${{ inputs.model_ds918p }}"   = "true" ] && MODELS+=("DS918+")
            [ "${{ inputs.model_ds920p }}"   = "true" ] && MODELS+=("DS920+")
            [ "${{ inputs.model_ds923p }}"   = "true" ] && MODELS+=("DS923+")
            [ "${{ inputs.model_ds925p }}"   = "true" ] && MODELS+=("DS925+")
            [ "${{ inputs.model_ds3622xsp }}" = "true" ] && MODELS+=("DS3622xs+")
            [ "${{ inputs.model_sa6400 }}"   = "true" ] && MODELS+=("SA6400")
            [ "${{ inputs.model_ds425p }}"   = "true" ] && MODELS+=("DS425+")
            [ "${{ inputs.model_dva3221 }}"  = "true" ] && MODELS+=("DVA3221")
            [ "${{ inputs.model_dva1622 }}"  = "true" ] && MODELS+=("DVA1622")
          fi

          # 追加自定义型号（工作流未列出的型号）
          CUSTOM_RAW="${{ inputs.custom_models }}"
          if [ -n "$(printf '%s' "$CUSTOM_RAW" | tr -d '[:space:]')" ]; then
            echo "[INFO] 检测到自定义型号输入: ${CUSTOM_RAW}"
            IFS=',' read -ra CUSTOM_ARR <<< "$CUSTOM_RAW"
            for cm in "${CUSTOM_ARR[@]}"; do
              cm="$(echo "$cm" | xargs)"
              [ -n "$cm" ] && MODELS+=("$cm")
            done
          fi
          
          # 去重
          UNIQ_MODELS=()
          for m in "${MODELS[@]}"; do
            skip=0
            for u in "${UNIQ_MODELS[@]}"; do
              [ "$u" = "$m" ] && { skip=1; break; }
            done
            [ $skip -eq 0 ] && UNIQ_MODELS+=("$m")
          done
          MODELS=("${UNIQ_MODELS[@]}")

          if [ "${{ inputs.build_update_zip }}" = "true" ]; then
            MODELS+=("__UPDATE__")
          fi

          if [ ${#MODELS[@]} -eq 0 ]; then
            echo "[E] 请至少勾选一个型号，或勾选 update 包编译"
            exit 1
          fi

          JSON_OUT="["
          for m in "${MODELS[@]}"; do
            JSON_OUT+="\"$m\","
          done
          JSON_OUT="${JSON_OUT%,}]"
          echo "models=$JSON_OUT" >> "$GITHUB_OUTPUT"

  # 单独串行创建并确认 Release，避免全部 matrix 任务同时创建/查询同一标签触发 429/503。
  ensure-release:
    needs: resolve-release
    runs-on: ubuntu-24.04
    steps:
      - name: 创建或确认 AiNas2in1 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${TAG:?缺少 TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="AiNas2in1_${TAG}"
          # 单个 job 仍可能遇到 GitHub 短暂 429/503；串行重试创建/查询，避免 matrix 一开始被阻断。
          for attempt in $(seq 1 12); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "[INFO] Release 已确认可见: $RELEASE_TAG"
              exit 0
            fi
            echo "[INFO] 创建或确认 Release: $RELEASE_TAG (${attempt}/12)"
            set +e
            create_out=$(gh release create "$RELEASE_TAG" \
              --title "2in1_${TAG}" \
              --notes "RR build artifacts for ${TAG}" \
              --latest=false 2>&1)
            create_rc=$?
            set -e
            if [ "$create_rc" -eq 0 ]; then
              echo "[INFO] Release 创建成功，等待 API 可见"
            else
              echo "$create_out"
              if ! echo "$create_out" | grep -qiE 'already exists|already_exists|Validation Failed|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate'; then
                exit "$create_rc"
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "[E] Release ${RELEASE_TAG} 创建/查询连续失败" >&2
          exit 1

  # 公共 base：下载 RR、改分区 label、资产包、addons/initrd 补丁这些与型号和
  # DSM 版本线都无关的工作只做一次，作为 Release 资产随 ainas-2in1 永久存放，
  # 各型号 job 从同一 Release 下载。不在本 job 做 patch_part1（grub.cfg 与型号
  # 相关），也不跑 docker make。
  prepare-base:
    runs-on: ubuntu-24.04
    needs: [resolve-release, ensure-release]
    env:
      RR_ASSET_URL: ${{ needs.resolve-release.outputs.asset_url }}
      RR_TAG: ${{ needs.resolve-release.outputs.tag }}
      TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载 RR 镜像
        shell: bash
        run: |
          set -euo pipefail
          : "${RR_TAG:?缺少 RR_TAG}"
          : "${RR_ASSET_URL:?缺少 RR_ASSET_URL}"
          FILENAME="rr-${RR_TAG}.zip"
          curl -fsSL --connect-timeout 10 "$RR_ASSET_URL" -o "$FILENAME"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

      - name: 构建公共 base
        shell: bash
        env:
          AINAS_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail

          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          . "$AINAS2IN1_DIR/script/2in1func.sh" "${AINAS_TOKEN}"

          sudo apt-get update
          sudo apt-get install -y gettext cpio zstd dosfstools rsync qemu-utils

          unzip "$FILENAME" -d rr rr.img

          # ── 改分区 label ──────────────────────────────────────────
          GRUB_LOOP=$(sudo losetup -f)
          sudo mkdir -p "$PART1_PATH" "$PART3_PATH"
          sudo losetup -P "$GRUB_LOOP" rr/rr.img
          sudo e2label "${GRUB_LOOP}p2" RDGZ
          sudo e2label "${GRUB_LOOP}p3" RAMDISK
          sudo fatlabel "${GRUB_LOOP}p1" AiNasloader
          sudo losetup --detach "$GRUB_LOOP"

          # ── p3：bzImage 改名 + 资产包 + addons/cpuinfo/initrd 补丁 ──
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"

          if [ -f "$PART3_PATH/bzImage-rr" ]; then
            sudo mv -f "$PART3_PATH/bzImage-rr" "$PART3_PATH/bzImage-ainas"
            echo "[INFO] 已将 bzImage-rr 重命名为 bzImage-ainas"
          else
            echo "[INFO] p3 分区中未找到 bzImage-rr，跳过重命名"
          fi

          getCKs     "${PART3_PATH}/cks"     "true"
          getLKMs    "${PART3_PATH}/lkms"    "true"
          getAddons  "${PART3_PATH}/addons"  "true"
          getModules "${PART3_PATH}/modules" "true"

          # MODEL 仅用于日志，patch_addons_disk 本身不区分型号
          patch_addons_disk "$PART3_PATH" "BASE"
          patch_cpuinfo "${PART3_PATH}/addons" "2in1_patch-cpuinfo.py" verify
          patch_ram "$PART3_PATH" 2in1 "$WORKDIR" "$TAG"

          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          sudo rm -rf "$PART3_PATH"

          # ── p1：生成 AINAS_VERSION ─────────────────────────────────
          # update 包只从 p1 取 AINAS_VERSION + EFI 两个文件（不含 grub.cfg），
          # 该文件与型号无关，在这里生成后 update job 不再需要 patch_part1。
          PL1=$(sudo losetup -f)
          sudo losetup -P "$PL1" rr/rr.img
          sudo mount "${PL1}p1" "$PART1_PATH"
          if [ -f "$PART1_PATH/RR_VERSION" ]; then
            sudo cp -f "$PART1_PATH/RR_VERSION" "$PART1_PATH/AINAS_VERSION"
            echo "[INFO] base p1 已生成 AINAS_VERSION: $(sudo cat "$PART1_PATH/AINAS_VERSION" | tr -d '\r\n ')"
          elif [ -f "$PART1_PATH/AINAS_VERSION" ]; then
            echo "[INFO] base p1 AINAS_VERSION 已存在"
          else
            echo "[E] base p1 既无 RR_VERSION 也无 AINAS_VERSION" >&2
            sudo umount "$PART1_PATH"
            sudo losetup --detach "$PL1"
            exit 1
          fi
          sudo umount "$PART1_PATH"
          sudo losetup --detach "$PL1"

          rm -rf "$AINAS2IN1_DIR"

          # 预压缩，artifact 上传时 compression-level=0 避免二次 deflate
          zstd -3 -T0 -q -f rr/rr.img -o 2in1-base.img.zst
          ls -lh 2in1-base.img.zst

      # 上传到 ainas-2in1 的 Release（与最终镜像放在一起），Release 资产默认永久保存。
      # 单文件超过 GitHub 2GB 上限时按 release_publish.sh 同样的 1900MB 规则分卷。
      - name: 上传公共 base 到 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${TAG:?缺少 TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="AiNas2in1_${TAG}"
          BASE_ASSET="2in1-base-${TAG}.img.zst"

          mv -f 2in1-base.img.zst "$BASE_ASSET"
          SIZE=$(stat -c%s "$BASE_ASSET")
          echo "[INFO] base 大小=${SIZE} 字节"
          UPLOAD_FILES=()
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "[INFO] 超过 GitHub 单文件 2GB 上限，按 1900MB 分卷"
            rm -f "${BASE_ASSET}.part."*
            split -b 1900M -d -a 3 "$BASE_ASSET" "${BASE_ASSET}.part."
            UPLOAD_FILES=("${BASE_ASSET}".part.*)
          else
            UPLOAD_FILES=("$BASE_ASSET")
          fi

          # 先删除同名旧资产，避免单文件/分卷形态切换后残留旧内容
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$BASE_ASSET"|"$BASE_ASSET".part.*) gh release delete-asset "$RELEASE_TAG" "$name" --yes ;;
            esac
          done

          gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}"
          echo "[INFO] base 已上传到 Release: ${RELEASE_TAG}"

  build:
    name: ${{ matrix.model == '__UPDATE__' && 'build (update)' || format('build ({0})', matrix.model) }}
    needs: [resolve-release, select-models, ensure-release, prepare-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
 #     max-parallel: 3
      matrix:
        model: ${{ fromJson(needs.select-models.outputs.models) }}
    env:
      LANGUAGE: zh_CN
      KERNEL: official
      ADDONS: acpid,reboottoloader,addincards,cpuinfo,expands,diskcompat,lsiutil,nvmevolume,powersched,remotefs,storagepanel,smartctl,trivial,apppatch,vmtools,resizepart
      ACTION_TOKEN: ${{ secrets.AiNas }}
      # 原 checkout rr 步骤会通过 GITHUB_ENV 注入 TAG；该步骤已移除，必须在 env 显式提供，
      # 否则 patch_ram（set -u）与发布步骤会因 TAG 未定义而失败。
      TAG: ${{ needs.resolve-release.outputs.tag }}
      LINE: ${{ inputs.dsm_version }}
    steps:
      - uses: actions/checkout@v7

      - name: 初始化环境
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载公共 base
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${TAG:?缺少 TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="AiNas2in1_${TAG}"
          mkdir -p base
          gh release download "$RELEASE_TAG" \
            --pattern "2in1-base-${TAG}.img.zst*" \
            --dir base --clobber
          if [ -f "base/2in1-base-${TAG}.img.zst" ]; then
            echo "[INFO] base 为单文件"
          else
            # 超过 2GB 时 Release 只存分卷，这里按文件名顺序合并
            compgen -G "base/2in1-base-${TAG}.img.zst.part.*" >/dev/null || {
              echo "[E] Release ${RELEASE_TAG} 中未找到 base 资产" >&2
              exit 1
            }
            cat base/2in1-base-${TAG}.img.zst.part.* > "base/2in1-base-${TAG}.img.zst"
            echo "[INFO] base 分卷已合并"
          fi

      - name: 编译镜像
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
          # token 只能从 env 传入：本 run 块超过 21000 字符，
          # 一旦块内出现 ${{ }} 就会被 GitHub 按表达式模板校验并报错
          AINAS_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail

          # ── 目录变量 ──────────────────────────────────────────────
          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          REPACK_STAGE_DIR="/tmp/repack-stage"
          PAT_XLSX_URL="https://raw.githubusercontent.com/myp015/ainas-rr/main/docs/pats.xlsx"
          PAT_XLSX="/tmp/pats.xlsx"
          DSM_INSTALL_DIR="/tmp/dsm-install"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          # 流程函数库（patch_* / docker_* / repack_* / dsm_setup / get*）
          # 传 token：get* 要访问 myp015 的私有 release
          . "$AINAS2IN1_DIR/script/2in1func.sh" "${AINAS_TOKEN}"

          # ── UPDATE 特殊处理 ────────────────────────────────────────
          # 升级包只出一份，不再按 DT / 非 DT 平台区分：update-list.yml 只取 p1/p3 的通用文件，
          # patch_ram（2in1 变体）与 patch_addons_disk 都不依赖型号，被 patch_part1 改写的
          # grub.cfg 也不在 update 包里 —— 两个任务的产物本来就逐字节等价。
          # 占位型号仅用于跑通主流程（本工作流没有 6.2 版本线，固定用 SA6400）。
          UPDATE_ONLY="false"
          if [ "${MODEL}" = "__UPDATE__" ]; then
            UPDATE_ONLY="true"
            MODEL="SA6400"
          fi

          # DSM 版本映射由上面 source 的 2in1func.sh 提供（pick_dsm_version）

          LINE_REQ="${LINE:-7.3.2}"
          export LINE_REQ
          if echo "${MODEL}" | grep -Eq '^(DS925\+|DS425\+)$' && [ "${LINE_REQ}" = "7.2.1" ]; then
            echo "[INFO] ${MODEL} 不支持 DSM 7.2.1，自动切换到 7.2.2"
            LINE_REQ="7.2.2"
          fi

          VERSION="$(pick_dsm_version "${LINE_REQ}")"
          LINE_SHORT="${LINE_REQ%.*}"
          export LINE_SHORT

          VER_MAIN="${VERSION%%-*}"
          VER_MAIN_NODOT="${VER_MAIN//./}"
          VER_BUILD="${VERSION#*-}"
          VER_BUILD="${VER_BUILD%%-*}"
          VER_SLUG="${VER_MAIN_NODOT}_${VER_BUILD}"
          SAFE_TAG="${TAG//./_}"
          echo "SAFE_TAG=${SAFE_TAG}" >> "$GITHUB_ENV"

          # 制品名的容量后缀跟随基础镜像的实际大小（GiB，四舍五入），镜像扩容后自动同步，
          # 不再出现「18G 的镜像却叫 15g」。本工作流只有 7.x 版本线，固定用 grub.img.gz。
          GRUB_IMAGE="grub.img.gz"
          IMG_GIB=$(( ( $(gzip -l "${AINAS2IN1_DIR}/img/${GRUB_IMAGE}" | awk 'NR==2{print $2}') + 536870912 ) / 1073741824 ))

          ARTIFACT="${MODEL}_${VER_SLUG}_${IMG_GIB}g_Ainas2in1_${SAFE_TAG}"
          echo "[INFO] 型号=${MODEL} 目标DSM版本=${VERSION} DSM系列=${LINE_REQ} 制品版本=${VER_SLUG}"

          # ── 系统依赖 ───────────────────────────────────────────────
          # pigz 用于镜像压缩：gzip -1 单线程约 144s，pigz 可降到数十秒
          sudo apt-get update
          sudo apt-get install -y gettext cpio zstd dosfstools rsync qemu-utils pigz

          # ── 恢复公共 base ──────────────────────────────────────────
          # 下载 RR、分区 label、资产包、addons/initrd 补丁等与型号无关的步骤
          # 已在 prepare-base 完成；这里只解压并挂上分区，供型号相关步骤使用。
          [ -f "base/2in1-base-${TAG}.img.zst" ] || { echo "[E] 未找到公共 base: base/2in1-base-${TAG}.img.zst" >&2; exit 1; }
          mkdir -p rr
          zstd -d -q -f "base/2in1-base-${TAG}.img.zst" -o rr/rr.img
          rm -rf base

          # rr.img 必须保持 attached：容器内 .bashrc 按分区 label 挂载 p1/p2/p3
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          sudo mkdir -p "$PART1_PATH" "$PART3_PATH"

          # ── docker_build 的 initrd 依赖 ────────────────────────────
          # docker_build 会读取 /tmp/initrd_work/opt/ainas 与 root/.bashrc。
          # base 里已由 patch_ram 生成 initrd-ainas，这里重新解包即可（约 10-20s），
          # 比把整棵补丁树塞进 artifact 更小，内容等价（initrd-ainas 就是该树的 direct 打包）。
          if [ "${UPDATE_ONLY}" != "true" ]; then
            sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
            sudo rm -rf /tmp/initrd_work
            unpackInitrd "${PART3_PATH}/initrd-ainas" /tmp/initrd_work
            sudo umount "$PART3_PATH"
          fi

          # ── GRUB 修补（只有 grub.cfg 与型号相关，必须在型号 job 内做）──
          if [ "${UPDATE_ONLY}" != "true" ]; then
            patch_part1 rr/rr.img "$PART1_PATH" 2in1 "$MODEL" "$LINE_SHORT"
          fi


          # ── 使用 RR Docker 编译镜像（非 UPDATE 模式）─────────────
          if [ "${UPDATE_ONLY}" != "true" ]; then
            docker_build 2in1 "$MODEL" "$VERSION" "$LANGUAGE" "$ADDONS" "$TAG" \
              "$WORKDIR" "$REPACK_STAGE_DIR"
          fi

          # ── 清理 p3 临时文件 ──────────────────────────────────────
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
          sudo rm -rf "$PART3_PATH/dl" "$PART3_PATH/auxfiles" "$PART3_PATH/logs"
          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"

          # ── UPDATE 包构建 ─────────────────────────────────────────
          UPDATE_ZIP=""
          ZIP_NAME=""

          if [ "${UPDATE_ONLY}" = "true" ]; then
            bash "$AINAS2IN1_DIR/script/2in1_build_update.sh" rr/rr.img "$GITHUB_WORKSPACE" ""
            # find 无匹配时返回 0 且输出为空（`ls | head` 在 pipefail 下会因 ls 的退出码中断）
            RAW_UPDATE_ZIP="$(find . -maxdepth 1 -name 'updateall-*.zip' -print -quit)"
            if [ -n "$RAW_UPDATE_ZIP" ] && [ -f "$RAW_UPDATE_ZIP" ]; then
              # 保持 updateall-*.zip 原名上传，不再重命名
              UPDATE_ZIP="$(basename "$RAW_UPDATE_ZIP")"
            fi
          else
            # ── 2in1 镜像重打包 ───────────────────────────────────
            repack_2in1 "$WORKDIR" "$REPACK_STAGE_DIR"

            # ── DSM 自动安装（解析 pats.xlsx → 启容器 → 安装 → 停容器）──
            dsm_setup "$MODEL" "$LINE_REQ" "$PAT_XLSX_URL" "$DSM_INSTALL_DIR" \
              "$WORKDIR" \
              "$AINAS2IN1_DIR/docker/docker-compose.yaml" "$DSM_INSTALL_DIR/docker-compose.yaml" \
              "_${IMG_GIB}g_Ainas2in1" "$SAFE_TAG" "180" \
              "s#\./rr.img:/rr.img#${WORKDIR}/rr/rr.img:/rr.img#g"

            cd "$WORKDIR"
            echo "[INFO] 开始重命名并导出镜像（img.gz）"
            mv -f rr/rr.img "${ARTIFACT}.img"
            echo "[INFO] 开始 gzip 压缩: ${ARTIFACT}.img -> ${ARTIFACT}.img.gz"
            pigz -1 -p "$(nproc)" -c "${ARTIFACT}.img" > "${ARTIFACT}.img.gz"
            echo "[INFO] gzip 压缩完成: ${ARTIFACT}.img.gz"
            ZIP_NAME="${ARTIFACT}.img.gz"
          fi

          rm -f "$WORKDIR/2in1func.sh"
          rm -rf "$AINAS2IN1_DIR" "${REPACK_STAGE_DIR:-}"

          echo "ARTIFACT=${ARTIFACT}"   >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "UPDATE_ZIP=$UPDATE_ZIP" >> "$GITHUB_ENV"

      - name: 发布制品到 ainas-2in1 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${TAG:?缺少 TAG}"
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"

          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="AiNas2in1_${TAG}"
          export RELEASE_TITLE="2in1_${TAG}"

          # 分卷、Release 自愈、退避重试统一在 .github/scripts/release_publish.sh 里
          ASSET_ARGS=()
          [ -n "${ARTIFACT_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$ARTIFACT_ZIP")
          [ -n "${UPDATE_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$UPDATE_ZIP")

          bash "$GITHUB_WORKSPACE/.github/scripts/release_publish.sh" \
            "$RELEASE_TAG" "RR build artifacts for ${TAG}" "${ASSET_ARGS[@]}"
