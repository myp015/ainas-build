name: Build RR-2in1
on:
  workflow_dispatch:
    inputs:
      all_models:
        description: "编译模式"
        type: choice
        options:
          - 自选
          - 全选
        default: 全选
      model_ds918p:
        description: "DS918+"
        type: boolean
        default: false
      model_ds920p:
        description: "DS920+"
        type: boolean
        default: false
      model_ds923p:
        description: "DS923+"
        type: boolean
        default: false
      model_ds925p:
        description: "DS925+"
        type: boolean
        default: false
      model_ds3622xsp:
        description: "DS3622xs+"
        type: boolean
        default: false
      model_sa6400:
        description: "SA6400"
        type: boolean
        default: false
      model_ds425p:
        description: "DS425+"
        type: boolean
        default: false
      model_dva3221:
        description: "DVA3221"
        type: boolean
        default: false
      model_dva1622:
        description: "DVA1622"
        type: boolean
        default: false
      custom_models:
        description: "自定义型号(工作流未列出的,多个用逗号分隔,如 DS1621+,RS4021xs+)"
        type: string
        default: ""      
        
      build_update_zip:
        description: "编译升级包（updateall-*.zip）默认开启"
        type: boolean
        default: true
      rr_version:
        description: "RR version (可选，留空=latest；示例：26.4.0 或 v26.4.0)"
        type: string
        default: ""
      dsm_version:
        description: "DSM 版本编号（从 pats.xlsx 获取，选择 >= 7.2.1 的所有版本）"
        type: choice
        options:
          - "7.2.1"
          - "7.2.2"
          - "7.3.0"
          - "7.3.1"
          - "7.3.2"
          - "7.4.1"
        default: "7.4.1"

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      asset_url: ${{ steps.pick.outputs.asset_url }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          REQ_RAW="${{ inputs.rr_version }}"
          REQ_TAG="$(printf '%s' "$REQ_RAW" | tr -d '[:space:]')"
          REQ_TAG="${REQ_TAG#rr-}"
          REQ_TAG="${REQ_TAG%.img.zip}"
          REQ_TAG="${REQ_TAG#v}"

          fetch_latest() {
            curl -fsSL --connect-timeout 10 "https://api.github.com/repos/RROrg/rr/releases/latest"
          }
          fetch_tag() {
            local t="$1"
            curl -fsSL --connect-timeout 10 "https://api.github.com/repos/RROrg/rr/releases/tags/${t}"
          }

          if [ -z "$REQ_TAG" ] || [ "$REQ_TAG" = "latest" ]; then
            JSON="$(fetch_latest)"
          else
            if ! JSON="$(fetch_tag "$REQ_TAG" 2>/dev/null)"; then
              echo "[INFO] 指定版本 rr_version=${REQ_RAW} 未找到，回退到最新版本"
              JSON="$(fetch_latest)"
            fi
          fi

          RR_TAG="$(printf '%s' "$JSON" | jq -r '.tag_name' | sed 's/^v//')"
          ASSET_URL="$(printf '%s' "$JSON" | jq -r '.assets[]? | select(.name | test("^rr-.*[.]img[.]zip$")) | .browser_download_url' | head -n1)"
          if [ -z "$RR_TAG" ] || [ "$RR_TAG" = "null" ] || [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "[E] 下载失败 (rr_version=${REQ_RAW:-latest})"
            exit 1
          fi

          echo "tag=$RR_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

  select-models:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.pick.outputs.models }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          MODELS=()

          if [ "${{ inputs.all_models }}" = "全选" ]; then
            echo "[INFO] 已开启全选，将编译所有支持的型号"
            MODELS+=("DS918+" "DS920+" "DS923+" "DS925+" "DS3622xs+" "SA6400" "DS425+" "DVA3221" "DVA1622")
          else
            [ "${{ inputs.model_ds918p }}"   = "true" ] && MODELS+=("DS918+")
            [ "${{ inputs.model_ds920p }}"   = "true" ] && MODELS+=("DS920+")
            [ "${{ inputs.model_ds923p }}"   = "true" ] && MODELS+=("DS923+")
            [ "${{ inputs.model_ds925p }}"   = "true" ] && MODELS+=("DS925+")
            [ "${{ inputs.model_ds3622xsp }}" = "true" ] && MODELS+=("DS3622xs+")
            [ "${{ inputs.model_sa6400 }}"   = "true" ] && MODELS+=("SA6400")
            [ "${{ inputs.model_ds425p }}"   = "true" ] && MODELS+=("DS425+")
            [ "${{ inputs.model_dva3221 }}"  = "true" ] && MODELS+=("DVA3221")
            [ "${{ inputs.model_dva1622 }}"  = "true" ] && MODELS+=("DVA1622")
          fi

          # 追加自定义型号（工作流未列出的型号）
          CUSTOM_RAW="${{ inputs.custom_models }}"
          if [ -n "$(printf '%s' "$CUSTOM_RAW" | tr -d '[:space:]')" ]; then
            echo "[INFO] 检测到自定义型号输入: ${CUSTOM_RAW}"
            IFS=',' read -ra CUSTOM_ARR <<< "$CUSTOM_RAW"
            for cm in "${CUSTOM_ARR[@]}"; do
              cm="$(echo "$cm" | xargs)"
              [ -n "$cm" ] && MODELS+=("$cm")
            done
          fi
          
          # 去重
          UNIQ_MODELS=()
          for m in "${MODELS[@]}"; do
            skip=0
            for u in "${UNIQ_MODELS[@]}"; do
              [ "$u" = "$m" ] && { skip=1; break; }
            done
            [ $skip -eq 0 ] && UNIQ_MODELS+=("$m")
          done
          MODELS=("${UNIQ_MODELS[@]}")

          if [ "${{ inputs.build_update_zip }}" = "true" ]; then
            MODELS+=("__UPDATE_DT__")
            MODELS+=("__UPDATE_NODT__")
          fi

          if [ ${#MODELS[@]} -eq 0 ]; then
            echo "[E] 请至少勾选一个型号，或勾选 update 包编译"
            exit 1
          fi

          JSON_OUT="["
          for m in "${MODELS[@]}"; do
            JSON_OUT+="\"$m\","
          done
          JSON_OUT="${JSON_OUT%,}]"
          echo "models=$JSON_OUT" >> "$GITHUB_OUTPUT"

  # 单独串行创建并确认 Release，避免全部 matrix 任务同时创建/查询同一标签触发 429/503。
  ensure-release:
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - name: 创建或确认 AiNas2in1 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${TAG:?缺少 TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="AiNas2in1_${TAG}"
          # 单个 job 仍可能遇到 GitHub 短暂 429/503；串行重试创建/查询，避免 matrix 一开始被阻断。
          for attempt in $(seq 1 12); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "[INFO] Release 已确认可见: $RELEASE_TAG"
              exit 0
            fi
            echo "[INFO] 创建或确认 Release: $RELEASE_TAG (${attempt}/12)"
            set +e
            create_out=$(gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "RR build artifacts for ${TAG}" \
              --latest=false 2>&1)
            create_rc=$?
            set -e
            if [ "$create_rc" -eq 0 ]; then
              echo "[INFO] Release 创建成功，等待 API 可见"
            else
              echo "$create_out"
              if ! echo "$create_out" | grep -qiE 'already exists|already_exists|Validation Failed|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate'; then
                exit "$create_rc"
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "[E] Release ${RELEASE_TAG} 创建/查询连续失败" >&2
          exit 1

  build:
    name: ${{ matrix.model == '__UPDATE_DT__' && 'build (update-dt)' || (matrix.model == '__UPDATE_NODT__' && 'build (update-nodt)' || format('build ({0})', matrix.model)) }}
    needs: [resolve-release, select-models, ensure-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
 #     max-parallel: 3
      matrix:
        model: ${{ fromJson(needs.select-models.outputs.models) }}
    env:
      FORMAT: vmdk
      LANGUAGE: zh_CN
      KERNEL: official
      ADDONS: acpid,reboottoloader,addincards,cpuinfo,expands,diskcompat,lsiutil,nvmevolume,powersched,remotefs,storagepanel,smartctl,trivial,apppatch,vmtools,resizepart
      ACTION_TOKEN: ${{ secrets.AiNas }}
      RR_ASSET_URL: ${{ needs.resolve-release.outputs.asset_url }}
      RR_TAG: ${{ needs.resolve-release.outputs.tag }}
      BUILD_UPDATE_ZIP: ${{ inputs.build_update_zip }}
      DSM_LINE: ${{ inputs.dsm_version }}
    steps:
      - uses: actions/checkout@main

      - name: 初始化环境
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: checkout ainas-2in1
        uses: actions/checkout@v4
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: checkout rr
        shell: bash
        run: |
          set -euo pipefail
          : "${RR_TAG:?缺少 RR_TAG}"
          : "${RR_ASSET_URL:?缺少 RR_ASSET_URL}"
          FILENAME="rr-${RR_TAG}.zip"
          curl -fsSL --connect-timeout 10 "$RR_ASSET_URL" -o "$FILENAME"
          echo "TAG=$RR_TAG"       >> "$GITHUB_ENV"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: 编译镜像
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
          # token 只能从 env 传入：本 run 块超过 21000 字符，
          # 一旦块内出现 ${{ }} 就会被 GitHub 按表达式模板校验并报错
          AINAS_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail

          # ── 目录变量 ──────────────────────────────────────────────
          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          STAGE_HELPER="/tmp/2in1-helper"
          PAT_XLSX_URL="https://raw.githubusercontent.com/RROrg/rr/main/docs/pats.xlsx"
          PAT_XLSX="/tmp/pats.xlsx"
          DSM_INSTALL_DIR="/tmp/dsm-install"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          # 流程函数库（patch_* / docker_* / repack_* / dsm_setup）
          . "$AINAS2IN1_DIR/script/2in1func.sh"

          # ── UPDATE 特殊处理 ────────────────────────────────────────
          UPDATE_ONLY="false"
          UPDATE_FLAVOR=""
          if [ "${MODEL}" = "__UPDATE_DT__" ]; then
            UPDATE_ONLY="true"
            UPDATE_FLAVOR="dt"
            MODEL="SA6400"
          elif [ "${MODEL}" = "__UPDATE_NODT__" ]; then
            UPDATE_ONLY="true"
            UPDATE_FLAVOR="nodt"
            MODEL="DS918+"
          fi

          # ── 版本映射 ───────────────────────────────────────────────
          pick_dsm_version() {
            local line="$1"
            case "$line" in
              7.2.1) printf '7.2.1-69057-1'   ;;
              7.2.2) printf '7.2.2-72806-0'   ;;
              7.3.0) printf '7.3.0-81180-0'   ;;
              7.3.1) printf '7.3.1-86003-0'   ;;
              7.3.2) printf '7.3.2-86009-0'   ;;
              7.4.1)
                python3 -m pip -q install --user openpyxl
                DSM_VERSION_74=$(MODEL="${MODEL}" python3 -c "import os,re,urllib.request,openpyxl;url='https://raw.githubusercontent.com/RROrg/rr/main/docs/pats.xlsx';path='/tmp/pats.xlsx';urllib.request.urlretrieve(url,path);wb=openpyxl.load_workbook(path,data_only=True);ws=wb[wb.sheetnames[0]];model=os.environ['MODEL'];line_req='7.4.1';rows=[(('' if r[0] is None else str(r[0]).strip()),('' if len(r)<2 or r[1] is None else str(r[1]).strip()),('' if len(r)<3 or r[2] is None else str(r[2]).strip())) for r in ws.iter_rows(min_row=1,values_only=True)];rows=[t for t in rows if t[0] and t[1] and t[2] and not (t[0].lower()=='model' and t[1].lower().startswith('version'))];cand=[(v,u) for m,v,u in rows if m==model and v.startswith(line_req+'-')];allm=[(v,u) for m,v,u in rows if m==model];sel=cand if cand else allm;sel or (_ for _ in ()).throw(SystemExit(f'no pat found for model={model}'));best=sorted(sel,key=lambda x:[int(t) for t in re.findall(r'\d+',x[0])],reverse=True)[0];print(best[0])")
                printf '%s' "$DSM_VERSION_74"
                ;;
              *)
                printf '[E] 不支持的 DSM 版本: %s' "$line"
                return 1
                ;;
            esac
          }

          DSM_LINE_REQ="${DSM_LINE:-7.3.2}"
          export DSM_LINE_REQ
          if echo "${MODEL}" | grep -Eq '^(DS925\+|DS425\+)$' && [ "${DSM_LINE_REQ}" = "7.2.1" ]; then
            echo "[INFO] ${MODEL} 不支持 DSM 7.2.1，自动切换到 7.2.2"
            DSM_LINE_REQ="7.2.2"
          fi

          DSM_VERSION="$(pick_dsm_version "${DSM_LINE_REQ}")"
          DSM_LINE_SHORT="${DSM_LINE_REQ%.*}"
          export DSM_LINE_SHORT

          VER_MAIN="${DSM_VERSION%%-*}"
          VER_MAIN_NODOT="${VER_MAIN//./}"
          VER_BUILD="${DSM_VERSION#*-}"
          VER_BUILD="${VER_BUILD%%-*}"
          ARTIFACT_VERSION="${VER_MAIN_NODOT}_${VER_BUILD}"
          SAFE_TAG="${TAG//./_}"
          echo "SAFE_TAG=${SAFE_TAG}" >> "$GITHUB_ENV"

          ARTIFACT="${MODEL}_${ARTIFACT_VERSION}_15g_Ainas2in1_${SAFE_TAG}"
          echo "[INFO] 型号=${MODEL} 目标DSM版本=${DSM_VERSION} DSM系列=${DSM_LINE_REQ} 制品版本=${ARTIFACT_VERSION}"

          # ── 系统依赖 ───────────────────────────────────────────────
          sudo apt-get update
          sudo apt-get install -y gettext cpio zstd dosfstools rsync qemu-utils
          unzip "$FILENAME" -d rr rr.img
          cp -f rr/rr.img rr/rr.base.img

          # ── 改分区 label（改的是分区表属性，与 p1 内容修补无关）───
          GRUB_LOOP=$(sudo losetup -f)
          sudo mkdir -p /mnt/p1 /mnt/p2 /mnt/p3
          sudo losetup -P "$GRUB_LOOP" rr/rr.img
          sudo e2label "${GRUB_LOOP}p2" RDGZ
          sudo e2label "${GRUB_LOOP}p3" RAMDISK
          sudo fatlabel "${GRUB_LOOP}p1" AiNasloader
          sudo losetup --detach "$GRUB_LOOP" || true

          # ── GRUB 修补 ──────────────────────────────────────────────
          patch_2in1_p1 rr/rr.img "$PART1_PATH" "$AINAS2IN1_DIR" "$MODEL" "$DSM_LINE_SHORT"

          # ── 早删 rr.base.img 备份，释放约 15G ──
          rm -f rr/rr.base.img || true
          echo "[INFO] 已删除 rr.base.img 备份"
          df -h


          # ── 挂载 p3 分区 ───────────────────────────────────────────
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          sudo rm -rf "$PART3_PATH"
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"

          # ── bzImage 重命名 ─────────────────────────────────────────
          if [ -f "$PART3_PATH/bzImage-rr" ]; then
            sudo mv -f "$PART3_PATH/bzImage-rr" "$PART3_PATH/bzImage-ainas"
            echo "[INFO] 已将 bzImage-rr 重命名为 bzImage-ainas"
          else
            echo "[INFO] p3 分区中未找到 bzImage-rr，跳过重命名"
          fi

          # ── 取 CKs / LKMs / addons / modules ───────────────────────
          # 函数库与仓库地址适配都在 ainas-2in1 的 script/2in1func.sh 里，这里不再 sed 替换。
          # 这些函数会 rm -rf 目标目录，而 p3 内文件属 root，必须以 root 执行；
          # 顺带让新落盘的文件保持 root 属主，与镜像其余部分一致。
          sudo env AINAS_TOKEN="${AINAS_TOKEN}" AINAS2IN1_DIR="${AINAS2IN1_DIR}" PART3_PATH="${PART3_PATH}" bash -c '
            . "${AINAS2IN1_DIR}/script/2in1func.sh" "${AINAS_TOKEN}"
            getCKs     "${PART3_PATH}/cks"     "true"
            getLKMs    "${PART3_PATH}/lkms"    "true"
            getAddons  "${PART3_PATH}/addons"  "true"
            getModules "${PART3_PATH}/modules" "true"
          '

          # ── Addons 处理 + cpuinfo 修补 ─────────────────────────────
          patch_2in1_addons "$PART3_PATH" "$MODEL" "$AINAS2IN1_DIR"

          # ── initrd 修补与重打包 ────────────────────────────────────
          patch_2in1_ram "$PART3_PATH" "$TAG" "$AINAS2IN1_DIR" "$WORKDIR"

          sudo umount "$PART3_PATH" || true
          sudo rm -rf "$PART3_PATH"


          # ── 使用 RR Docker 编译镜像（非 UPDATE 模式）─────────────
          if [ "${UPDATE_ONLY}" != "true" ]; then
            docker_2in1_build "$MODEL" "$DSM_VERSION" "$LANGUAGE" "$ADDONS" "$TAG" \
              "$AINAS2IN1_DIR" "$STAGE_HELPER" "$WORKDIR"
          fi

          # ── 清理 p3 临时文件 ──────────────────────────────────────
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH" || true
          sudo rm -rf "$PART3_PATH/dl" "$PART3_PATH/auxfiles" "$PART3_PATH/logs" || true
          sudo umount "$PART3_PATH" || true
          sudo losetup --detach "$DISK_LOOP"

          # ── UPDATE 包构建 ─────────────────────────────────────────
          UPDATE_ZIP=""
          ZIP_NAME=""

          if [ "${UPDATE_ONLY}" = "true" ]; then
            bash "$AINAS2IN1_DIR/script/2in1_build_update.sh" rr/rr.img "$GITHUB_WORKSPACE" "$UPDATE_FLAVOR"
            RAW_UPDATE_ZIP="$(ls -1 updateall-*.zip 2>/dev/null | head -n1 || true)"
            if [ -n "$RAW_UPDATE_ZIP" ] && [ -f "$RAW_UPDATE_ZIP" ]; then
              # 保持 updateall-*.zip 原名上传，不再重命名
              UPDATE_ZIP="$(basename "$RAW_UPDATE_ZIP")"
            fi
          else
            # ── 2in1 镜像重打包 ───────────────────────────────────
            repack_2in1 "$WORKDIR" "$STAGE_HELPER"

            # ── DSM 自动安装（解析 pats.xlsx → 启容器 → 安装 → 停容器）──
            dsm_setup "$MODEL" "$DSM_LINE_REQ" "$PAT_XLSX_URL" "$DSM_INSTALL_DIR" \
              "$AINAS2IN1_DIR" "$WORKDIR" \
              "$AINAS2IN1_DIR/docker/docker-compose.yaml" "$DSM_INSTALL_DIR/docker-compose.yaml" \
              "_15g_Ainas2in1" "$SAFE_TAG" "180" \
              "s#\./rr.img:/rr.img#${WORKDIR}/rr/rr.img:/rr.img#g"

            cd "$WORKDIR"
            echo "[INFO] 开始重命名并导出镜像（img.gz）"
            mv -f rr/rr.img "${ARTIFACT}.img"
            echo "[INFO] 开始 gzip 压缩: ${ARTIFACT}.img -> ${ARTIFACT}.img.gz"
            gzip -1 -c "${ARTIFACT}.img" > "${ARTIFACT}.img.gz"
            echo "[INFO] gzip 压缩完成: ${ARTIFACT}.img.gz"
            ZIP_NAME="${ARTIFACT}.img.gz"
          fi

          rm -f "$WORKDIR/2in1func.sh"
          rm -rf "$AINAS2IN1_DIR" "${STAGE_HELPER:-}"

          echo "ARTIFACT=${ARTIFACT}"   >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "UPDATE_ZIP=$UPDATE_ZIP" >> "$GITHUB_ENV"

      - name: 发布制品到 ainas-2in1 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${TAG:?缺少 TAG}"
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"

          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="AiNas2in1_${TAG}"

          ASSETS=()
          if [ -n "${ARTIFACT_ZIP:-}" ] && [ -f "$GITHUB_WORKSPACE/$ARTIFACT_ZIP" ]; then
            ART_PATH="$GITHUB_WORKSPACE/$ARTIFACT_ZIP"
            ART_SIZE=$(stat -c%s "$ART_PATH")
            MAX_ASSET=2147483648
            if [ "$ART_SIZE" -ge "$MAX_ASSET" ]; then
              echo "[INFO] 制品过大 (${ART_SIZE} bytes)，拆分为 <=1.9GB 分片"
              rm -f "${ART_PATH}.part."* || true
              split -b 1900m -d -a 3 "$ART_PATH" "${ART_PATH}.part."
              ls -lh "${ART_PATH}.part."*
              for PART in "${ART_PATH}.part."*; do
                ASSETS+=("$PART")
              done
            else
              ASSETS+=("$ART_PATH")
            fi
          fi
          if [ -n "${UPDATE_ZIP:-}" ] && [ -f "$GITHUB_WORKSPACE/$UPDATE_ZIP" ]; then
            ASSETS+=("$GITHUB_WORKSPACE/$UPDATE_ZIP")
          fi
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "[E] 没有可上传的 Release 资产"
            exit 1
          fi

          # Release 已由 ensure-release 串行 job 创建确认；matrix 任务只上传自身资产。
          # 确认 Release 存在（不存在则重建），避免 build 后“release not found”。
          ensure_release() {
            local create_out create_rc
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              return 0
            fi
            echo "[INFO] Release ${RELEASE_TAG} 不存在，重建..."
            set +e
            create_out=$(gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "RR build artifacts for ${TAG}" \
              --latest=false 2>&1)
            create_rc=$?
            set -e
            if [ "$create_rc" -ne 0 ]; then
              echo "$create_out"
              echo "$create_out" | grep -qiE 'already exists|already_exists|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate' || return "$create_rc"
            fi
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 && return 0
            return 1
          }

          upload_assets() {
            local ATTEMPT
            for ATTEMPT in 1 2 3 4 5; do
              ensure_release
              echo "[INFO] 上传资产 attempt ${ATTEMPT}: ${ASSETS[*]}"
              set +e
              UPLOAD_OUT=$(gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber 2>&1)
              UPLOAD_RC=$?
              set -e
              if [ "$UPLOAD_RC" -eq 0 ]; then
                return 0
              fi
              echo "$UPLOAD_OUT"
              if echo "$UPLOAD_OUT" | grep -qiE 'HTTP 404|HTTP 422|already exists|409|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate'; then
                echo "[INFO] 上传暂时失败，${ATTEMPT}0s 后重试"
                sleep "${ATTEMPT}0"
                continue
              fi
              return "$UPLOAD_RC"
            done
            return 1
          }

          upload_assets
