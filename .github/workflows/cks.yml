name: Build cks

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    strategy:
      # 12 平台全矩阵（Task#40 验证完成后还原 + Task#183 全平台补 7.2）：
      # epyc7002-7.2/7.3/7.4 + geminilakenk-7.2/7.3/7.4 + r1000nk-7.2/7.3/7.4 + v1000nk-7.2/7.3/7.4
      fail-fast: false
      matrix:
        include:
          - version: 7.2
            platform: epyc7002
          - version: 7.3
            platform: epyc7002
          - version: 7.4
            platform: epyc7002
          - version: 7.2
            platform: geminilakenk
          - version: 7.3
            platform: geminilakenk
          - version: 7.4
            platform: geminilakenk
          - version: 7.2
            platform: r1000nk
          - version: 7.3
            platform: r1000nk
          - version: 7.4
            platform: r1000nk
          - version: 7.2
            platform: v1000nk
          - version: 7.3
            platform: v1000nk
          - version: 7.4
            platform: v1000nk

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-cks
          token: ${{ secrets.AiNas }}
          path: ainas-cks

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/syno-modules
          token: ${{ secrets.AiNas }}
          path: syno-modules

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo apt update
          sudo apt install -y curl build-essential bison flex dwarves ruby libncurses-dev libssl-dev libelf-dev

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          git clone -b ${PLATFORM}-${VERSION}-5.10.55 --depth=1 https://github.com/myp015/dsm_linux.git
          git clone --depth=1 https://github.com/myp015/intel-gpu-i915-backports.git

          . ${ROOT_PATH}/ainas-modules/compile-ck.sh

          echo "makeEnvDeploy"
          makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}"

          echo "makekernel"
          makekernel "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux" "${ROOT_PATH}/output"

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}-ck/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}-ck/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux" "${ROOT_PATH}/ainas-modules/src/${KVER}-ck" "${ROOT_PATH}/modules"

          # if ! echo "geminilakenk" | grep -wq "${PLATFORM}"; then
            echo "makei915"
            makei915 "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux" "${ROOT_PATH}/intel-gpu-i915-backports" "${ROOT_PATH}/modules/update"
          # fi

          # 对齐 RR 官方 cks.yml 流程（RR 无 relocateDupUpdate）：根目录布局由 defines
          # 天然决定（update/-only 模块 =n，makemodules 不产根目录副本），makei915
          # 无条件输出 update/ 栈，下方 cp -rf 保留根目录 + update/ 双套，与 RR 官方一致。
          mkdir -p "${ROOT_PATH}/output/modules"
          cp -rf "${ROOT_PATH}/modules/"* "${ROOT_PATH}/output/modules/"


      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile-ck.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux")"

          # OFFICIAL_PATH 留空（对齐 RR）：check depends 纯缺口检测，产物 depends 缺口一律报 [E]，绝不从官方 hda1 拷贝
          # OFFICIAL_PATH="${ROOT_PATH}/syno-modules/official/hda1/${PLATFORM}-${VERSION}-${KVER}"
          OFFICIAL_PATH=""
          PARTY3RD_PATH="${ROOT_PATH}/ainas-cks/thirdparty/${PLATFORM}-${VERSION}-${KVER}"

          echo "copy 3rd modules"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/output/modules/

          echo "check depends"
          for M in $(ls ${ROOT_PATH}/output/modules 2>/dev/null); do
            [ -d "${ROOT_PATH}/output/modules/${M}" ] && continue # 跳过子目录（update/），避免把目录当模块名误报 [E] depends does not exist
            function _copydepends() {
              if [ ! -f "${ROOT_PATH}/output/modules/${1}" ] && [ ! -f "${ROOT_PATH}/output/modules/update/${1}" ] && [ ! -f "${OFFICIAL_PATH/hda1/rd}/${1}" ]; then
                if [ -f "${OFFICIAL_PATH}/${1}" ]; then
                  echo "[W] '${PLATFORM}-${KVER}' - '${M}' depends '${1}' copied from official hda1"
                  cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output/modules"
                else
                  echo "[E] '${PLATFORM}-${KVER}' - '${M}' depends '${1}' does not exist."
                fi
              fi
              D=""
              [ -z "${D}" ] && [ -f "${ROOT_PATH}/output/modules/${1}" ] && D="${ROOT_PATH}/output/modules/${1}"
              [ -z "${D}" ] && [ -f "${ROOT_PATH}/output/modules/update/${1}" ] && D="${ROOT_PATH}/output/modules/update/${1}"
              [ -z "${D}" ] && [ -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && D="${OFFICIAL_PATH/hda1/rd}/${1}"
              if [ -n "${D}" ]; then
                # modinfo "${D}" || true
                depends=($(modinfo -F depends "${D}" 2>/dev/null | sed 's/,/ /g')) || true
                if [ ${#depends[*]} -gt 0 ]; then
                  for k in ${depends[@]}; do
                    { [ -f "${ROOT_PATH}/output/modules/${k}.ko" ] || [ -f "${ROOT_PATH}/output/modules/update/${k}.ko" ]; } && continue # Recursively skip wext-priv and wext-core dependencies on each other.
                    _copydepends "${k}.ko"
                  done
                fi
              fi
            }
            _copydepends "${M}"
          done

          # 生成 modules.dep 供 DSM/BusyBox modprobe 解析硬依赖；当前 CKS 自编
          # i40e 使用 intel_auxiliary 总线，必须先加载 intel_auxiliary.ko 再加载 i40e.ko。
          # 依赖关系从最终 .ko 的 modinfo 读取，不混用官方 auxiliary ABI。
          MODULES_DIR="${ROOT_PATH}/output/modules"
          DEPFILE="${MODULES_DIR}/modules.dep"
          rm -f "${DEPFILE}"
          for M in "${MODULES_DIR}"/*.ko; do
            [ -f "${M}" ] || continue
            DEPS=""
            for D in $(modinfo -F depends "${M}" 2>/dev/null | sed 's/,/ /g'); do
              DEPS="${DEPS} ${D}.ko"
            done
            printf '%s:%s\n' "$(basename "${M}")" "${DEPS}" >>"${DEPFILE}"
          done
          if [ -f "${MODULES_DIR}/i40e.ko" ]; then
            I40E_DEPS="$(modinfo -F depends "${MODULES_DIR}/i40e.ko" 2>/dev/null | sed 's/,/ /g')"
            echo " ${I40E_DEPS} " | grep -q " intel_auxiliary " || {
              echo "[E] i40e.ko does not depend on intel_auxiliary" >&2
              exit 1
            }
            [ -f "${MODULES_DIR}/intel_auxiliary.ko" ] || {
              echo "[E] i40e.ko depends on missing intel_auxiliary.ko" >&2
              exit 1
            }
            grep -q '^i40e\.ko:.*intel_auxiliary\.ko' "${DEPFILE}" || {
              echo "[E] modules.dep missing i40e -> intel_auxiliary" >&2
              exit 1
            }
          fi

          tar -zcf ${ROOT_PATH}/modules-${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output/modules .
          gzip -c ${ROOT_PATH}/output/bzImage >${ROOT_PATH}/bzImage-${PLATFORM}-${VERSION}-${KVER}.gz

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ainas-cks-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
            *.gz

  firmware:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-cks
          token: ${{ secrets.AiNas }}
          path: ainas-cks

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: download to artifacts
        # v8 批量下载大 artifact 偶发 digest-mismatch（Build cks #79 release job 实测）→
        # 降 v4（无 digest 校验，成熟稳定），与 modules.yml 主流程一致
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: ainas-cks-*
          merge-multiple: true

      - name: firmware
        run: |
          ROOT_PATH=${{ github.workspace }}

          mkdir -p ${ROOT_PATH}/firmware

          echo "copy 3rd modules"
          PARTY3RD_PATH="${ROOT_PATH}/ainas-cks/thirdparty/firmware"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/firmware/

          echo "extract all modules"
          for F in output/*.tgz; do
            echo "${F}"
            mkdir -p "${F%.tgz}"
            tar -zxf "${F}" -C "${F%.tgz}" || echo "Failed to extract ${F}"
          done

          echo "get firmware"
          SOURCE=/tmp/linux-firmware
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git ${SOURCE}
          cp -rf ${SOURCE}/intel/iwlwifi/* ${SOURCE}/ 2>/dev/null || true # Move intel firmware to top dir for easy search
          while read L; do
            [ -z "${L}" ] && continue
            if [ -e "${SOURCE}/${L}" ]; then
              mkdir -p "$(dirname firmware/${L})"
              cp -f "${SOURCE}/${L}" "firmware/${L}"
            else
              [ -e "firmware/${L}" ] && echo "Used thirdparty ${L}" || echo "::warning ::Missing ${L}"
            fi
          done <<<$(find output -name \*.ko -exec /sbin/modinfo -F firmware {} 2>/dev/null \;)

          tar -zcf firmware.tgz -C firmware .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ainas-cks-firmware
          path: |
            firmware.tgz

  release:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout ainas-cks
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-cks
          token: ${{ secrets.AiNas }}
          path: ainas-cks

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        run: |
          # 按月低增版本号（26.9.0 / 26.9.1 ...），同月重复发布第 3 段 +1
          # 显式传入 version 且格式匹配当前年月时，以传入为准；否则自动计算
          # （原逻辑空输入时 VERSION 保持空 → 只出 test zip 不发布，对齐
          # modules.yml 主流程修复：空输入走自动计算）
          if [ -n "${{ inputs.version }}" ] && [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 自动：查 ainas-cks 最新 tag，同月则第 3 段 +1，跨月则 .0
            LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.AiNas }}" "https://api.github.com/repos/myp015/ainas-cks/releases" | jq -r '.[0].tag_name' 2>/dev/null)"
            if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              if [ "$(echo ${LATEST_TAG} | awk -F '.' '{print NF}')" -ge 4 ]; then
                # 旧格式 4 段 tag（如 26.9.13.1）不参与低增，回退到月份首版
                VERSION="$(date +'%y.%-m').0"
              else
                VERSION="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              fi
            else
              VERSION="$(date +'%y.%-m').0"
            fi
          fi

          # 防残留 tag 冲突：Calculate version 只查 releases[0]，历史失败 run 可能
          # 留下 git tag 但无 release 对象 → release-action 422 already_exists。
          # 循环 +1 直到对应 git tag 不存在（最多 20 次防死循环）。
          for i in $(seq 1 20); do
            if curl -skLH "Authorization: token ${{ secrets.AiNas }}" \
                 "https://api.github.com/repos/myp015/ainas-cks/git/refs/tags/${VERSION}" 2>/dev/null \
                 | grep -q '"ref"'; then
              VERSION="$(echo ${VERSION} | awk -F '.' '{$3=$3+1}1' OFS='.')"
            else
              break
            fi
          done

          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: download to artifacts
        # v8 批量下载大 artifact 偶发 digest-mismatch（Build cks #79 release job 实测）→
        # 降 v4（无 digest 校验，成熟稳定），与 modules.yml 主流程一致
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: ainas-cks-*
          merge-multiple: true

      - name: delete-artifact
        # 仅 download 成功才删（if: success()）：download 失败时保留 artifacts，
        # 否则编译产物被无条件删除后无法重跑 Extract/手动下载验证
        if: success()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            ainas-cks-*

      - name: Zip modules
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          # download 产物为空时 output/ 可能不存在，先建目录再写 VERSION
          # （Build cks #79 实测：digest-mismatch 后 output/VERSION 写入失败）
          mkdir -p output
          echo "${VERSION}" > "output/VERSION"
          zip -9 ainas-cks-${VERSION}.zip -j output/*

      - name: Upload to Artifacts
        if: success() && env.VERSION == ''
        uses: actions/upload-artifact@v7
        with:
          name: ainas-cks
          path: |
            ainas-cks-*.zip
          retention-days: 5

      - name: Extract release to ainas-cks/release and push
        if: success() && env.VERSION != ''
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"

          # 各平台模块 tgz / bzImage.gz / firmware.tgz 全部解压到
          # ainas-cks/release/<plat>-<ver>-<kver>/（目录形式，不保留压缩包，
          # 同 modules.yml 主流程 release 布局）。与 zip/Release 并存。
          mkdir -p ainas-cks/release
          # 先清空旧内容，避免版本混合残留（fail fast：find 失败直接中止）
          find ainas-cks/release -mindepth 1 -delete

          COUNT=0
          for tgz in output/modules-*.tgz; do
            [ -e "${tgz}" ] || continue
            name="$(basename "${tgz}" .tgz | sed 's/^modules-//')"   # epyc7002-7.4-5.10.55
            mkdir -p "ainas-cks/release/${name}"
            tar -zxf "${tgz}" -C "ainas-cks/release/${name}"
            COUNT=$((COUNT+1))
          done

          # bzImage.gz 解压为 bzImage，放各平台目录
          for gz in output/bzImage-*.gz; do
            [ -e "${gz}" ] || continue
            name="$(basename "${gz}" .gz | sed 's/^bzImage-//')"
            gzip -dc "${gz}" > "ainas-cks/release/${name}/bzImage"
          done

          # firmware.tgz 解压进 release/firmware/
          if [ -f output/firmware.tgz ]; then
            mkdir -p ainas-cks/release/firmware
            tar -zxf output/firmware.tgz -C ainas-cks/release/firmware
          fi

          echo "${VERSION}" > ainas-cks/release/VERSION

          echo "=== 解压 ${COUNT} 个平台，release/ 目录结构 ==="
          ls ainas-cks/release/
          echo "ko 总数: $(find ainas-cks/release -name '*.ko' | wc -l)"

          # 断言：模块 tgz 未下载则 COUNT=0，直接失败而非提交空目录
          if [ "${COUNT}" -eq 0 ]; then
            echo "FATAL: 未解压任何平台（download all 异常），中止提交"
            exit 1
          fi

          # 提交并推送 release/
          cd ainas-cks
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add release/
          if git diff --cached --quiet; then
            echo "release/ 无变化，跳过提交"
          else
            git commit -m "release: update ${VERSION}" || echo "commit 无变化跳过"
            git push origin main
          fi

      - name: Release
        if: success() && env.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: ainas-cks*.zip
          owner: myp015
          repo: ainas-cks
          token: ${{ secrets.AiNas }}