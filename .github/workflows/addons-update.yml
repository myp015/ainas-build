# RR 原版结构（保持不动），仅仓库地址适配 myp015：
#   checkout RROrg/rr-addons → myp015/ainas-addons（secrets.AiNas）
#   checkout RROrg/rr-misc   → myp015/ainas-rr-misc（secrets.AiNas，上游已删，本仓库为复刻）
#

name: Update addons update

on:
  workflow_dispatch:
    inputs:
      spksrc:
        description: "branch"
        required: false
        type: string
      push:
        description: "push"
        default: false
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-addons
          token: ${{ secrets.AiNas }}
          path: ainas-addons

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-rr-misc
          token: ${{ secrets.AiNas }}
          path: rr-misc

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout SynoCommunity Source and Docker Image
        run: |
          docker pull ghcr.io/synocommunity/spksrc
          git clone --depth=1 https://github.com/SynoCommunity/spksrc.git

          if [ -n "${{ inputs.spksrc }}" ]; then
            cd spksrc
            git fetch --depth=1 origin "${{ inputs.spksrc }}"
            git checkout "${{ inputs.spksrc }}"
            cd ..
          fi

          cp -rf rr-misc/src/* spksrc

      - name: Build Package
        run: |
          ROOT_PATH="${{ github.workspace }}"
          MAKE_ARCH="x64-7.1" # [x64-7.1, aarch64-7.1]
          # build packages

          echo "######## build rr-misc begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-misc ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-misc_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-misc_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            # misc/all/usr 完全来自 package.tgz，先清空再解包，避免旧版本残留文件
            # （如已不再需要的 libubsan.so*）混入 addon。
            rm -rf ainas-addons/misc/all/usr
            mkdir -p ainas-addons/misc/all/usr
            tar -zxf ${ROOT_PATH}/spk/package.tgz -C ainas-addons/misc/all/usr
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-misc end ########"

          echo "######## build rr-eudev begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-eudev ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-eudev_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-eudev_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/eudev/all/addons/eudev-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-eudev end ########"

          echo "######## build rr-acpid begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-acpid ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-acpid_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-acpid_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/acpid/all/addons/acpid-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-acpid end ########"

          echo "######## build rr-sensors begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-sensors ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-sensors_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-sensors_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/sensors/all/addons/sensors-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-sensors end ########"

          echo "######## build rr-console begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-console ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-console_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-console_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/console/all/addons/console-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-console end ########"

          echo "######## build rr-vmtools begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-vmtools ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-vmtools_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-vmtools_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/vmtools/all/addons/vmtools-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-vmtools end ########"

          echo "######## build rr-wireless begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-wireless ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-wireless_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-wireless_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/wireless/all/addons/wireless-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-wireless end ########"
          
          echo "######## build rr-mountloader begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-mountloader ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-mountloader_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-mountloader_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/mountloader/all/addons/mountloader-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-mountloader end ########"
          
          echo "######## build rr-monitor begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/spk/rr-monitor ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -n "$(ls ${ROOT_PATH}/spksrc/packages/rr-monitor_${MAKE_ARCH}_*.spk 2>/dev/null)" ]; then
            mkdir -p ${ROOT_PATH}/spk
            tar -xf ${ROOT_PATH}/spksrc/packages/rr-monitor_${MAKE_ARCH}_*.spk -C ${ROOT_PATH}/spk
            cp -vf ${ROOT_PATH}/spk/package.tgz ainas-addons/monitor/all/addons/monitor-$(echo ${MAKE_ARCH} | cut -d- -f2).tgz
            rm -rf ${ROOT_PATH}/spk
          fi
          echo "######## build rr-monitor end ########"
          
          # build cross

          echo "######## build powersched begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/cross/powersched ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -f "${ROOT_PATH}/spksrc/cross/powersched/work-${MAKE_ARCH}/install/usr/local/powersched/sbin/powersched" ]; then
            cp -vpf "${ROOT_PATH}/spksrc/cross/powersched/work-${MAKE_ARCH}/install/usr/local/powersched/sbin/powersched" ainas-addons/powersched/all/usr/sbin
          fi
          echo "######## build powersched end ########"

          echo "######## build synoscgiproxy begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/cross/synoscgiproxy ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -f "${ROOT_PATH}/spksrc/cross/synoscgiproxy/work-${MAKE_ARCH}/install/usr/local/synoscgiproxy/sbin/synoscgiproxy" ]; then
            cp -vpf "${ROOT_PATH}/spksrc/cross/synoscgiproxy/work-${MAKE_ARCH}/install/usr/local/synoscgiproxy/sbin/synoscgiproxy" ainas-addons/cpuinfo/all/usr/sbin
          fi
          echo "######## build synoscgiproxy end ########"

          echo "######## build openssh begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/cross/openssh ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -f "${ROOT_PATH}/spksrc/cross/openssh/work-${MAKE_ARCH}/install/usr/local/openssh/libexec/sftp-server" ]; then
            cp -vpf "${ROOT_PATH}/spksrc/cross/openssh/work-${MAKE_ARCH}/install/usr/local/openssh/libexec/sftp-server" ainas-addons/setrootpw/all/usr/lib/openssh/sftp-server
          fi
          echo "######## build openssh end ########"

          echo "######## build grub begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/cross/grub ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          if [ -f "${ROOT_PATH}/spksrc/cross/grub/work-${MAKE_ARCH}/install/usr/local/grub/bin/grub-editenv" ]; then
            cp -vpf "${ROOT_PATH}/spksrc/cross/grub/work-${MAKE_ARCH}/install/usr/local/grub/bin/grub-editenv" ainas-addons/reboottoloader/all/usr/bin/grub-editenv
          fi
          echo "######## build grub end ########"

      # DSM 6.x（内核 4.x/3.x，glibc 2.20 / libstdc++ 6.0.20）需要两件 7.1 产物跑不了的东西：
      #   cpio          —— 7.1 工具包里的 cpio 需要 glibc 2.26
      #   powersched    —— 7.1 的 powersched 需要 GLIBCXX_3.4.21（gcc 5+）
      # 其余 addon 载荷在 6.x 上用的是 RR 24.4.0 成品或 DSM 6.2 自带二进制（见各 addon/install.sh）。
      - name: Build Package 6.2
        run: |
          ROOT_PATH="${{ github.workspace }}"
          MAKE_ARCH="x64-6.2.4" # DSM 6.2.4-25556
          cd ${ROOT_PATH}

          echo "######## build cpio 6.2 begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/cross/cpio ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          CPIO_BIN="${ROOT_PATH}/spksrc/cross/cpio/work-${MAKE_ARCH}/install/usr/local/cpio/bin/cpio"
          if [ ! -f "${CPIO_BIN}" ]; then
            echo "ERROR: cpio for ${MAKE_ARCH} not built"
            exit 1
          fi
          # mountloader-6.2.tgz = 7.1 工具包原样，仅替换 bin/cpio（工具包内唯一需要 glibc > 2.20 的文件）
          rm -rf "${ROOT_PATH}/mountloader-6.2"
          mkdir -p "${ROOT_PATH}/mountloader-6.2"
          tar -zxf ainas-addons/mountloader/all/addons/mountloader-7.1.tgz -C "${ROOT_PATH}/mountloader-6.2"
          cp -vpf "${CPIO_BIN}" "${ROOT_PATH}/mountloader-6.2/bin/cpio"
          tar -czf ainas-addons/mountloader/all/addons/mountloader-6.2.tgz -C "${ROOT_PATH}/mountloader-6.2" .
          rm -rf "${ROOT_PATH}/mountloader-6.2"
          echo "######## build cpio 6.2 end ########"

          echo "######## build powersched 6.2 begin ########"
          docker run -v ${ROOT_PATH}/spksrc:/spksrc -w /spksrc/cross/powersched ghcr.io/synocommunity/spksrc make "arch-${MAKE_ARCH}"
          PS_BIN="${ROOT_PATH}/spksrc/cross/powersched/work-${MAKE_ARCH}/install/usr/local/powersched/sbin/powersched"
          if [ ! -f "${PS_BIN}" ]; then
            echo "ERROR: powersched for ${MAKE_ARCH} not built"
            exit 1
          fi
          cp -vpf "${PS_BIN}" ainas-addons/powersched/all/usr/sbin/powersched-6.2
          echo "######## build powersched 6.2 end ########"

      - name: Upload to Artifacts
        if: success() && inputs.push == false
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            spksrc/packages/*.spk
          retention-days: 5

      - name: Check and Push
        if: success() && inputs.push == true
        run: |
          cd ainas-addons
          echo "Git push ..."
          git pull
          status=$(git status -s | grep -E 'all/' | awk '{printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update $(date +%Y-%m-%d" "%H:%M:%S)"
            git push -f
          fi
