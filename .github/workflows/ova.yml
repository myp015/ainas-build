name: Build RR-OVA 
on:
  workflow_dispatch:
    inputs:
      all_models:
        description: "编译模式"
        type: choice
        options:
          - 自选
          - 全选
        default: 全选
      model_ds918p:
        description: "DS918+"
        type: boolean
        default: false
      model_ds920p:
        description: "DS920+"
        type: boolean
        default: false
      model_ds923p:
        description: "DS923+"
        type: boolean
        default: false
      model_ds925p:
        description: "DS925+"
        type: boolean
        default: false
      model_ds3622xsp:
        description: "DS3622xs+"
        type: boolean
        default: false
      model_sa6400:
        description: "SA6400"
        type: boolean
        default: false
      model_ds425p:
        description: "DS425+"
        type: boolean
        default: false
      custom_models:
        description: "自定义型号(工作流未列出的,多个用逗号分隔,如 DS1621+,RS4021xs+)"
        type: string
        default: ""
      overwrite_base:
        description: "覆盖 ova-base（默认复用 Release 中已存在的 base）"
        type: boolean
        default: false
      rr_version:
        description: "RR version (可选,留空=latest;示例:26.4.0 或 v26.4.0)"
        type: string
        default: ""
      dsm_version:
        description: "DSM 版本编号（从 pats.xlsx 获取，选择 >= 7.2.1 的所有版本）"
        type: choice
        options:
          - "7.2.1"
          - "7.2.2"
          - "7.3.0"
          - "7.3.1"
          - "7.3.2"
          - "7.4.1"
        default: "7.4.1"

jobs:
  resolve-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      asset_url: ${{ steps.pick.outputs.asset_url }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          REQ_RAW="${{ inputs.rr_version }}"
          REQ_TAG="$(printf '%s' "$REQ_RAW" | tr -d '[:space:]')"
          REQ_TAG="${REQ_TAG#rr-}"
          REQ_TAG="${REQ_TAG%.img.zip}"
          REQ_TAG="${REQ_TAG#v}"

          # 必须带凭据：runner 是共享出口 IP，匿名调用只有 60 次/小时，实测撞过 403
          fetch_latest() {
            curl -fsSL --connect-timeout 10 -H "Authorization: Bearer ${{ secrets.AiNas }}" "https://api.github.com/repos/RROrg/rr/releases/latest"
          }
          fetch_tag() {
            local t="$1"
            curl -fsSL --connect-timeout 10 -H "Authorization: Bearer ${{ secrets.AiNas }}" "https://api.github.com/repos/RROrg/rr/releases/tags/${t}"
          }

          if [ -z "$REQ_TAG" ] || [ "$REQ_TAG" = "latest" ]; then
            JSON="$(fetch_latest)"
          else
            if ! JSON="$(fetch_tag "$REQ_TAG" 2>/dev/null)"; then
              echo "[INFO] 指定版本 rr_version=${REQ_RAW} 未找到，回退到最新版本"
              JSON="$(fetch_latest)"
            fi
          fi

          RR_TAG="$(printf '%s' "$JSON" | jq -r '.tag_name' | sed 's/^v//')"
          ASSET_URL="$(printf '%s' "$JSON" | jq -r '.assets[]? | select(.name | test("^rr-.*[.]img[.]zip$")) | .browser_download_url' | head -n1)"
          if [ -z "$RR_TAG" ] || [ "$RR_TAG" = "null" ] || [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "[E] 下载失败 (rr_version=${REQ_RAW:-latest})"
            exit 1
          fi

          echo "tag=$RR_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

  # 单独串行创建并确认 Release，避免 OVA matrix 任务并发创建同一标签。
  ensure-release:
    needs: resolve-release
    runs-on: ubuntu-24.04
    steps:
      - name: 创建或确认 OVA Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          RR_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="OVA_rr${RR_TAG}"
          for attempt in $(seq 1 12); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "[INFO] Release 已确认可见: $RELEASE_TAG"
              exit 0
            fi
            echo "[INFO] 创建或确认 Release: $RELEASE_TAG (${attempt}/12)"
            set +e
            create_out=$(gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "OVA build artifacts for ${RR_TAG}" \
              --latest=false 2>&1)
            create_rc=$?
            set -e
            if [ "$create_rc" -eq 0 ]; then
              echo "[INFO] Release 创建成功，等待 API 可见"
            else
              echo "$create_out"
              if ! echo "$create_out" | grep -qiE 'already exists|already_exists|Validation Failed|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate'; then
                exit "$create_rc"
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "[E] Release ${RELEASE_TAG} 创建/查询连续失败" >&2
          exit 1

  # 公共 base：下载 RR、解压、cpuinfo/initrd 补丁这些与型号无关的工作只做一次，
  # 作为 Release 资产随 ainas-2in1 永久存放，各型号 job 从同一 Release 下载。
  # 不在本 job 做 patch_part1（grub.cfg 与型号相关），也不跑 docker make。
  prepare-base:
    runs-on: ubuntu-24.04
    needs: [resolve-release, ensure-release]
    env:
      RR_ASSET_URL: ${{ needs.resolve-release.outputs.asset_url }}
      RR_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查是否复用已有 base
        id: check
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          OVERWRITE_BASE: ${{ inputs.overwrite_base }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="OVA_rr${RR_TAG}"
          BASE_ASSET="ova-base-${RR_TAG}.img.zst"

          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          EXISTS="false"
          if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "$BASE_ASSET" \
             || printf '%s\n' "$ASSET_NAMES" | grep -Fxq "${BASE_ASSET}.part.000"; then
            EXISTS="true"
          fi

          if [ "$EXISTS" = "true" ] && [ "${OVERWRITE_BASE:-false}" != "true" ]; then
            echo "[INFO] Release ${RELEASE_TAG} 已存在 ${BASE_ASSET}，复用（未勾选覆盖）"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] 需要构建 base（exists=${EXISTS} overwrite=${OVERWRITE_BASE:-false}）"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout ainas-2in1
        if: steps.check.outputs.rebuild == 'true'
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载 RR 镜像
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${RR_TAG:?缺少 RR_TAG}"
          : "${RR_ASSET_URL:?缺少 RR_ASSET_URL}"
          FILENAME="rr-${RR_TAG}.zip"
          curl -fsSL --connect-timeout 10 "$RR_ASSET_URL" -o "$FILENAME"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

      - name: 构建公共 base
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PART3_PATH="/mnt/p3"

          . "$AINAS2IN1_DIR/script/2in1func.sh"

          sudo apt-get update
          sudo apt-get install -y gettext cpio zstd dosfstools rsync qemu-utils

          unzip "$FILENAME" -d rr rr.img

          # ── p3：cpuinfo + initrd 补丁（与型号无关）─────────────────
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"

          patch_cpuinfo "${PART3_PATH}/addons" "patch-cpuinfo.py"
          patch_ram "$PART3_PATH" rr "$WORKDIR"

          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          sudo rm -rf "$PART3_PATH"

          rm -rf "$AINAS2IN1_DIR"

          # 预压缩；Release 单文件超过 2GB 时上传前再分卷
          zstd -3 -T0 -q -f rr/rr.img -o ova-base.img.zst
          ls -lh ova-base.img.zst

      # 上传到 ainas-2in1 的 Release（与最终镜像放在一起），Release 资产默认永久保存。
      # 单文件超过 GitHub 2GB 上限时按 release_publish.sh 同样的 1900MB 规则分卷。
      # 仅在需要构建（缺失或勾选覆盖）时执行，上传前删除同名旧资产以完成替换。
      - name: 上传公共 base 到 Release
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="OVA_rr${RR_TAG}"
          BASE_ASSET="ova-base-${RR_TAG}.img.zst"

          mv -f ova-base.img.zst "$BASE_ASSET"
          SIZE=$(stat -c%s "$BASE_ASSET")
          echo "[INFO] base 大小=${SIZE} 字节"
          UPLOAD_FILES=()
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "[INFO] 超过 GitHub 单文件 2GB 上限，按 1900MB 分卷"
            rm -f "${BASE_ASSET}.part."*
            split -b 1900M -d -a 3 "$BASE_ASSET" "${BASE_ASSET}.part."
            UPLOAD_FILES=("${BASE_ASSET}".part.*)
          else
            UPLOAD_FILES=("$BASE_ASSET")
          fi

          # 先删除同名旧资产，避免单文件/分卷形态切换后残留旧内容
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$BASE_ASSET"|"$BASE_ASSET".part.*) gh release delete-asset "$RELEASE_TAG" "$name" --yes ;;
            esac
          done

          gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}"
          echo "[INFO] base 已上传到 Release: ${RELEASE_TAG}"

  select-models:
    runs-on: ubuntu-24.04
    outputs:
      models: ${{ steps.pick.outputs.models }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          MODELS=()

          if [ "${{ inputs.all_models }}" = "全选" ]; then
            echo "[INFO] 已开启全选，将编译所有支持的型号"
            MODELS+=("DS918+" "DS920+" "DS923+" "DS925+" "DS3622xs+" "SA6400" "DS425+")
          else
            [ "${{ inputs.model_ds918p }}"    = "true" ] && MODELS+=("DS918+")
            [ "${{ inputs.model_ds920p }}"    = "true" ] && MODELS+=("DS920+")
            [ "${{ inputs.model_ds923p }}"    = "true" ] && MODELS+=("DS923+")
            [ "${{ inputs.model_ds925p }}"    = "true" ] && MODELS+=("DS925+")
            [ "${{ inputs.model_ds3622xsp }}" = "true" ] && MODELS+=("DS3622xs+")
            [ "${{ inputs.model_sa6400 }}"    = "true" ] && MODELS+=("SA6400")
            [ "${{ inputs.model_ds425p }}"    = "true" ] && MODELS+=("DS425+")
          fi
          
          # 追加自定义型号（工作流未列出的型号）
          CUSTOM_RAW="${{ inputs.custom_models }}"
          if [ -n "$(printf '%s' "$CUSTOM_RAW" | tr -d '[:space:]')" ]; then
            echo "[INFO] 检测到自定义型号输入: ${CUSTOM_RAW}"
            IFS=',' read -ra CUSTOM_ARR <<< "$CUSTOM_RAW"
            for cm in "${CUSTOM_ARR[@]}"; do
              cm="$(echo "$cm" | xargs)"
              [ -n "$cm" ] && MODELS+=("$cm")
            done
          fi

          # 去重
          UNIQ_MODELS=()
          for m in "${MODELS[@]}"; do
            skip=0
            for u in "${UNIQ_MODELS[@]}"; do
              [ "$u" = "$m" ] && { skip=1; break; }
            done
            [ $skip -eq 0 ] && UNIQ_MODELS+=("$m")
          done
          MODELS=("${UNIQ_MODELS[@]}")

          if [ ${#MODELS[@]} -eq 0 ]; then
            echo "[E] 请至少勾选一个型号"
            exit 1
          fi

          JSON_OUT="["
          for m in "${MODELS[@]}"; do
            JSON_OUT+="\"$m\","
          done
          JSON_OUT="${JSON_OUT%,}]"
          echo "models=$JSON_OUT" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ format('build ({0})', matrix.model) }}
    needs: [resolve-release, select-models, ensure-release, prepare-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # max-parallel: 3
      matrix:
        model: ${{ fromJson(needs.select-models.outputs.models) }}
    env:
      LANGUAGE: zh_CN
      KERNEL: official
      ADDONS: acpid,reboottoloader,addincards,cpuinfo,expands,diskcompat,lsiutil,nvmevolume,powersched,remotefs,storagepanel,smartctl,trivial,apppatch,vmtools
      ACTION_TOKEN: ${{ secrets.AiNas }}
      RR_ASSET_URL: ${{ needs.resolve-release.outputs.asset_url }}
      RR_TAG: ${{ needs.resolve-release.outputs.tag }}
      # 原 checkout rr 步骤会通过 GITHUB_ENV 注入 TAG；该步骤已移除，必须在 env 显式提供，
      # 否则 repack_rr、发布步骤与失败日志上传会因 TAG 未定义而失败。
      TAG: ${{ needs.resolve-release.outputs.tag }}
      # 构建容器镜像源为 myp015/rr（rootfs 取自 ainas-rr 的 initrd）。Docker Hub 上
      # 该仓库只有 latest 与 26.10.x，RR release tag（如 26.9.0）没有对应镜像；
      # 直接把 RR_TAG 当镜像 tag 会 pull 失败（run 41206762237 即此原因）。
      RR_DOCKER_TAG: latest
      LINE: ${{ inputs.dsm_version }}
    steps:
      - uses: actions/checkout@v7

      - name: 初始化环境
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载公共 base
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${TAG:?缺少 TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="OVA_rr${TAG}"
          mkdir -p base
          gh release download "$RELEASE_TAG" \
            --pattern "ova-base-${TAG}.img.zst*" \
            --dir base --clobber
          if [ -f "base/ova-base-${TAG}.img.zst" ]; then
            echo "[INFO] base 为单文件"
          else
            # 超过 2GB 时 Release 只存分卷，编译步骤按文件名顺序流式合并解压
            compgen -G "base/ova-base-${TAG}.img.zst.part.*" >/dev/null || {
              echo "[E] Release ${RELEASE_TAG} 中未找到 base 资产" >&2
              exit 1
            }
            echo "[INFO] base 为分卷，编译步骤将流式合并解压（不落盘合并文件）"
          fi

      - name: 编译镜像
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail

          # ── 目录变量 ──────────────────────────────────────────────
          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PAT_XLSX_URL="https://raw.githubusercontent.com/myp015/ainas-rr/main/docs/pats.xlsx"
          PAT_XLSX="/tmp/pats.xlsx"
          DSM_INSTALL_DIR="/tmp/dsm-install"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          # 流程函数库（patch_* / docker_* / repack_* / dsm_setup）
          . "$AINAS2IN1_DIR/script/2in1func.sh"

          # DSM 版本映射由上面 source 的 2in1func.sh 提供（pick_dsm_version）

          LINE_REQ="${LINE:-7.3.2}"
          export LINE_REQ
          if echo "${MODEL}" | grep -Eq '^(DS925\+|DS425\+)$' && [ "${LINE_REQ}" = "7.2.1" ]; then
            echo "[INFO] ${MODEL} 不支持 DSM 7.2.1，自动切换到 7.2.2"
            LINE_REQ="7.2.2"
          fi

          VERSION="$(pick_dsm_version "${LINE_REQ}")"

          VER_MAIN="${VERSION%%-*}"
          VER_MAIN_NODOT="${VER_MAIN//./}"
          VER_BUILD="${VERSION#*-}"
          VER_BUILD="${VER_BUILD%%-*}"
          VER_SLUG="${VER_MAIN_NODOT}_${VER_BUILD}"
          SAFE_TAG="${TAG//./_}"
          echo "SAFE_TAG=${SAFE_TAG}" >> "$GITHUB_ENV"

          ARTIFACT="${MODEL}_${VER_SLUG}_${SAFE_TAG}"
          echo "[INFO] 型号=${MODEL} 目标DSM版本=${VERSION} DSM系列=${LINE_REQ} 制品版本=${VER_SLUG}"

          # ── 系统依赖 ───────────────────────────────────────────────
          sudo apt-get update
          sudo apt-get install -y gettext cpio zstd dosfstools rsync qemu-utils

          # ── 恢复公共 base ──────────────────────────────────────────
          # 下载 RR、解压、cpuinfo/initrd 补丁等与型号无关的步骤已在 prepare-base
          # 完成；这里只解压并挂上分区，供型号相关步骤使用。
          mkdir -p rr
          if [ -f "base/ova-base-${TAG}.img.zst" ]; then
            zstd -d -q -f "base/ova-base-${TAG}.img.zst" -o rr/rr.img
          else
            # 分卷直接流式解压，避免额外落盘一份合并文件占用 runner 磁盘
            compgen -G "base/ova-base-${TAG}.img.zst.part.*" >/dev/null || {
              echo "[E] 未找到公共 base: base/ova-base-${TAG}.img.zst" >&2
              exit 1
            }
            cat base/ova-base-${TAG}.img.zst.part.* | zstd -d -q -f - -o rr/rr.img
          fi
          rm -rf base

          # ── GRUB 修补（只有 grub.cfg 与型号相关，必须在型号 job 内做）──
          # 先让 patch_part1 自己挂/卸 p1，再把 rr.img 长期 attached；
          # 同一镜像同时挂两个 loop 时，第二个 loop 可能不生成分区节点
          # （实测 /dev/loop1p1 不存在导致 mount 失败）。
          patch_part1 rr/rr.img "$PART1_PATH" rr "$MODEL"

          # rr.img 必须保持 attached：容器内 .bashrc 按分区 label 挂载 p1/p2/p3
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          sudo mkdir -p "$PART1_PATH" "$PART3_PATH"

          # ── 使用 RR Docker 编译镜像 ───────────────────────────────
          docker_build rr "$MODEL" "$VERSION" "$LANGUAGE" "$ADDONS" "$RR_DOCKER_TAG" \
            "$WORKDIR"

          # ── 清理 p3 临时文件 ──────────────────────────────────────
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
          sudo rm -rf "$PART3_PATH/dl" "$PART3_PATH/auxfiles" "$PART3_PATH/logs"
          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          rm -f "$WORKDIR/2in1func.sh"

          # ── 提取 user-config.yml + 选择引导镜像 + Repack 2GB 镜像 ──
          repack_rr rr/rr.img "$TAG" "$WORKDIR" "2.5GB"

          # ── DSM 自动安装（解析 pats.xlsx → 启容器 → 安装 → 停容器）──
          if [ ! -f "$WORKDIR/rr/rr.img" ]; then
            echo "[E] rr.img 不存在于 $WORKDIR/rr/rr.img"
            exit 1
          fi
          dsm_setup "$MODEL" "$LINE_REQ" "$PAT_XLSX_URL" "$DSM_INSTALL_DIR" \
            "$WORKDIR" \
            "$AINAS2IN1_DIR/docker/vm-docker-compose.yaml" "$WORKDIR/rr/docker-compose.yaml" \
            "" "$SAFE_TAG" "360" \
            "s#file=/rr.img#file=/storage/alpine/rr.img#g"

          # ── 导出 OVA 制品 ─────────────────────────────────────────
          repack_ova "$WORKDIR" "$ARTIFACT"

          rm -f "$WORKDIR/2in1func.sh"
          rm -rf "$AINAS2IN1_DIR"

          echo "ARTIFACT=${ARTIFACT}"    >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=$ZIP_NAME"  >> "$GITHUB_ENV"


      - name: 安装失败时收尾并上传 rr.img
        if: failure()
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
        run: |
          # GitHub 调用 shell 时自带 -e，必须显式 +e 才能让收尾步骤把能做的都做完
          set +e -uo pipefail

          WORKDIR="$PWD"

          # ① 先停掉可能仍在运行、占用 rr.img 的 dsm 容器
          # 只用普通 down：失败时保留数据卷，避免把现场证据一起删掉
          if [ -f "$WORKDIR/rr/docker-compose.yaml" ]; then
            ( cd "$WORKDIR/rr" && docker compose -f docker-compose.yaml down )
          fi
          docker rm -f dsm >/dev/null 2>&1

          # ② 卸载可能残留的挂载点，摘除 loop 设备，避免读到不一致镜像
          sudo umount /mnt/p1 /mnt/p3 2>/dev/null
          for L in $(losetup -j "$WORKDIR/rr/rr.img" 2>/dev/null | cut -d: -f1); do
            sudo losetup --detach "$L"
          done
          sudo sync

          # ③ 确认成品镜像存在后再压缩
          if [ ! -f "$WORKDIR/rr/rr.img" ]; then
            echo "[E] rr/rr.img 不存在，可能失败在编译更早阶段，跳过上传"
            exit 0
          fi
          echo "[INFO] rr.img 大小: $(stat -c%s "$WORKDIR/rr/rr.img") 字节"

          OUT="$WORKDIR/rr/rr-failed-${MODEL}.img.gz"
          gzip -1 -c "$WORKDIR/rr/rr.img" > "$OUT"
          ls -lh "$OUT"
          echo "DEBUG_IMG=$OUT" >> "$GITHUB_ENV"

       #- name: 上传失败调试镜像到 Actions 制品区
        #if: failure()
       # uses: actions/upload-artifact@v7
        #with:
          #name: rr-img-failed-${{ matrix.model }}
          #path: rr/rr-failed-${{ matrix.model }}.img.gz
          #retention-days: 7
          #if-no-files-found: warn



      - name: 发布制品到 ainas-2in1 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${TAG:?缺少 TAG}"
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"

          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          RELEASE_TAG="OVA_rr${TAG}"

          # 分卷、Release 自愈、退避重试统一在 .github/scripts/release_publish.sh 里
          ASSET_ARGS=()
          [ -n "${ARTIFACT_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$ARTIFACT_ZIP")

          bash "$GITHUB_WORKSPACE/.github/scripts/release_publish.sh" \
            "$RELEASE_TAG" "OVA build artifacts for ${RR_TAG}" "${ASSET_ARGS[@]}"

      # 与 ainas-2in1-image.yml 保持一致：dsm_setup 把串口完整日志、套件检查
      # 输出和结论摘要写到 /tmp/dsm-install/logs，成功失败都上传 Actions artifact。
      - name: 上传 DSM 构建日志（串口/套件检查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsm-logs-${{ matrix.model }}-${{ github.run_id }}
          path: /tmp/dsm-install/logs
          if-no-files-found: warn
          retention-days: 30

      # 套件检查或安装失败时，把日志压缩后附加到本次 OVA Release，
      # 无需登录 runner 也能下载现场日志；成功构建不附加。
      - name: 失败时将 DSM 日志附加到 Release
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          LOG_DIR=/tmp/dsm-install/logs
          if [ ! -d "$LOG_DIR" ]; then
            echo "[INFO] 无日志目录，跳过 Release 日志上传"
            exit 0
          fi
          shopt -s nullglob
          files=("$LOG_DIR"/*.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "[INFO] 无日志文件，跳过 Release 日志上传"
            exit 0
          fi
          if [ -z "${TAG:-}" ]; then
            echo "[WARN] TAG 未设置（失败发生在 checkout rr 之前），跳过 Release 日志上传"
            exit 0
          fi
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          for f in "${files[@]}"; do
            gzip -1 -c "$f" > "$f.gz"
          done
          gh release upload "OVA_rr${TAG}" "$LOG_DIR"/*.log.gz --clobber

