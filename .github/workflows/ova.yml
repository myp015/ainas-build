#
# 双源 OVA 工作流：每次编译选择一个 RR 源
#   ainas → myp015/ainas-rr（镜像 myp015/rr），Release ainas-ova-<版本>（新增）
#   RROrg → RROrg/rr（镜像 wjz304/rr），Release RROrg-ova-<版本>
# 仅支持 DSM 7.x；p3 资产全部取自 rr.img（不调用 get*）。
# 型号勾选项只用 7 个通用型号；其它型号请通过 custom_models 手动输入。
name: Build RR-OVA
on:
  workflow_dispatch:
    inputs:
      rr_source:
        description: "RR 源（每次编译只能选一个）"
        type: choice
        options:
          - ainas
          - RROrg
        default: ainas
      all_models:
        description: "编译模式"
        type: choice
        options:
          - 自选
          - 全选
        default: 全选
      model_ds918p:
        description: "DS918+"
        type: boolean
        default: false
      model_ds920p:
        description: "DS920+"
        type: boolean
        default: false
      model_ds923p:
        description: "DS923+"
        type: boolean
        default: false
      model_ds925p:
        description: "DS925+"
        type: boolean
        default: false
      model_ds3622xsp:
        description: "DS3622xs+"
        type: boolean
        default: false
      model_sa6400:
        description: "SA6400"
        type: boolean
        default: false
      model_ds425p:
        description: "DS425+"
        type: boolean
        default: false
      custom_models:
        description: "自定义型号(工作流未列出的,多个用逗号分隔,如 DS1621+,DVA3221,RS4021xs+)"
        type: string
        default: ""
      overwrite_base:
        description: "覆盖所选源的 ova-base（默认复用 Release 中已存在的 base）"
        type: boolean
        default: false
      rr_version:
        description: "RR version (可选,留空=latest;指定版本必须在所选源中存在，不做回退)"
        type: string
        default: ""
      dsm_version:
        description: "DSM 版本编号（仅 7.x，从 pats.json 获取）"
        type: choice
        options:
          - "7.2.1"
          - "7.2.2"
          - "7.3.0"
          - "7.3.1"
          - "7.3.2"
          - "7.4.1"
        default: "7.4.1"

jobs:
  # 一次性解析源版本、选择型号并生成 matrix 任务，下游只读 needs.plan.outputs。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.plan.outputs.source }}
      rr_tag: ${{ steps.plan.outputs.rr_tag }}
      rr_asset_url: ${{ steps.plan.outputs.rr_asset_url }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_title: ${{ steps.plan.outputs.release_title }}
      release_notes: ${{ steps.plan.outputs.release_notes }}
      base_asset: ${{ steps.plan.outputs.base_asset }}
      docker_image: ${{ steps.plan.outputs.docker_image }}
      docker_tag: ${{ steps.plan.outputs.docker_tag }}
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7

      - name: 规划源与构建任务
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
          RR_SOURCE: ${{ inputs.rr_source }}
          RR_VERSION: ${{ inputs.rr_version }}
          DSM_VERSION: ${{ inputs.dsm_version }}
          ALL_MODELS: ${{ inputs.all_models }}
          CUSTOM_MODELS: ${{ inputs.custom_models }}
          MODEL_DS918P: ${{ inputs.model_ds918p }}
          MODEL_DS920P: ${{ inputs.model_ds920p }}
          MODEL_DS923P: ${{ inputs.model_ds923p }}
          MODEL_DS925P: ${{ inputs.model_ds925p }}
          MODEL_DS3622XSP: ${{ inputs.model_ds3622xsp }}
          MODEL_SA6400: ${{ inputs.model_sa6400 }}
          MODEL_DS425P: ${{ inputs.model_ds425p }}
        run: bash .github/scripts/plan_sources.sh ova

  # 单独串行创建并确认 Release，避免 OVA matrix 任务并发创建同一标签。
  ensure-release:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: 创建或确认 OVA Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.plan.outputs.release_title }}
          RELEASE_NOTES: ${{ needs.plan.outputs.release_notes }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          for attempt in $(seq 1 12); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "[INFO] Release 已确认可见: $RELEASE_TAG（源=${SOURCE}）"
              exit 0
            fi
            echo "[INFO] 创建或确认 Release: $RELEASE_TAG（源=${SOURCE}）(${attempt}/12)"
            set +e
            create_out=$(gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest=false 2>&1)
            create_rc=$?
            set -e
            if [ "$create_rc" -eq 0 ]; then
              echo "[INFO] Release 创建成功，等待 API 可见"
            else
              echo "[WARN] Release 暂不可用，继续重试：$(printf '%s' "$create_out" | tail -n1)"
              if ! echo "$create_out" | grep -qiE 'already exists|already_exists|Validation Failed|HTTP 429|HTTP 502|HTTP 503|HTTP 504|rate limit|secondary rate'; then
                exit "$create_rc"
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "[E] Release ${RELEASE_TAG} 创建/查询连续失败" >&2
          exit 1

  # 公共 base：下载 RR、cpuinfo/initrd 补丁这些与型号无关的工作每个源只做一次，
  # 作为 Release 资产永久存放。不在本 job 做 patch_part1（grub.cfg 与型号相关）。
  prepare-base:
    needs: [plan, ensure-release]
    runs-on: ubuntu-24.04
    env:
      RR_ASSET_URL: ${{ needs.plan.outputs.rr_asset_url }}
      RR_TAG: ${{ needs.plan.outputs.rr_tag }}
      TAG: ${{ needs.plan.outputs.rr_tag }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      BASE_ASSET: ${{ needs.plan.outputs.base_asset }}
      SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查是否复用已有 base
        id: check
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          OVERWRITE_BASE: ${{ inputs.overwrite_base }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          EXISTS="false"
          if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "$BASE_ASSET" \
             || printf '%s\n' "$ASSET_NAMES" | grep -Fxq "${BASE_ASSET}.part.000"; then
            EXISTS="true"
          fi

          if [ "$EXISTS" = "true" ] && [ "${OVERWRITE_BASE:-false}" != "true" ]; then
            echo "[INFO] Release ${RELEASE_TAG}（源=${SOURCE}）已存在 ${BASE_ASSET}，复用（未勾选覆盖）"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] 需要构建 base（exists=${EXISTS} overwrite=${OVERWRITE_BASE:-false}）"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout ainas-2in1
        if: steps.check.outputs.rebuild == 'true'
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载 RR 镜像
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${RR_TAG:?缺少 RR_TAG}"
          : "${RR_ASSET_URL:?缺少 RR_ASSET_URL}"
          FILENAME="rr-${RR_TAG}.zip"
          curl -fsSL --connect-timeout 10 "$RR_ASSET_URL" -o "$FILENAME"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

      - name: 构建公共 base
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PART3_PATH="/mnt/p3"

          . "$AINAS2IN1_DIR/script/2in1func.sh"

          echo "[INFO] 安装构建依赖"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext cpio zstd dosfstools rsync qemu-utils >/dev/null

          unzip -q "$FILENAME" -d rr rr.img

          # ── p3：cpuinfo + initrd 补丁（与型号无关）─────────────────
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img

          # 分区节点异步创建，等待就绪后再挂载
          for _ in $(seq 1 40); do [ -b "${DISK_LOOP}p3" ] && break; sleep 0.25; done
          [ -b "${DISK_LOOP}p3" ] || { echo "[E] 镜像分区未就绪：${DISK_LOOP}p3" >&2; exit 1; }
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"

          # addons/modules/lkms/cks 全部取自 rr.img：不调用 get* 覆盖 myp015 Release 资产
          # （RROrg 源的 lkm 例外，见下方分区保护说明）
          for d in cks lkms addons modules; do
            if [ ! -d "${PART3_PATH}/${d}" ] || [ -z "$(ls -A "${PART3_PATH}/${d}")" ]; then
              echo "[E] rr.img 的 p3 缺少内置资产目录或为空: ${d}" >&2
              exit 1
            fi
          done
          for f in "addons/cpuinfo/all.tgz"; do
            if [ ! -f "${PART3_PATH}/${f}" ]; then
              echo "[E] rr.img 的 p3 缺少内置资产: ${f}" >&2
              exit 1
            fi
          done

          # lkm 也直接用 rr.img 内置的（不做 ainas-lkm 覆盖）
          echo "[INFO] 源=${SOURCE}：lkms/cks/addons/modules 均取自 rr.img"

          patch_cpuinfo "${PART3_PATH}/addons" "rr"
          patch_ram "$PART3_PATH" rr "$WORKDIR"

          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          sudo rm -rf "$PART3_PATH"

          rm -rf "$AINAS2IN1_DIR"

          # 预压缩；Release 单文件超过 2GB 时上传前再分卷
          zstd -3 -T0 -q -f rr/rr.img -o ova-base.img.zst

      # 上传到 ainas-2in1 的 Release（与最终镜像放在一起），Release 资产默认永久保存。
      # 单文件超过 GitHub 2GB 上限时按 release_publish.sh 同样的 1900MB 规则分卷。
      - name: 上传公共 base 到 Release
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          mv -f ova-base.img.zst "$BASE_ASSET"
          SIZE=$(stat -c%s "$BASE_ASSET")
          echo "[INFO] base 大小=${SIZE} 字节"
          UPLOAD_FILES=()
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "[INFO] 超过 GitHub 单文件 2GB 上限，按 1900MB 分卷"
            rm -f "${BASE_ASSET}.part."*
            split -b 1900M -d -a 3 "$BASE_ASSET" "${BASE_ASSET}.part."
            UPLOAD_FILES=("${BASE_ASSET}".part.*)
          else
            UPLOAD_FILES=("$BASE_ASSET")
          fi

          # 先删除同名旧资产，避免单文件/分卷形态切换后残留旧内容
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$BASE_ASSET"|"$BASE_ASSET".part.*) gh release delete-asset "$RELEASE_TAG" "$name" --yes ;;
            esac
          done

          gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}"
          echo "[INFO] base 已上传到 Release: ${RELEASE_TAG}"

  build:
    name: ${{ format('build ({0})', matrix.model) }}
    needs: [plan, prepare-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      LANGUAGE: zh_CN
      KERNEL: official
      ADDONS: acpid,reboottoloader,addincards,cpuinfo,expands,diskcompat,lsiutil,nvmevolume,powersched,remotefs,storagepanel,smartctl,trivial,apppatch,vmtools
      ACTION_TOKEN: ${{ secrets.AiNas }}
      LINE: ${{ inputs.dsm_version }}
      SOURCE: ${{ needs.plan.outputs.source }}
      TAG: ${{ needs.plan.outputs.rr_tag }}
      RR_TAG: ${{ needs.plan.outputs.rr_tag }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_NOTES: ${{ needs.plan.outputs.release_notes }}
      BASE_ASSET: ${{ needs.plan.outputs.base_asset }}
      RR_DOCKER_IMAGE: ${{ needs.plan.outputs.docker_image }}
      RR_DOCKER_TAG: ${{ needs.plan.outputs.docker_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: 初始化环境
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载公共 base
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          : "${BASE_ASSET:?缺少 BASE_ASSET}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          mkdir -p base
          gh release download "$RELEASE_TAG" \
            --pattern "${BASE_ASSET}*" \
            --dir base --clobber
          if [ -f "base/${BASE_ASSET}" ]; then
            echo "[INFO] base 为单文件"
          else
            # 超过 2GB 时 Release 只存分卷，编译步骤按文件名顺序流式合并解压
            compgen -G "base/${BASE_ASSET}.part.*" >/dev/null || {
              echo "[E] Release ${RELEASE_TAG} 中未找到 base 资产 ${BASE_ASSET}" >&2
              exit 1
            }
            echo "[INFO] base 为分卷，编译步骤将流式合并解压（不落盘合并文件）"
          fi

      - name: 编译镜像
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail

          # ── 目录变量 ──────────────────────────────────────────────
          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PAT_JSON_URL="https://raw.githubusercontent.com/myp015/ainas-rr/main/docs/pats.json"
          PAT_JSON="/tmp/pats.json"
          DSM_INSTALL_DIR="/tmp/dsm-install"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          # 流程函数库（patch_* / docker_* / repack_* / dsm_setup）
          . "$AINAS2IN1_DIR/script/2in1func.sh"

          # DSM 版本映射由上面 source 的 2in1func.sh 提供（pick_dsm_version）

          LINE_REQ="${LINE:-7.3.2}"
          export LINE_REQ
          if echo "${MODEL}" | grep -Eq '^(DS925\+|DS425\+)$' && [ "${LINE_REQ}" = "7.2.1" ]; then
            echo "[INFO] ${MODEL} 不支持 DSM 7.2.1，自动切换到 7.2.2"
            LINE_REQ="7.2.2"
          fi

          VERSION="$(pick_dsm_version "${LINE_REQ}")"

          VER_MAIN="${VERSION%%-*}"
          VER_MAIN_NODOT="${VER_MAIN//./}"
          VER_BUILD="${VERSION#*-}"
          VER_BUILD="${VER_BUILD%%-*}"
          VER_SLUG="${VER_MAIN_NODOT}_${VER_BUILD}"
          SAFE_TAG="${TAG//./_}"
          echo "SAFE_TAG=${SAFE_TAG}" >> "$GITHUB_ENV"

          # 制品品牌随源区分：RROrg → RROrg，ainas → ainas
          if [ "${SOURCE}" = "RROrg" ]; then
            ARTIFACT_BRAND="_RROrg"
          else
            ARTIFACT_BRAND="_ainas"
          fi
          ARTIFACT="${MODEL}_${VER_SLUG}${ARTIFACT_BRAND}_${SAFE_TAG}"
          echo "[INFO] 型号=${MODEL} 目标DSM版本=${VERSION} DSM系列=${LINE_REQ} 制品版本=${VER_SLUG} 源=${SOURCE}"

          # ── 系统依赖 ───────────────────────────────────────────────
          echo "[INFO] 安装构建依赖"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext cpio zstd dosfstools rsync qemu-utils >/dev/null

          # ── 恢复公共 base ──────────────────────────────────────────
          # 下载 RR、cpuinfo/initrd 补丁等与型号无关的步骤已在 prepare-base
          # 完成；这里只解压并挂上分区，供型号相关步骤使用。
          mkdir -p rr
          if [ -f "base/${BASE_ASSET}" ]; then
            zstd -d -q -f "base/${BASE_ASSET}" -o rr/rr.img
          else
            # 分卷直接流式解压，避免额外落盘一份合并文件占用 runner 磁盘
            compgen -G "base/${BASE_ASSET}.part.*" >/dev/null || {
              echo "[E] 未找到公共 base: base/${BASE_ASSET}" >&2
              exit 1
            }
            cat base/${BASE_ASSET}.part.* | zstd -d -q -f - -o rr/rr.img
          fi
          rm -rf base

          # ── GRUB 修补（只有 grub.cfg 与型号相关，必须在型号 job 内做）──
          # 先让 patch_part1 自己挂/卸 p1，再把 rr.img 长期 attached；
          # 同一镜像同时挂两个 loop 时，第二个 loop 可能不生成分区节点
          # （实测 /dev/loop1p1 不存在导致 mount 失败）。
          patch_part1 rr/rr.img "$PART1_PATH" rr "$MODEL"

          # rr.img 必须保持 attached：容器内 .bashrc 按分区 label 挂载 p1/p2/p3
          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img

          # 分区节点异步创建，等待就绪后再挂载
          for _ in $(seq 1 40); do [ -b "${DISK_LOOP}p3" ] && break; sleep 0.25; done
          [ -b "${DISK_LOOP}p3" ] || { echo "[E] 镜像分区未就绪：${DISK_LOOP}p3" >&2; exit 1; }
          sudo mkdir -p "$PART1_PATH" "$PART3_PATH"

          # ── 使用 RR Docker 编译镜像 ───────────────────────────────
          docker_build rr "$MODEL" "$VERSION" "$LANGUAGE" "$ADDONS" "$RR_DOCKER_TAG" \
            "$WORKDIR"

          # ── 清理 p3 临时文件 + 按型号裁剪资产 ────────────────────
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
          sudo rm -rf "$PART3_PATH/dl" "$PART3_PATH/auxfiles" "$PART3_PATH/logs"
          trim_p3_assets "$PART3_PATH" "$MODEL"
          # ova 无原版 RR 任务，所有型号统一精简主菜单
          rr_menu_apply "$PART3_PATH" slim
          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          rm -f "$WORKDIR/2in1func.sh"

          # ── 提取 user-config.yml + 选择引导镜像 + Repack 2GB 镜像 ──
          repack_rr rr/rr.img "$TAG" "$WORKDIR" "2.5GB"

          # ── DSM 自动安装（解析 pats.json → 启容器 → 安装 → 停容器）──
          if [ ! -f "$WORKDIR/rr/rr.img" ]; then
            echo "[E] rr.img 不存在于 $WORKDIR/rr/rr.img"
            exit 1
          fi
          dsm_setup "$MODEL" "$LINE_REQ" "$PAT_JSON_URL" "$DSM_INSTALL_DIR" \
            "$WORKDIR" \
            "$AINAS2IN1_DIR/docker/vm-docker-compose.yaml" "$WORKDIR/rr/docker-compose.yaml" \
            "${ARTIFACT_BRAND}" "$SAFE_TAG" "360" \
            "s#file=/rr.img#file=/storage/alpine/rr.img#g"

          # ── 导出 OVA 制品 ─────────────────────────────────────────
          repack_ova "$WORKDIR" "$ARTIFACT"

          rm -f "$WORKDIR/2in1func.sh"
          rm -rf "$AINAS2IN1_DIR"

          echo "ARTIFACT=${ARTIFACT}"    >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=$ZIP_NAME"  >> "$GITHUB_ENV"

      - name: 安装失败时收尾并上传 rr.img
        if: failure()
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
        run: |
          # GitHub 调用 shell 时自带 -e，必须显式 +e 才能让收尾步骤把能做的都做完
          set +e -uo pipefail

          WORKDIR="$PWD"

          # ① 先停掉可能仍在运行、占用 rr.img 的 dsm 容器
          # 只用普通 down：失败时保留数据卷，避免把现场证据一起删掉
          if [ -f "$WORKDIR/rr/docker-compose.yaml" ]; then
            ( cd "$WORKDIR/rr" && docker compose -f docker-compose.yaml down )
          fi
          docker rm -f dsm >/dev/null 2>&1

          # ② 卸载可能残留的挂载点，摘除 loop 设备，避免读到不一致镜像
          sudo umount /mnt/p1 /mnt/p3 2>/dev/null
          for L in $(losetup -j "$WORKDIR/rr/rr.img" 2>/dev/null | cut -d: -f1); do
            sudo losetup --detach "$L"
          done
          sudo sync

          # ③ 确认成品镜像存在后再压缩
          if [ ! -f "$WORKDIR/rr/rr.img" ]; then
            echo "[E] rr/rr.img 不存在，可能失败在编译更早阶段，跳过上传"
            exit 0
          fi
          echo "[INFO] rr.img 大小: $(stat -c%s "$WORKDIR/rr/rr.img") 字节"

          OUT="$WORKDIR/rr/rr-failed-${MODEL}.img.gz"
          gzip -1 -c "$WORKDIR/rr/rr.img" > "$OUT"
          echo "[INFO] 失败镜像已保存: $(basename "$OUT")（$(du -h "$OUT" | cut -f1)）"
          echo "DEBUG_IMG=$OUT" >> "$GITHUB_ENV"

      - name: 发布制品到 Release
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"

          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          # 分卷、Release 自愈、退避重试统一在 .github/scripts/release_publish.sh 里
          ASSET_ARGS=()
          [ -n "${ARTIFACT_ZIP:-}" ] && ASSET_ARGS+=("$GITHUB_WORKSPACE/$ARTIFACT_ZIP")

          bash "$GITHUB_WORKSPACE/.github/scripts/release_publish.sh" \
            "$RELEASE_TAG" "${RELEASE_NOTES:-OVA build artifacts}" "${ASSET_ARGS[@]}"

      # 串口完整日志、套件检查输出、结论摘要统一由 dsm_setup 写到 /tmp/dsm-install/logs。
      - name: 上传 DSM 构建日志（串口/套件检查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsm-logs-${{ matrix.model }}-${{ github.run_id }}
          path: /tmp/dsm-install/logs
          if-no-files-found: warn
          retention-days: 30

      # 套件检查或安装失败时，把日志压缩后附加到本次 OVA Release，
      # 无需登录 runner 也能下载现场日志；成功构建不附加。
      - name: 失败时将 DSM 日志附加到 Release
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          LOG_DIR=/tmp/dsm-install/logs
          if [ ! -d "$LOG_DIR" ]; then
            echo "[INFO] 无日志目录，跳过 Release 日志上传"
            exit 0
          fi
          shopt -s nullglob
          files=("$LOG_DIR"/*.log)
          if [ ${#files[@]} -eq 0 ]; then
            echo "[INFO] 无日志文件，跳过 Release 日志上传"
            exit 0
          fi
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "[WARN] RELEASE_TAG 未设置（失败发生在加载源配置之前），跳过 Release 日志上传"
            exit 0
          fi
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          for f in "${files[@]}"; do
            gzip -1 -c "$f" > "$f.gz"
          done
          gh release upload "${RELEASE_TAG}" "$LOG_DIR"/*.log.gz --clobber
