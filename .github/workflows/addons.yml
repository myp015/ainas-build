# RR 原版结构（保持不动），仅仓库地址适配 myp015：
#   checkout RROrg/rr-addons  → myp015/ainas-addons（secrets.AiNas）
#   version 查 RROrg/rr-addons → myp015/ainas-addons（secrets.AiNas）
#   Release 发 RROrg/rr-addons → myp015/ainas-addons（secrets.AiNas）
#

name: Build addons

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-addons
          token: ${{ secrets.AiNas }}
          path: ainas-addons

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/calc_version.sh" "myp015/ainas-addons" "${{ inputs.version }}"

      - name: Build addon packages
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          cd ainas-addons
          sed -i "s/version:.*$/version: ${VERSION}/g" */manifest.yml
          . ./compile.sh

          echo "${VERSION}" > "VERSION"
          zip -9 ${{ github.workspace }}/addons-${VERSION}.zip -j *.addon VERSION

      - name: Release
        uses: ncipollo/release-action@v1
        if: success() && env.VERSION != ''
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: addons*.zip
          owner: myp015
          repo: ainas-addons
          token: ${{ secrets.AiNas }}
