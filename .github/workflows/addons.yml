# RR 原版结构（保持不动），仅仓库地址适配 myp015：
#   checkout RROrg/rr-addons  → myp015/ainas-addons（secrets.AiNas）
#   version 查 RROrg/rr-addons → myp015/ainas-addons（secrets.AiNas）
#   Release 发 RROrg/rr-addons → myp015/ainas-addons（secrets.AiNas）
#

name: Build addons

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-addons
          token: ${{ secrets.AiNas }}
          path: ainas-addons

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/calc_version.sh" "myp015/ainas-addons" "${{ inputs.version }}"

      - name: Build addon packages
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          cd ainas-addons
          sed -i "s/version:.*$/version: ${VERSION}/g" */manifest.yml
          . ./compile.sh

          echo "${VERSION}" > "VERSION"
          zip -9 ${{ github.workspace }}/addons-${VERSION}.zip -j *.addon VERSION

      - name: Upload addon package
        # 本工作流没有 delete-artifact（不会删东西），但原本也没有 upload-artifact：
        # 未填版本号时 Release 跳过，打完的 addons-test.zip 随 runner 销毁、取不回来。
        # 与 modules.yml / cks.yml / lkms.yml 同规则（Task#207）：不发布也要留下编译产物。
        # 发布时也照传一份，便于在 run 页面直接取件核对。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: addons-package
          path: addons-*.zip
          if-no-files-found: warn

      - name: Release
        uses: ncipollo/release-action@v1
        if: success() && env.VERSION != ''
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: addons*.zip
          owner: myp015
          repo: ainas-addons
          token: ${{ secrets.AiNas }}
