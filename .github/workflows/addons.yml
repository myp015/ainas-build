# RR 原版结构（保持不动），仅仓库地址适配 myp015：
#   checkout RROrg/rr-addons  → myp015/ainas-addons（secrets.AiNas）
#   version 查 RROrg/rr-addons → myp015/ainas-addons（secrets.AiNas）
#   Release 发 RROrg/rr-addons → myp015/ainas-addons（secrets.AiNas）
#

name: Build addons

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-addons
          token: ${{ secrets.AiNas }}
          path: rr-addons

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Calculate version
        run: |
          # 按月低增版本号（26.10.0 / 26.10.1 ...），同月重复发布第 3 段 +1
          # 显式传入 version 且格式匹配当前年月时，以传入为准；否则自动计算
          # （对齐 cks.yml：原逻辑空输入时 VERSION 保持空 → 只出 test zip 不发布；
          # 修复后空输入也走自动计算并发布）
          if [ -n "${{ inputs.version }}" ] && [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 自动：查 ainas-addons 最新 tag，同月则第 3 段 +1，跨月则 .0
            LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.AiNas }}" "https://api.github.com/repos/myp015/ainas-addons/releases" | jq -r '.[0].tag_name' 2>/dev/null)"
            if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              if [ "$(echo ${LATEST_TAG} | awk -F '.' '{print NF}')" -ge 4 ]; then
                # 旧格式 4 段 tag（如 26.9.13.1）不参与低增，回退到月份首版
                VERSION="$(date +'%y.%-m').0"
              else
                VERSION="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              fi
            else
              VERSION="$(date +'%y.%-m').0"
            fi
          fi

          # 防残留 tag 冲突：Calculate version 只查 releases[0]，历史失败 run 可能
          # 留下 git tag 但无 release 对象 → release-action 422 already_exists。
          # 循环 +1 直到对应 git tag 不存在（最多 20 次防死循环）。
          for i in $(seq 1 20); do
            if curl -skLH "Authorization: token ${{ secrets.AiNas }}" \
                 "https://api.github.com/repos/myp015/ainas-addons/git/refs/tags/${VERSION}" 2>/dev/null \
                 | grep -q '"ref"'; then
              VERSION="$(echo ${VERSION} | awk -F '.' '{$3=$3+1}1' OFS='.')"
            else
              break
            fi
          done

          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build addon packages
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION:-"test"}"

          cd rr-addons
          sed -i "s/version:.*$/version: ${VERSION}/g" */manifest.yml
          . ./compile.sh

          echo "${VERSION}" > "VERSION"
          zip -9 ${{ github.workspace }}/addons-${VERSION}.zip -j *.addon VERSION

      - name: Upload to Artifacts
        if: success() && env.VERSION == ''
        uses: actions/upload-artifact@v7
        with:
          name: addons
          path: |
            addons*.zip
          retention-days: 5

      - name: Release
        uses: ncipollo/release-action@v1
        if: success() && env.VERSION != ''
        with:
          tag: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: addons*.zip
          owner: myp015
          repo: ainas-addons
          token: ${{ secrets.AiNas }}
