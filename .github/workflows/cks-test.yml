#
# cks-test.yml - 临时测试工作流（复制自 cks.yml 完整流程，缩减型号）
# 相对 cks.yml 的改动：
#   - 矩阵 = Task#170 的 geminilakenk 7.3/7.4 + Task#171 的 v1000nk/r1000nk 7.3/7.4
#   - 去掉 firmware / release job（测试验证流不发布 release）
#   - 去掉 syno-modules checkout（OFFICIAL_PATH 留空不用）
#   - artifact 名前缀 ainas-cks-test-* 防与 cks.yml 产物混淆
# 保留 cks.yml 完整 build 流程：makeEnvDeploy + makekernel + makemodules
# + makei915（intel-gpu-i915-backports 第三方驱动编译，产出 update/ 栈）
#

name: Build cks test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string

jobs:
  build:
    strategy:
      # Task#170 验证 geminilakenk 7.3/7.4（drm_vram_helper shim）；
      # Task#171 验证 v1000nk/r1000nk 7.3/7.4（MY_DEF 注入收窄对齐 arc，
      # 仅 v1000nk-7.4 导出 asmedia）。Task#183 全平台补 7.2（官方 7.2 模块集
      # == 7.3 模块集，7.2 分支=7.3 复制，对齐基准=official/rd 7.2 模块集）。
      # 完整参考面 = RR cks 9 平台 + 三平台 7.2（共 12 组合），
      # 无 7.1（dsm_linux 无 7.1 分支）。
      fail-fast: false
      matrix:
        include:
          - version: 7.2
            platform: geminilakenk
          - version: 7.3
            platform: geminilakenk
          - version: 7.4
            platform: geminilakenk
          - version: 7.2
            platform: v1000nk
          - version: 7.3
            platform: v1000nk
          - version: 7.4
            platform: v1000nk
          - version: 7.2
            platform: r1000nk
          - version: 7.3
            platform: r1000nk
          - version: 7.4
            platform: r1000nk

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-modules
          token: ${{ secrets.AiNas }}
          path: ainas-modules

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/ainas-cks
          token: ${{ secrets.AiNas }}
          path: ainas-cks

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo apt update
          sudo apt install -y curl build-essential bison flex dwarves ruby libncurses-dev libssl-dev libelf-dev

      - name: Make modules
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          git clone -b ${PLATFORM}-${VERSION}-5.10.55 --depth=1 https://github.com/myp015/dsm_linux.git
          git clone --depth=1 https://github.com/myp015/intel-gpu-i915-backports.git

          . ${ROOT_PATH}/ainas-modules/compile-ck.sh

          echo "makeEnvDeploy"
          makeEnvDeploy "${ROOT_PATH}" "${VERSION}" "${PLATFORM}"

          echo "makekernel"
          makekernel "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux" "${ROOT_PATH}/output"

          echo "makemodules"
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux")"
          cp -f "${ROOT_PATH}/ainas-modules/src/${KVER}-ck/defines.${PLATFORM}" "${ROOT_PATH}/ainas-modules/src/${KVER}-ck/defines"
          makemodules "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux" "${ROOT_PATH}/ainas-modules/src/${KVER}-ck" "${ROOT_PATH}/modules"

          echo "makei915"
          makei915 "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux" "${ROOT_PATH}/intel-gpu-i915-backports" "${ROOT_PATH}/modules/update"

          # 对齐 RR 官方 cks.yml 流程（RR 无 relocateDupUpdate）：根目录布局由 defines
          # 天然决定（update/-only 模块 =n，makemodules 不产根目录副本），makei915
          # 无条件输出 update/ 栈，下方 cp -rf 保留根目录 + update/ 双套，与 RR 官方一致。
          mkdir -p "${ROOT_PATH}/output/modules"
          cp -rf "${ROOT_PATH}/modules/"* "${ROOT_PATH}/output/modules/"


      - name: Tar to Artifacts
        run: |
          ROOT_PATH=${{ github.workspace }}
          VERSION=${{ matrix.version }}
          PLATFORM=${{ matrix.platform }}

          . ${ROOT_PATH}/ainas-modules/compile-ck.sh
          KVER="$(getKver "${ROOT_PATH}" "${VERSION}" "${PLATFORM}" "${ROOT_PATH}/dsm_linux")"

          # OFFICIAL_PATH 留空（对齐 RR）：check depends 纯缺口检测，产物 depends 缺口一律报 [E]，绝不从官方 hda1 拷贝
          # OFFICIAL_PATH="${ROOT_PATH}/syno-modules/official/hda1/${PLATFORM}-${VERSION}-${KVER}"
          OFFICIAL_PATH=""
          PARTY3RD_PATH="${ROOT_PATH}/ainas-cks/thirdparty/${PLATFORM}-${VERSION}-${KVER}"

          echo "copy 3rd modules"
          [ -d "${PARTY3RD_PATH}" ] && cp -rf ${PARTY3RD_PATH}/* ${ROOT_PATH}/output/modules/

          echo "check depends"
          for M in $(ls ${ROOT_PATH}/output/modules 2>/dev/null); do
            [ -d "${ROOT_PATH}/output/modules/${M}" ] && continue # 跳过子目录（update/），避免把目录当模块名误报 [E] depends does not exist
            function _copydepends() {
              if [ ! -f "${ROOT_PATH}/output/modules/${1}" ] && [ ! -f "${ROOT_PATH}/output/modules/update/${1}" ] && [ ! -f "${OFFICIAL_PATH/hda1/rd}/${1}" ]; then
                if [ -f "${OFFICIAL_PATH}/${1}" ]; then
                  echo "[W] '${PLATFORM}-${KVER}' - '${M}' depends '${1}' copied from official hda1"
                  cp -f "${OFFICIAL_PATH}/${1}" "${ROOT_PATH}/output/modules"
                else
                  echo "[E] '${PLATFORM}-${KVER}' - '${M}' depends '${1}' does not exist."
                fi
              fi
              D=""
              [ -z "${D}" ] && [ -f "${ROOT_PATH}/output/modules/${1}" ] && D="${ROOT_PATH}/output/modules/${1}"
              [ -z "${D}" ] && [ -f "${ROOT_PATH}/output/modules/update/${1}" ] && D="${ROOT_PATH}/output/modules/update/${1}"
              [ -z "${D}" ] && [ -f "${OFFICIAL_PATH/hda1/rd}/${1}" ] && D="${OFFICIAL_PATH/hda1/rd}/${1}"
              if [ -n "${D}" ]; then
                depends=($(modinfo -F depends "${D}" 2>/dev/null | sed 's/,/ /g')) || true
                if [ ${#depends[*]} -gt 0 ]; then
                  for k in ${depends[@]}; do
                    { [ -f "${ROOT_PATH}/output/modules/${k}.ko" ] || [ -f "${ROOT_PATH}/output/modules/update/${k}.ko" ]; } && continue # Recursively skip wext-priv and wext-core dependencies on each other.
                    _copydepends "${k}.ko"
                  done
                fi
              fi
            }
            _copydepends "${M}"
          done

          # 生成 modules.dep 供 DSM/BusyBox modprobe 解析硬依赖；当前 CKS 自编
          # i40e 使用 intel_auxiliary 总线，必须先加载 intel_auxiliary.ko 再加载 i40e.ko。
          # 依赖关系从最终 .ko 的 modinfo 读取，不混用官方 auxiliary ABI。
          MODULES_DIR="${ROOT_PATH}/output/modules"
          DEPFILE="${MODULES_DIR}/modules.dep"
          rm -f "${DEPFILE}"
          for M in "${MODULES_DIR}"/*.ko; do
            [ -f "${M}" ] || continue
            DEPS=""
            for D in $(modinfo -F depends "${M}" 2>/dev/null | sed 's/,/ /g'); do
              DEPS="${DEPS} ${D}.ko"
            done
            printf '%s:%s\n' "$(basename "${M}")" "${DEPS}" >>"${DEPFILE}"
          done
          if [ -f "${MODULES_DIR}/i40e.ko" ]; then
            I40E_DEPS="$(modinfo -F depends "${MODULES_DIR}/i40e.ko" 2>/dev/null | sed 's/,/ /g')"
            echo " ${I40E_DEPS} " | grep -q " intel_auxiliary " || {
              echo "[E] i40e.ko does not depend on intel_auxiliary" >&2
              exit 1
            }
            [ -f "${MODULES_DIR}/intel_auxiliary.ko" ] || {
              echo "[E] i40e.ko depends on missing intel_auxiliary.ko" >&2
              exit 1
            }
            grep -q '^i40e\.ko:.*intel_auxiliary\.ko' "${DEPFILE}" || {
              echo "[E] modules.dep missing i40e -> intel_auxiliary" >&2
              exit 1
            }
          fi

          tar -zcf ${ROOT_PATH}/modules-${PLATFORM}-${VERSION}-${KVER}.tgz -C ${ROOT_PATH}/output/modules .
          gzip -c ${ROOT_PATH}/output/bzImage >${ROOT_PATH}/bzImage-${PLATFORM}-${VERSION}-${KVER}.gz

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ainas-cks-test-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            *.tgz
            *.gz
