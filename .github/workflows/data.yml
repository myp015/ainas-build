name: Data

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      push:
        description: "push"
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: main

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Get Data
        run: |
          REPO="https://github.com/RROrg/rr"
          PRERELEASE="true"

          TAG=""
          for i in {1..3}; do
            if [ "${PRERELEASE}" = "true" ]; then
              TAG="$(curl -skL --connect-timeout 10 "${REPO}/tags" | grep "/refs/tags/.*\.zip" | sed -E 's/.*\/refs\/tags\/(.*)\.zip.*$/\1/' | sort -rV | head -1 | sed 's/^[v|V]//g')"
            else
              TAG="$(curl -skL --connect-timeout 10 -w "%{url_effective}" -o /dev/null "${REPO}/releases/latest" | awk -F'/' '{print $NF}' | sed 's/^[v|V]//g')"
            fi
            rm -f rr-${TAG}.img.zip
            STATUS=$(curl -kL --connect-timeout 10 -w "%{http_code}" "${REPO}/releases/download/${TAG}/rr-${TAG}.img.zip" -o "rr-${TAG}.img.zip")
            if [ $? -eq 0 ] && [ ${STATUS:-0} -eq 200 ]; then
              break
            else
              echo "Download failed, retry $i/3"
              sleep 60
            fi
          done
          if [ ! -f "rr-${TAG}.img.zip" ] || [ ${STATUS:-0} -ne 200 ]; then
            echo "Download failed after 3 attempts"
            exit 1
          fi

          unzip rr-${TAG}.img.zip -d rr rr.img

          sudo apt update
          sudo apt install -y locales busybox dialog gettext sed gawk jq curl 
          sudo apt install -y python-is-python3 python3-pip libelf-dev qemu-utils cpio xz-utils lz4 lzma bzip2 gzip zstd
          sudo apt install -y build-essential libtool pkgconf libzstd-dev liblzma-dev libssl-dev  # kmodule dependencies

          # Backup the original python3 executable.
          sudo mv -f "$(realpath $(which python3))/EXTERNALLY-MANAGED" "$(realpath $(which python3))/EXTERNALLY-MANAGED.bak" 2>/dev/null || true
          sudo pip3 install -U -r scripts/requirements.txt

          . scripts/func.sh

          LOOPX=$(sudo losetup -f)
          sudo losetup -P "${LOOPX}" "rr/rr.img"
          rm -rf "/tmp/mnt/p3"
          mkdir -p "/tmp/mnt/p3"
          sudo mount "${LOOPX}p3" "/tmp/mnt/p3"

          # 只流式提取 initrd 内的 opt/rr/platforms.yml，避免完整解包整个 initrd 导致超时
          INITRD_FMT=$(sudo file -b --mime-type /tmp/mnt/p3/initrd-rr)
          echo "[INFO] initrd format: ${INITRD_FMT}"
          mkdir -p rr/initrd/opt/rr
          case "${INITRD_FMT}" in
            *'x-cpio'*)  (cat /tmp/mnt/p3/initrd-rr | cpio -i --to-stdout opt/rr/platforms.yml > rr/initrd/opt/rr/platforms.yml) ;;
            *'x-xz'*)    (xz -dc /tmp/mnt/p3/initrd-rr | cpio -i --to-stdout opt/rr/platforms.yml > rr/initrd/opt/rr/platforms.yml) ;;
            *'x-lz4'*)   (lz4 -dc /tmp/mnt/p3/initrd-rr | cpio -i --to-stdout opt/rr/platforms.yml > rr/initrd/opt/rr/platforms.yml) ;;
            *'x-lzma'*)  (lzma -dc /tmp/mnt/p3/initrd-rr | cpio -i --to-stdout opt/rr/platforms.yml > rr/initrd/opt/rr/platforms.yml) ;;
            *'x-bzip2'*) (bzip2 -dc /tmp/mnt/p3/initrd-rr | cpio -i --to-stdout opt/rr/platforms.yml > rr/initrd/opt/rr/platforms.yml) ;;
            *'gzip'*)    (gzip -dc /tmp/mnt/p3/initrd-rr | cpio -i --to-stdout opt/rr/platforms.yml > rr/initrd/opt/rr/platforms.yml) ;;
            *'zstd'*)    (zstd -dc /tmp/mnt/p3/initrd-rr | cpio -i --to-stdout opt/rr/platforms.yml > rr/initrd/opt/rr/platforms.yml) ;;
            *) echo "[E] unsupported initrd format: ${INITRD_FMT}"; exit 1 ;;
          esac
          if [ ! -s "rr/initrd/opt/rr/platforms.yml" ]; then
            echo "[E] platforms.yml 提取失败（可能路径/格式不符）"
            exit 1
          fi
          echo "[INFO] platforms.yml extracted: $(wc -c < rr/initrd/opt/rr/platforms.yml) bytes"

          sudo umount "/tmp/mnt/p3"
          sudo losetup -d "${LOOPX}"
          rm -rf "/tmp/mnt/p3"

          # 仅生成 pats（models/addons/modules 不再生成）
          mkdir -p docs
          python3 scripts/func.py getpats -w "rr/initrd" -j "docs/pats.json" -x "docs/pats.xlsx"

          rm -rf "rr/initrd"

      - name: Upload to Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pats
          path: |
            docs/pats.json
            docs/pats.xlsx
          retention-days: 5

      - name: Check and Push
        if: success() && inputs.push == true
        run: |
          echo "Git push ..."
          status=$(git status --short | awk '$2 ~ /^docs\// {printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update $(date +%Y-%m-%d" "%H:%M:%S)"
            git push origin HEAD:main
          else
            echo "docs 无变化，跳过提交"
          fi
