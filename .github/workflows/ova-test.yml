#
# 模块逐测工作流（ova.yml 的测试版副本，不修改正式 OVA 流程）
#
# 与 ova.yml 的差异：
#   1. 公共 base 上传到独立 Release（test-ova-<source>-<tag>），与正式 ova 工作流
#      的 Release/资产名隔离，跨 run 复用；
#   2. rr_source 支持 both（ainas 与 RROrg 同环境双跑，供启动日志对比）；
#   3. 安装完成后不导出 OVA，改为复用已安装的 rr.img + data.qcow2
#      逐 profile 重启 DSM，采集启动日志；
#   4. modtest profile 挂载引导盘 p3（/dev/synoboot3, ext4），安全档逐个 insmod 模块，
#      结果经串口回读；
#   5. 可选 SCSI 控制器 profile（virtio-scsi / megaraid / mptsas）验证驱动；
#      「仅 SAS 两型」= megaraid + mptsas；采集后由 check_scsi_result.py 做
#      驱动加载/盘识别/崩溃归因门禁（崩溃硬失败，识别问题只报告）；
#      可选 nic profile 给虚拟机挂 6 块不同型号的虚拟网卡（virtio-net/e1000/
#      e1000e/rtl8139/vmxnet3/ne2k_pci），逐个验证驱动绑定与 DHCP 取 IP
#      （表见 modtest/nic-models.tsv，门禁见 check_nic_result.py）。
#      驱动优先从测试包 insmod；官方 5.10 内核把这几种编成内建（=y），此时
#      insmod 会被同名符号拒绝，验证到的是内建驱动路径，属预期。
#      额外网卡会改变 DSM 的网口编号（主 virtio 不再是被安装时记录的 eth0），
#      Web 端口转发可能不通，所以 nic profile 用 soft 模式等待 Web——超时不
#      阻塞，串口测试本身不依赖 Web；
#   6. use_prebuilt=true 时直接复用正式发布 Release 里已安装的成品 OVA
#      （ainas-ova-<tag> / RROrg-ova-<tag>），跳过 base 构建与 DSM 安装，
#      仍从 syno-modules 取同一份模块包注入 p3 后逐模块测试。
#   7. all_platforms=true 时按 modtest/platform-representatives.tsv 每个平台
#      取一个代表型号（与 test_models 互斥）；表与 models.json 覆盖不一致即失败。
#   8. run_bootlog_gate=true 时用 check_bootlog.py 核对 base/SCSI/nic 启动日志
#      与安装期日志里的模块/LKM 异常（Unknown symbol/vermagic/崩溃硬失败，
#      BUILTIN_DUP 按 env-fail-allowlist 降级，固件/modprobe/taint 只报告）。
#
# 阶段 1 默认：rr_source=ainas、test_models=SA6400、scsi_profiles=跳过。
name: Build RR-OVA Test

on:
  workflow_dispatch:
    inputs:
      rr_source:
        description: "RR 源"
        type: choice
        options:
          - ainas
          - RROrg
          - both
        default: ainas
      test_models:
        description: "测试型号（逗号分隔，阶段 1 只填 SA6400；all_platforms 打开时忽略）"
        type: string
        default: "SA6400"
      all_platforms:
        description: "全平台：按代表型号表每个平台跑一个型号（优先，忽略 test_models）"
        type: boolean
        default: false
      custom_models:
        description: "自定义型号（工作流未列出的，多个用逗号分隔）"
        type: string
        default: ""
      rr_version:
        description: "RR version（留空=latest）"
        type: string
        default: ""
      dsm_version:
        description: "DSM 版本编号（仅 7.x）"
        type: choice
        options:
          - "7.0"
          - "7.1"
          - "7.2.1"
          - "7.2.2"
          - "7.3.0"
          - "7.3.1"
          - "7.3.2"
          - "7.4.1"
        default: "7.4.1"
      scsi_profiles:
        description: "SCSI 虚拟设备 profile"
        type: choice
        options:
          - "跳过"
          - "全部三型"
          - "仅 SAS 两型"
          - "仅 virtio-scsi"
          - "仅 megaraid"
          - "仅 mptsas"
        default: "跳过"
      run_base_profile:
        description: "先跑 base 基线（关闭可省一次启动，仅做模块验证时建议关闭）"
        type: boolean
        default: true
      run_module_test:
        description: "逐个 insmod 模块（安全档）"
        type: boolean
        default: true
      module_limit:
        description: "只测清单前 N 个模块（0=全部，CI smoke 建议 20）"
        type: string
        default: "0"
      run_nic_profile:
        description: "额外虚拟网卡取 IP 验证（6 种 QEMU 网卡，见 modtest/nic-models.tsv）"
        type: boolean
        default: false
      run_bootlog_gate:
        description: "启动日志模块/LKM 异常核对（未知符号/vermagic/崩溃硬失败）"
        type: boolean
        default: false
      boot_timeout:
        description: "安装阶段引导等待秒数"
        type: string
        default: "360"
      overwrite_base:
        description: "覆盖测试版 base（默认复用 Release 中已存在的 base）"
        type: boolean
        default: false
      use_prebuilt:
        description: "复用已安装的成品 OVA（跳过 base 构建与 DSM 安装）"
        type: boolean
        default: false
      prebuilt_versions:
        description: "各源成品 OVA 版本（ainas=26.11.0,RROrg=26.9.0）"
        type: string
        default: "ainas=26.11.0,RROrg=26.9.0"
      modules_version:
        description: "模块包版本（留空=取 myp015/syno-modules 最新 Release）"
        type: string
        default: ""
      kernel:
        description: "内核类型（custom=ainas-cks 自编 5.10.55，需非预装）"
        type: choice
        options:
          - official
          - custom
        default: official
      cks_version:
        description: "ainas-cks Release 版本（custom 时有效；留空=用 rr.img p3 内置 cks 快照）"
        type: string
        default: ""

jobs:
  # 解析源版本、型号→平台映射，生成两个 matrix。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      base_tasks: ${{ steps.plan.outputs.base_tasks }}
      tasks: ${{ steps.plan.outputs.tasks }}
      task_count: ${{ steps.plan.outputs.task_count }}
      source_mode: ${{ steps.plan.outputs.source_mode }}
    steps:
      - uses: actions/checkout@v7

      - name: checkout ainas-2in1（读取 models.json）
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1-plan

      # 门禁脚本自带夹具自测：宁可 plan 阶段失败，也不要带着解析缺陷跑整轮矩阵。
      - name: 门禁脚本自测
        shell: bash
        run: |
          set -euo pipefail
          python3 -I .github/scripts/modtest/parse_results.py --selftest
          python3 -I .github/scripts/modtest/check_scsi_result.py --selftest
          python3 -I .github/scripts/modtest/check_bootlog.py --selftest

      - name: 规划源与测试任务
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AiNas }}
          RR_SOURCE: ${{ inputs.rr_source }}
          RR_VERSION: ${{ inputs.rr_version }}
          DSM_VERSION: ${{ inputs.dsm_version }}
          # all_platforms=true 时由脚本忽略 test_models（GitHub 表达式里
          # `x && '' || y` 的空串是假值，无法可靠置空，所以判断放脚本里）。
          TEST_MODELS: ${{ inputs.test_models }}
          ALL_PLATFORMS: ${{ inputs.all_platforms }}
          CUSTOM_MODELS: ${{ inputs.custom_models }}
          USE_PREBUILT: ${{ inputs.use_prebuilt }}
          PREBUILT_VERSIONS: ${{ inputs.prebuilt_versions }}
          MODULES_VERSION: ${{ inputs.modules_version }}
          KERNEL: ${{ inputs.kernel }}
          CKS_VERSION: ${{ inputs.cks_version }}
          MODELS_JSON: .2in1-plan/script/models.json
        run: bash .github/scripts/plan_test_sources.sh

  # 公共 base：每个源只做一次，上传到独立 test Release 供跨 run 复用。
  # 预装成品模式不需要 base（直接用已安装 OVA），整个 job 跳过。
  prepare-base:
    name: prepare-base (${{ matrix.source }})
    needs: [plan]
    if: ${{ inputs.use_prebuilt != true }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.base_tasks) }}
    env:
      RR_ASSET_URL: ${{ matrix.rr_asset_url }}
      RR_TAG: ${{ matrix.rr_tag }}
      SOURCE: ${{ matrix.source }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      BASE_ASSET: ${{ matrix.base_asset }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查是否复用已有 base
        id: check
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          OVERWRITE_BASE: ${{ inputs.overwrite_base }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RR_TAG:?缺少 RR_TAG}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          # Release 可能尚不存在：先创建（重试覆盖 GitHub 短暂 5xx）
          for attempt in $(seq 1 12); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "[INFO] Release 已存在: $RELEASE_TAG"
              break
            fi
            echo "[INFO] 创建测试 Release: $RELEASE_TAG（第 ${attempt} 次）"
            if gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" \
                --notes "模块逐测工作流专用 base（与正式 ova 流程隔离）" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || {
            echo "[E] Release $RELEASE_TAG 创建/确认失败" >&2; exit 1; }

          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          EXISTS="false"
          if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "$BASE_ASSET" \
             || printf '%s\n' "$ASSET_NAMES" | grep -Fxq "${BASE_ASSET}.part.000"; then
            EXISTS="true"
          fi

          if [ "$EXISTS" = "true" ] && [ "${OVERWRITE_BASE:-false}" != "true" ]; then
            echo "[INFO] 已存在 ${BASE_ASSET}，复用（未勾选覆盖）"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] 需要构建 base（exists=${EXISTS} overwrite=${OVERWRITE_BASE:-false}）"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout ainas-2in1
        if: steps.check.outputs.rebuild == 'true'
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载 RR 镜像
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${RR_TAG:?缺少 RR_TAG}"
          : "${RR_ASSET_URL:?缺少 RR_ASSET_URL}"
          curl -fsSL --connect-timeout 10 "$RR_ASSET_URL" -o "rr-${RR_TAG}.zip"
          unzip -q "rr-${RR_TAG}.zip" -d rr rr.img

      # 测试工作流不需要品牌化，跳过耗时步骤：
      #   patch_cpuinfo（cpuinfo 补丁）
      #   patch_ram（unpackInitrd → 语言文件 / rr menu.sh 升级菜单 → repackInitrd）
      # 只做资产完整性检查后直接压缩上传。
      - name: 构建公共 base（跳过 cpuinfo/initrd 补丁）
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PART3_PATH="/mnt/p3"

          . "$AINAS2IN1_DIR/script/2in1func.sh"

          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd >/dev/null

          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          for _ in $(seq 1 40); do [ -b "${DISK_LOOP}p3" ] && break; sleep 0.25; done
          [ -b "${DISK_LOOP}p3" ] || { echo "[E] 镜像分区未就绪：${DISK_LOOP}p3" >&2; exit 1; }
          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"

          for d in cks lkms addons modules; do
            if [ ! -d "${PART3_PATH}/${d}" ] || [ -z "$(ls -A "${PART3_PATH}/${d}")" ]; then
              echo "[E] rr.img 的 p3 缺少内置资产目录或为空: ${d}" >&2
              exit 1
            fi
          done

          echo "[INFO] 跳过 patch_cpuinfo / patch_ram（测试工作流无需品牌化与 initrd 补丁）"

          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          sudo rm -rf "$PART3_PATH"

          rm -rf "$AINAS2IN1_DIR"

          zstd -3 -T0 -q -f rr/rr.img -o ova-base.img.zst

      - name: 上传 base 到测试 Release
        if: steps.check.outputs.rebuild == 'true'
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"

          mv -f ova-base.img.zst "$BASE_ASSET"
          SIZE=$(stat -c%s "$BASE_ASSET")
          echo "[INFO] base 大小=${SIZE} 字节"
          UPLOAD_FILES=()
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "[INFO] 超过 GitHub 单文件 2GB 上限，按 1900MB 分卷"
            rm -f "${BASE_ASSET}.part."*
            split -b 1900M -d -a 3 "$BASE_ASSET" "${BASE_ASSET}.part."
            UPLOAD_FILES=("${BASE_ASSET}".part.*)
          else
            UPLOAD_FILES=("$BASE_ASSET")
          fi

          # 先删除同名旧资产，避免单文件/分卷形态切换后残留旧内容
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$BASE_ASSET"|"$BASE_ASSET".part.*) gh release delete-asset "$RELEASE_TAG" "$name" --yes ;;
            esac
          done

          # 并发 run 共享同一 base Release：两个 run 可能同时删/传同名资产，GitHub
          # 会返回 404/422（run 41930493385 实测 uploads 404）。重试并用 --clobber
          # 覆盖对端残留，避免把基础设施竞态当成构建失败。
          for attempt in $(seq 1 3); do
            if gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}" --clobber; then
              break
            fi
            if [ "${attempt}" = "3" ]; then
              echo "[E] base 上传失败（已重试 3 次）" >&2
              exit 1
            fi
            echo "[WARN] base 上传失败（第 ${attempt} 次），15s 后重试" >&2
            sleep 15
          done
          echo "[INFO] base 已上传到测试 Release: ${RELEASE_TAG}"

  build-install:
    name: ${{ format('install+test ({0}/{1})', matrix.source, matrix.model) }}
    needs: [plan, prepare-base]
    # prepare-base 在预装模式下会被跳过；默认的 needs 语义会连带跳过本 job，
    # 因此显式允许 skipped。
    if: ${{ always() && needs.plan.result == 'success' && (needs.prepare-base.result == 'success' || needs.prepare-base.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # 历史实测正常 job 20~50 分钟；给 120 分钟兜底，避免托管 runner 静默失联时
    # 一直拖到 6 小时默认上限（2026-11-06、2026-11-07 两轮共 12 个 job 都是
    # 卡在安装/采集步骤后被 runner lost communication 打断，无任何日志）。
    # 超时后 always() 的收尾/上传步骤仍会执行，能拿到现场。
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      LANGUAGE: zh_CN
      AINAS_KERNEL: ${{ inputs.kernel }}
      KERNEL: ${{ inputs.kernel }}
      CKS_VERSION: ${{ inputs.cks_version }}
      ADDONS: acpid,reboottoloader,addincards,cpuinfo,expands,diskcompat,lsiutil,nvmevolume,powersched,remotefs,storagepanel,smartctl,trivial,apppatch,vmtools
      LINE: ${{ inputs.dsm_version }}
      SOURCE: ${{ matrix.source }}
      MODEL: ${{ matrix.model }}
      PLATFORM: ${{ matrix.platform }}
      KVER: ${{ matrix.kver }}
      MODULES_KEY: ${{ matrix.modules_key }}
      TAG: ${{ matrix.rr_tag }}
      RR_TAG: ${{ matrix.rr_tag }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      BASE_ASSET: ${{ matrix.base_asset }}
      RR_DOCKER_IMAGE: ${{ matrix.docker_image }}
      RR_DOCKER_TAG: ${{ matrix.docker_tag }}
      OVA_RELEASE_TAG: ${{ matrix.ova_release_tag }}
      OVA_ASSET_GLOB: ${{ matrix.ova_asset_glob }}
      MODULES_RELEASE_TAG: ${{ matrix.modules_release_tag }}
      SCSI_PROFILES: ${{ inputs.scsi_profiles }}
      RUN_BASE_PROFILE: ${{ inputs.run_base_profile }}
      RUN_MODULE_TEST: ${{ inputs.run_module_test }}
      RUN_NIC_PROFILE: ${{ inputs.run_nic_profile }}
      RUN_BOOTLOG_GATE: ${{ inputs.run_bootlog_gate }}
      PREBUILT: ${{ inputs.use_prebuilt }}
      MODULE_LIMIT: ${{ inputs.module_limit }}
      BOOT_TIMEOUT: ${{ inputs.boot_timeout }}
    steps:
      - uses: actions/checkout@v7

      - name: 初始化环境
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: checkout ainas-2in1
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: .2in1

      - name: 下载公共 base（测试 Release）
        if: inputs.use_prebuilt != true
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${RELEASE_TAG:?缺少 RELEASE_TAG}"
          : "${BASE_ASSET:?缺少 BASE_ASSET}"
          export GH_TOKEN="$ACTION_TOKEN"
          export GH_REPO="myp015/ainas-2in1"
          mkdir -p base

          NAMES="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$NAMES" | grep -Fxq "$BASE_ASSET"; then
            gh release download "$RELEASE_TAG" --pattern "$BASE_ASSET" --dir base
          else
            printf '%s\n' "$NAMES" | grep -Fxq "${BASE_ASSET}.part.000" || {
              echo "[E] Release $RELEASE_TAG 中没有 ${BASE_ASSET}（及其分卷）" >&2
              exit 1; }
            gh release download "$RELEASE_TAG" --pattern "${BASE_ASSET}.part.*" --dir base
            cat base/"${BASE_ASSET}".part.* > base/"${BASE_ASSET}"
            rm -f base/"${BASE_ASSET}".part.*
          fi

      - name: 编译镜像并安装 DSM
        if: inputs.use_prebuilt != true
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail

          WORKDIR="$PWD"
          AINAS2IN1_DIR="${WORKDIR}/.2in1"
          PAT_JSON_URL="https://raw.githubusercontent.com/myp015/ainas-rr/main/docs/pats.json"
          PAT_JSON="/tmp/pats.json"
          DSM_INSTALL_DIR="/tmp/dsm-install"
          PART1_PATH="/mnt/p1"
          PART3_PATH="/mnt/p3"

          . "$AINAS2IN1_DIR/script/2in1func.sh"

          LINE_REQ="${LINE:-7.4.1}"
          export LINE_REQ
          if echo "${MODEL}" | grep -Eq '^(DS925\+|DS425\+)$' && [ "${LINE_REQ}" = "7.2.1" ]; then
            echo "[INFO] ${MODEL} 不支持 DSM 7.2.1，自动切换到 7.2.2"
            LINE_REQ="7.2.2"
          fi

          VERSION="$(pick_dsm_version "${LINE_REQ}")"
          VER_MAIN="${VERSION%%-*}"
          VER_MAIN_NODOT="${VER_MAIN//./}"
          VER_BUILD="${VERSION#*-}"
          VER_BUILD="${VER_BUILD%%-*}"
          VER_SLUG="${VER_MAIN_NODOT}_${VER_BUILD}"
          SAFE_TAG="${TAG//./_}"
          echo "SAFE_TAG=${SAFE_TAG}" >> "$GITHUB_ENV"

          if [ "${SOURCE}" = "RROrg" ]; then
            ARTIFACT_BRAND="_RROrg"
          else
            ARTIFACT_BRAND="_ainas"
          fi
          ARTIFACT="${MODEL}_${VER_SLUG}${ARTIFACT_BRAND}_${SAFE_TAG}"
          echo "[INFO] 型号=${MODEL} 目标DSM版本=${VERSION} 源=${SOURCE} 平台=${PLATFORM} 内核=${KVER}"

          echo "[INFO] 安装构建依赖"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext cpio zstd dosfstools rsync qemu-utils >/dev/null

          mkdir -p rr
          zstd -d -q -f "base/${BASE_ASSET}" -o rr/rr.img
          rm -rf base

          # 测试流程不改 grub.cfg：patch_part1 的 rr 变体只替换菜单标题/欢迎文案，
          # 不改变启动项与内核路径；引导由 dsm_setup 传参数直达。跳过可省一次
          # p1 挂载与改写（正式 OVA 构建仍照常修补）。
          echo "[INFO] 测试工作流跳过 patch_part1（不改 grub.cfg）"

          DISK_LOOP=$(sudo losetup -f)
          sudo losetup -P "$DISK_LOOP" rr/rr.img
          for _ in $(seq 1 40); do [ -b "${DISK_LOOP}p3" ] && break; sleep 0.25; done
          [ -b "${DISK_LOOP}p3" ] || { echo "[E] 镜像分区未就绪：${DISK_LOOP}p3" >&2; exit 1; }
          sudo mkdir -p "$PART1_PATH" "$PART3_PATH"

          # ── 自定义内核：先由宿主机准备 p3/cks ─────────────────────
          # docker_build 会在容器内自行挂载 p3（宿主此时不能持有挂载），
          # 所以覆盖/校验/取指纹必须在 docker_build 之前完成并 umount。
          CKS_KEY="${PLATFORM}-${LINE%.*}-${KVER}"
          if [ "${KERNEL}" = "custom" ]; then
            : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
            echo "[INFO] 自定义内核资产: ${CKS_KEY}"
            sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
            [ -d "$PART3_PATH/cks" ] || {
              echo "[E] rr.img 的 p3 缺少 cks 目录" >&2; exit 1; }

            if [ -n "${CKS_VERSION}" ]; then
              echo "[INFO] 用 ainas-cks ${CKS_VERSION} 覆盖 p3/cks（仅取本平台三件套）"
              CKS_DL="$WORKDIR/.cks-dl"
              rm -rf "$CKS_DL"
              mkdir -p "$CKS_DL/pkg"
              export GH_TOKEN="$ACTION_TOKEN"
              GH_REPO=myp015/ainas-cks gh release download "${CKS_VERSION}" \
                --pattern "ainas-cks-${CKS_VERSION}.zip" --dir "$CKS_DL"
              CKS_ZIP="$CKS_DL/ainas-cks-${CKS_VERSION}.zip"
              [ -f "$CKS_ZIP" ] || {
                echo "[E] 未下载到 ainas-cks-${CKS_VERSION}.zip" >&2; exit 1; }
              unzip -o -j "$CKS_ZIP" \
                "bzImage-${CKS_KEY}.gz" "modules-${CKS_KEY}.tgz" "firmware.tgz" \
                -d "$CKS_DL/pkg" >/dev/null
              sudo rm -rf "$PART3_PATH/cks"
              sudo mkdir -p "$PART3_PATH/cks"
              sudo cp "$CKS_DL/pkg/bzImage-${CKS_KEY}.gz" \
                      "$CKS_DL/pkg/modules-${CKS_KEY}.tgz" \
                      "$CKS_DL/pkg/firmware.tgz" "$PART3_PATH/cks/"
              rm -rf "$CKS_DL"
            fi

            for f in "bzImage-${CKS_KEY}.gz" "modules-${CKS_KEY}.tgz" "firmware.tgz"; do
              [ -f "$PART3_PATH/cks/$f" ] || {
                echo "[E] p3/cks 缺少 ${f}（平台/DSM/内核=${CKS_KEY}）" >&2; exit 1; }
            done

            # 运行期身份判据：从 bzImage 提取 version/UTS，供门禁比对 /proc/version
            gzip -dc "$PART3_PATH/cks/bzImage-${CKS_KEY}.gz" > /tmp/cks-bzImage
            mkdir -p "$WORKDIR/modtest-meta"
            file -b /tmp/cks-bzImage > "$WORKDIR/modtest-meta/cks-image-info.txt"
            cat "$WORKDIR/modtest-meta/cks-image-info.txt"
            grep -q ", version " "$WORKDIR/modtest-meta/cks-image-info.txt" || {
              echo "[E] cks-image-info 无法解析: $(cat "$WORKDIR/modtest-meta/cks-image-info.txt")" >&2
              exit 1; }
            rm -f /tmp/cks-bzImage
            sudo umount "$PART3_PATH"
          fi

          # ── 官方内核：编译前把 p3/modules 的本平台包换成待测 Release ────
          # base rr.img 是某个 RR Release 的快照，p3 里的模块包可能早于本次
          # 待测版本（旧模块的依赖面/内置判定都会变化，直接测会误报）。这里
          # 与预装模式（prepare_prebuilt.sh）保持一致，统一测同一份模块包。
          if [ "${KERNEL}" != "custom" ]; then
            : "${MODULES_RELEASE_TAG:?缺少 MODULES_RELEASE_TAG}"
            echo "[INFO] 覆盖模块包: ${MODULES_RELEASE_TAG}（只取 ${MODULES_KEY}.tgz）"
            sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
            MODPKG_DIR="$WORKDIR/.modules-pkg"
            rm -rf "$MODPKG_DIR"
            mkdir -p "$MODPKG_DIR"
            export GH_TOKEN="$ACTION_TOKEN"
            GH_REPO=myp015/syno-modules gh release download "${MODULES_RELEASE_TAG}" \
              --pattern "modules-*.zip" --dir "$MODPKG_DIR"
            MODZIP="$(find "${MODPKG_DIR}" -maxdepth 1 -name 'modules-*.zip' | head -n1)"
            [ -n "${MODZIP}" ] || {
              echo "[E] 未下载到 modules-*.zip（${MODULES_RELEASE_TAG}）" >&2; exit 1; }
            unzip -o -j "${MODZIP}" "${MODULES_KEY}.tgz" -d "$MODPKG_DIR" >/dev/null
            MOD_TGZ="${MODPKG_DIR}/${MODULES_KEY}.tgz"
            [ -f "${MOD_TGZ}" ] || {
              echo "[E] modules zip 中缺少 ${MODULES_KEY}.tgz" >&2; exit 1; }
            sudo mkdir -p "$PART3_PATH/modules"
            sudo cp -f "${MOD_TGZ}" "$PART3_PATH/modules/${MODULES_KEY}.tgz"
            sudo umount "$PART3_PATH"
            rm -rf "$MODPKG_DIR"
          fi

          docker_build rr "$MODEL" "$VERSION" "$LANGUAGE" "$ADDONS" "$RR_DOCKER_TAG" \
            "$WORKDIR"

          sudo mkdir -p "$PART3_PATH"
          sudo mount "${DISK_LOOP}p3" "$PART3_PATH"
          sudo rm -rf "$PART3_PATH/dl" "$PART3_PATH/auxfiles" "$PART3_PATH/logs"
          # 测试工作流不裁剪 p3：modules/ 与 lkms/ 保留全平台模块（约 1.4G），
          # guest 挂载引导盘 p3 即可直接取用本平台模块包。正式 ova.yml 仍走裁剪。
          echo "[INFO] 测试工作流跳过 trim_p3_assets（保留全平台 modules/lkms/cks）"
          [ -d "$PART3_PATH/modules" ] && [ -d "$PART3_PATH/lkms" ] || {
            echo "[E] p3 缺少 modules/lkms 目录" >&2; exit 1; }
          # 测试流程的引导由 dsm_setup 传内核参数直达，不依赖交互菜单；
          # initrd-rr 解包/精简 menu.sh/重打包纯属发布产物优化，跳过可省
          # 一次 unpackInitrd+repackInitrd（大镜像下耗时明显）。
          echo "[INFO] 测试工作流跳过 rr_menu_apply（不改 initrd-rr）"

          # ── 取出本平台模块包，供模块测试盘使用 ──────────────────────
          MODS_DIR="${PART3_PATH}/modules"
          SELECTED=""
          if [ "${KERNEL}" = "custom" ]; then
            # custom 内核必须用 cks 内的模块包（与 bzImage 同源），并覆盖
            # p3/modules 同名包，保证 guest 侧统一按 modules/<key>.tgz 读取。
            SELECTED="${PART3_PATH}/cks/modules-${MODULES_KEY}.tgz"
            [ -f "${SELECTED}" ] || {
              echo "[E] p3/cks 缺少 modules-${MODULES_KEY}.tgz" >&2; exit 1; }
            sudo cp -f "${SELECTED}" "${MODS_DIR}/${MODULES_KEY}.tgz"
            echo "[INFO] 自定义内核模块包: $(basename "${SELECTED}")"
          else
            PREFERRED="${MODS_DIR}/${MODULES_KEY}.tgz"
            if [ -f "${PREFERRED}" ]; then
              SELECTED="${PREFERRED}"
            else
              SELECTED="$(find "${MODS_DIR}" -maxdepth 1 -type f -name "*${KVER}*.tgz" | sort | head -n1)"
            fi
            [ -n "${SELECTED}" ] || \
              SELECTED="$(find "${MODS_DIR}" -maxdepth 1 -type f -name '*.tgz' | sort | head -n1)"
            if [ -z "${SELECTED}" ]; then
              echo "[E] p3/modules 下未找到任何 .tgz（平台=${PLATFORM} 内核=${KVER}）" >&2
              exit 1
            fi
            echo "[INFO] 模块包: $(basename "${SELECTED}")"
          fi
          cp -f "${SELECTED}" "$WORKDIR/modules-test.tgz"

          # ── 模块测试清单与 guest 脚本写入 p3 ────────────────────────
          # DSM 会把额外 USB 存储命名为 synoboot（与引导盘冲突）、额外 ahci 盘
          # 触发 NCQ 错误，因此模块包直接从引导盘 p3 读取，结果经串口回读。
          # 清单同时保留一份在 $WORKDIR/modtest-meta 供门禁脚本解析并随 artifact 上传。
          # nic profile：额外虚拟网卡在启动时就位，guest 侧按表从测试包 insmod
          # 驱动并逐个取 IP（验证我们自己编的 .ko 能真实收发，而非内核内建的）。
          if [ "${RUN_NIC_PROFILE}" = "true" ]; then
            sudo mkdir -p "${PART3_PATH}/modtest"
            sudo cp .github/scripts/modtest/guest/run-nic-tests.sh "${PART3_PATH}/modtest/"
            sudo cp .github/scripts/modtest/nic-models.tsv "${PART3_PATH}/modtest/"
          fi
          if [ "${RUN_MODULE_TEST}" = "true" ]; then
            MODTEST_DIR="${PART3_PATH}/modtest"
            META_DIR="$WORKDIR/modtest-meta"
            sudo mkdir -p "${MODTEST_DIR}"
            # 不能 rm -rf：custom 内核在 docker_build 之前已把 cks-image-info.txt
            # 写进该目录，门禁 G-M7 需要它做运行期内核身份比对。
            mkdir -p "$META_DIR"
            sudo cp .github/scripts/modtest/guest/run-module-tests.sh "${MODTEST_DIR}/"
            bash .github/scripts/make_module_list.sh \
              "${SELECTED}" "$KVER" "$META_DIR" "${MODULE_LIMIT:-0}" "${PLATFORM}"
            sudo cp "$META_DIR/module-list.tsv" "${MODTEST_DIR}/module-list.tsv"
            pkg_sha="$(sha256sum "${SELECTED}" | cut -d' ' -f1)"
            payload_sha="$(sha256sum "$WORKDIR/modules-test.tgz" | cut -d' ' -f1)"
            entries="$(tar tzf "${SELECTED}" | grep -c '\.ko$' || true)"
            {
              echo "kernel=${KERNEL}"
              echo "source=${SOURCE}"
              echo "model=${MODEL}"
              echo "platform=${PLATFORM}"
              echo "line=${LINE}"
              echo "kver=${KVER}"
              echo "modules_key=${MODULES_KEY}"
              echo "package_path=${SELECTED}"
              echo "package_sha256=${pkg_sha}"
              echo "package_entries=${entries}"
              echo "test_payload_sha256=${payload_sha}"
              echo "profile=modtest"
            } > "$META_DIR/modtest-meta.txt"
            cat "$META_DIR/modtest-meta.txt"
          fi

          sudo umount "$PART3_PATH"
          sudo losetup --detach "$DISK_LOOP"
          rm -f "$WORKDIR/2in1func.sh"

          repack_rr rr/rr.img "$TAG" "$WORKDIR" "2.5GB"

          if [ ! -f "$WORKDIR/rr/rr.img" ]; then
            echo "[E] rr.img 不存在于 $WORKDIR/rr/rr.img" >&2
            exit 1
          fi
          dsm_setup "$MODEL" "$LINE_REQ" "$PAT_JSON_URL" "$DSM_INSTALL_DIR" \
            "$WORKDIR" \
            "$AINAS2IN1_DIR/docker/vm-docker-compose.yaml" "$WORKDIR/rr/docker-compose.yaml" \
            "${ARTIFACT_BRAND}" "$SAFE_TAG" "${BOOT_TIMEOUT}" \
            "s#file=/rr.img#file=/storage/alpine/rr.img#g"

          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
          rm -f "$WORKDIR/2in1func.sh"

      # 预装成品模式：下载已安装 OVA -> 还原 rr.img/data.qcow2 -> 注入模块包。
      # 跳过 base 构建与 DSM 安装（节省 20+ 分钟）。
      - name: 下载预装成品 OVA 并准备磁盘
        if: inputs.use_prebuilt == true
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
        run: |
          set -euo pipefail
          : "${ACTION_TOKEN:?缺少 ACTION_TOKEN}"
          : "${OVA_RELEASE_TAG:?缺少 OVA_RELEASE_TAG}"
          : "${OVA_ASSET_GLOB:?缺少 OVA_ASSET_GLOB}"
          export GH_TOKEN="$ACTION_TOKEN"
          bash .github/scripts/modtest/prepare_prebuilt.sh \
            "${SOURCE}" "${MODEL}" "${MODULES_KEY}" "${KVER}" \
            "${OVA_RELEASE_TAG}" "${OVA_ASSET_GLOB}" "${MODULES_RELEASE_TAG}" \
            "${RUN_MODULE_TEST}" "${MODULE_LIMIT:-0}" "${PLATFORM}"

      - name: 启动 profile 并采集日志
        shell: bash
        run: |
          set -euo pipefail

          LOG_DIR="/tmp/modtest-logs"
          CMD_DIR="${LOG_DIR}/cmds"
          mkdir -p "${CMD_DIR}"
          DRIVER="${PWD}/.2in1/script/dsm_serial_driver.py"
          COMPOSE="${PWD}/rr/docker-compose.yaml"

          [ -f "${COMPOSE}" ] || { echo "[E] 缺少已安装 compose: ${COMPOSE}" >&2; exit 1; }

          case "${SCSI_PROFILES}" in
            "全部三型") PROFILES="virtio-scsi megaraid mptsas" ;;
            "仅 SAS 两型") PROFILES="megaraid mptsas" ;;
            "仅 virtio-scsi") PROFILES="virtio-scsi" ;;
            "仅 megaraid") PROFILES="megaraid" ;;
            "仅 mptsas") PROFILES="mptsas" ;;
            "跳过"|"") PROFILES="" ;;
            *) echo "[E] 未知 scsi_profiles: ${SCSI_PROFILES}" >&2; exit 1 ;;
          esac

          run_one() {
            local profile="$1" cmd="$2" web_mode="${3:-strict}"
            echo "[INFO] profile=${profile} web_mode=${web_mode}"
            bash .github/scripts/modtest/run_profile.sh \
              "$PWD" "${COMPOSE}" "${profile}" \
              "${cmd}" "${LOG_DIR}" "${DRIVER}" "${web_mode}"
          }

          # 1) base：只做启动日志与设备基线（也是双源对比的干净基线）
          #    仅做模块验证时可关闭，省一次完整启动（约 3~4 分钟）
          if [ "${RUN_BASE_PROFILE}" = "true" ]; then
            cp .github/scripts/modtest/probe.commands "${CMD_DIR}/base.commands"
            run_one base "${CMD_DIR}/base.commands"
          fi

          # 2) modtest：挂载引导盘 p3，逐模块 insmod
          # 脚本在 p3 上，必须先由命令文件挂载，不能靠脚本自举
          if [ "${RUN_MODULE_TEST}" = "true" ]; then
            : "${MODULES_KEY:?缺少 MODULES_KEY}"
            printf '%s\n' \
              'echo "@@P|kernelid|begin"; uname -a; cat /proc/version; cat /proc/cmdline; cat /sys/devices/system/cpu/possible 2>/dev/null; cat /sys/devices/system/cpu/online 2>/dev/null; echo "@@P|kernelid|end"' \
              'echo "@@P|installed|begin"; for d in /usr/lib/modules /lib/modules/$(uname -r); do [ -d "$d" ] || continue; find "$d" -name "*.ko" 2>/dev/null; done | while read -r p; do n=${p##*/}; s=$(modinfo -F srcversion "$p" 2>/dev/null); [ -n "$s" ] || s=-; printf "%s\t%s\n" "$n" "$s"; done | sort -u; echo "@@P|installed|end"; echo "@@P|bootloaded|begin"; cut -d" " -f1 /proc/modules 2>/dev/null | sort -u; echo "@@P|bootloaded|end"' \
              'echo 1 > /proc/sys/kernel/syno_install_flag; mkdir -p /mnt/modtest; cd /dev; blkid synoboot3 2>&1; mount -t ext4 synoboot3 /mnt/modtest; rc=$?; echo "MODTEST_MOUNT_RC=$rc"; ls /mnt/modtest 2>&1 | head -n 20' \
              "sh /mnt/modtest/modtest/run-module-tests.sh ${MODULES_KEY}" \
              > "${CMD_DIR}/modtest.commands"
            run_one modtest "${CMD_DIR}/modtest.commands"
          fi

          # 3) nic：额外虚拟网卡取 IP（设备由 render_test_compose.sh 注入，
          #    驱动从 p3 测试包 insmod；命令文件必须先挂载 p3）
          #    web_mode=soft：额外网卡会把 DSM 的网口编号整体后移，安装时
          #    记录的 LAN1 口（eth0）在本次启动里可能变成别的设备，Web 端口
          #    转发因此可能不通；这里不阻塞，先用串口取现场再做断言。
          if [ "${RUN_NIC_PROFILE}" = "true" ]; then
            : "${MODULES_KEY:?缺少 MODULES_KEY}"
            printf '%s\n' \
              'echo 1 > /proc/sys/kernel/syno_install_flag; mkdir -p /mnt/modtest; cd /dev; blkid synoboot3 2>&1; mount -t ext4 synoboot3 /mnt/modtest; rc=$?; echo "NIC_MOUNT_RC=$rc"; ls /mnt/modtest 2>&1 | head -n 20' \
              'echo "@@NICDIAG|begin"; echo "--addr--"; ip -4 -o addr show 2>&1; echo "--route--"; ip route show 2>&1; echo "--netdev--"; for d in /sys/class/net/*; do [ -r "$d/address" ] || continue; echo "$(basename "$d") $(cat "$d/address") $(basename "$(readlink "$d/device/driver" 2>/dev/null)" 2>/dev/null || echo -)"; done; echo "--modules--"; for m in vmxnet3 e1000 e1000e ne2k_pci 8139cp virtio_net; do echo "$m srcversion=$(cat /sys/module/$m/srcversion 2>/dev/null || echo -) desc=$(modinfo -F description "$m" 2>/dev/null || echo -)"; done; echo "--listen--"; netstat -lnt 2>/dev/null | grep -E ":5000|:5001" || true; echo "@@NICDIAG|end"' \
              "sh /mnt/modtest/modtest/run-nic-tests.sh ${MODULES_KEY}" \
              > "${CMD_DIR}/nic.commands"
            run_one nic "${CMD_DIR}/nic.commands" soft
          fi

          for p in ${PROFILES}; do
            cp .github/scripts/modtest/probe.commands "${CMD_DIR}/${p}.commands"
            run_one "$p" "${CMD_DIR}/${p}.commands"
          done

      # SCSI/SAS 设备与崩溃门禁：控制器驱动必须加载、测试盘应被识别、
      # dmesg 不得出现崩溃。崩溃按 IP 归属判：模块内 ⇒ 我们的缺陷硬失败
      # （不豁免）；内核内建 ⇒ 只有 scsi-allowlist.tsv 里带 RR 对照 run id
      # 的条目才降级（用户口径：RR 也 panic 才允许豁免）。
      - name: SCSI/SAS 设备与崩溃门禁
        if: ${{ always() && inputs.scsi_profiles != '跳过' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${SCSI_PROFILES}" in
            "全部三型") P="virtio-scsi megaraid mptsas" ;;
            "仅 SAS 两型") P="megaraid mptsas" ;;
            "仅 virtio-scsi") P="virtio-scsi" ;;
            "仅 megaraid") P="megaraid" ;;
            "仅 mptsas") P="mptsas" ;;
            *) echo "[E] 未知 scsi_profiles: ${SCSI_PROFILES}" >&2; exit 1 ;;
          esac
          python3 -I .github/scripts/modtest/check_scsi_result.py \
            --logs /tmp/modtest-logs --cmds /tmp/modtest-logs/cmds \
            --profiles "$P" \
            --table .github/scripts/modtest/scsi-models.tsv \
            --allowlist .github/scripts/modtest/scsi-allowlist.tsv \
            --platform "$PLATFORM" --line "$LINE" --kver "$KVER" \
            --model "$MODEL" --kernel "$KERNEL" \
            --out /tmp/modtest-logs/scsi-result.json

      # 启动日志 LKM 异常核对：扫 base/SCSI/nic 的串口采集与安装期
      # serial_full/messages 日志。Unknown symbol / 真 vermagic / GPL-only /
      # Loading modules failed / 崩溃 = 硬失败；BUILTIN_DUP 按
      # env-fail-allowlist 降级；firmware / modprobe 找不到可选模块 / taint
      # 只报告（第一轮全平台实测后再评估是否收紧）。
      - name: 启动日志 LKM 异常核对
        if: ${{ always() && inputs.run_bootlog_gate == true }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${PREBUILT:-false}" = "true" ]; then
            # 预装成品模式没有安装期日志，允许缺失（只核对 profile 采集）
            EXTRA+=(--install-optional)
          fi
          python3 -I .github/scripts/modtest/check_bootlog.py \
            --logs /tmp/modtest-logs --cmds /tmp/modtest-logs/cmds \
            --profiles "base megaraid mptsas virtio-scsi nic" \
            --install-logs /tmp/dsm-install/logs "${EXTRA[@]}" \
            --module-allowlist .github/scripts/modtest/env-fail-allowlist.tsv \
            --allowlist .github/scripts/modtest/bootlog-allowlist.tsv \
            --platform "$PLATFORM" --line "$LINE" --kver "$KVER" \
            --model "$MODEL" --kernel "$KERNEL" \
            --out /tmp/bootlog-check/bootlog-result.json

      # 网卡取 IP 门禁：六块额外虚拟网卡必须各自绑定驱动并拿到 IPv4。
      # 与模块门禁分开，避免 nic 日志缺失时把 G-M 系列判据一起拖失败。
      - name: 网卡取 IP 门禁
        if: ${{ always() && inputs.run_nic_profile == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I .github/scripts/modtest/check_nic_result.py \
            --logs /tmp/modtest-logs/nic \
            --table .github/scripts/modtest/nic-models.tsv

      # P0 结果门禁：解析 guest 串口输出，白名单外的失败/缺完成标记/STALE/
      # 内核崩溃/安装集缺口一律让 job 失败。放在采集之后、收尾之前，
      # 且 always() 保证采集中途失败时也能给出可比对的结论。
      - name: 模块测试结果门禁
        if: ${{ always() && inputs.run_module_test == true }}
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$PWD"
          META="$WORKDIR/modtest-meta/module-list.tsv"
          [ -f "$META" ] || {
            echo "[E] 缺少模块清单 $META（模块测试未准备成功）" >&2; exit 1; }
          EXTRA=()
          if [ "$KERNEL" = "custom" ]; then
            EXTRA+=(--cks-image-info "$WORKDIR/modtest-meta/cks-image-info.txt")
          fi
          # 预装成品 OVA：镜像内模块来自 base rr.img 的旧构建，与本次测试包
          # 本来就可能不同版本；官方内核的系统模块树还来自官方 DSM PAT。
          # 两者 STALE/安装集差异都降级为告警（custom 内核仍硬失败）。
          if [ "${PREBUILT:-false}" = "true" ]; then
            EXTRA+=(--prebuilt)
          fi
          python3 -I .github/scripts/modtest/parse_results.py \
            --logs /tmp/modtest-logs --profile modtest \
            --module-list "$META" \
            --source "$SOURCE" --model "$MODEL" --kernel "$KERNEL" \
            --platform "$PLATFORM" --line "$LINE" --kver "$KVER" \
            --allowlist .github/scripts/modtest/env-fail-allowlist.tsv \
            --baseline ".github/scripts/modtest/baseline/${PLATFORM}-${LINE}-${KVER}-${KERNEL}.json" \
            --meta "$WORKDIR/modtest-meta/modtest-meta.txt" \
            --module-limit "${MODULE_LIMIT:-0}" \
            "${EXTRA[@]}" \
            --out-prefix /tmp/modtest-logs/modtest-result

      - name: 安装/测试失败时收尾并保存镜像
        if: failure()
        shell: bash
        run: |
          set +e -uo pipefail
          WORKDIR="$PWD"

          if [ -f "$WORKDIR/rr/docker-compose.yaml" ]; then
            ( cd "$WORKDIR/rr" && docker compose -f docker-compose.yaml down )
          fi
          docker rm -f dsm >/dev/null 2>&1

          sudo umount /mnt/p1 /mnt/p3 2>/dev/null
          for L in $(losetup -j "$WORKDIR/rr/rr.img" 2>/dev/null | cut -d: -f1); do
            sudo losetup --detach "$L"
          done
          sudo sync

          [ -f "$WORKDIR/rr/rr.img" ] || { echo "[E] 无 rr.img，跳过"; exit 0; }
          OUT="$WORKDIR/rr/rr-failed-${MODEL}.img.gz"
          gzip -1 -c "$WORKDIR/rr/rr.img" > "$OUT"
          echo "[INFO] 失败镜像已保存: $(basename "$OUT")"
          echo "DEBUG_IMG=$OUT" >> "$GITHUB_ENV"

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modtest-${{ matrix.source }}-${{ matrix.model_slug }}-${{ inputs.kernel }}
          path: |
            /tmp/modtest-logs
            /tmp/bootlog-check
            /tmp/dsm-install/logs
            modtest-meta
          if-no-files-found: warn
          retention-days: 30

  # 按 (型号, profile) 配对 ainas/RROrg 的启动日志并归一化 diff。
  # 注意：不要在 job 级用 `if: inputs...`/`needs...` 判断双源——run 41601772843/
  # 41603509183 里 rr_source=both 却都被跳过（job 级条件求值不可靠）。
  # 改为总是运行，由 run_diff.sh 根据实际 artifact 判断是否双源。
  analyze:
    name: 启动日志对比
    needs: [plan, build-install]
    # 不加 if 时 GitHub 仍会在依赖 job 的 needs 判定后跳过（run 41605402797：
    # plan 与两个 install+test 均 success，analyze 仍 0 步 skipped）。显式
    # always()+结果检查，避免 needs 的隐式 success() 语义干扰。
    if: ${{ always() && needs.plan.result == 'success' && needs.build-install.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 下载双源测试日志
        uses: actions/download-artifact@v4
        with:
          pattern: modtest-*
          path: logs
          merge-multiple: false

      - name: 归一化并对比
        shell: bash
        # 单源时 run_diff.sh 直接跳过（退出 0）；双源缺配对才失败
        run: bash .github/scripts/modtest/run_diff.sh logs /tmp/bootlog-diff

      - name: 上传对比结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootlog-diff
          path: /tmp/bootlog-diff
          if-no-files-found: warn
          retention-days: 30
