# RR 原版结构（保持不动），仅仓库地址适配 myp015：
#   checkout RROrg/buildroot  → myp015/ainas-buildroot（secrets.AiNas）
#   checkout RROrg/rr         → myp015/ainas-rr（secrets.AiNas，push grub.img.gz 回 ainas-rr）
#

name: Build grub

on:
  workflow_dispatch:
    inputs:
      push:
        description: "push 到 myp015/ainas-rr"
        default: false
        type: boolean
      push_build:
        description: "push 到 myp015/ainas-build 的 ainas/grub<ver>.img.gz"
        default: false
        type: boolean
      img_size:
        description: "镜像大小（MiB）"
        default: "3700"
        type: string
      grubver:
        description: "grub version"
        default: "grub-2.14"
        type: string
      bioslst:
        description: "bios list"
        default: "i386-pc i386-efi x86_64-efi"
        type: string
      namestr:
        description: "name string"
        default: "RR"
        type: string

jobs:
  grub:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-buildroot
          token: ${{ secrets.AiNas }}
          path: ainas-buildroot

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: myp015/ainas-rr
          token: ${{ secrets.AiNas }}
          path: rr

      - name: Initialization environment
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo apt update
          sudo apt install -y autoconf autoconf-archive automake autopoint build-essential pkg-config bison flex gettext gawk libtool dosfstools e2fsprogs
          sudo apt install -y libfreetype6-dev unifont fonts-dejavu libfuse-dev libzfslinux-dev liblzma-dev libdevmapper-dev

      - name: Make Grub
        env:
          IMG_SIZE: ${{ inputs.img_size }}
        run: |
          case "${IMG_SIZE}" in
            ''|*[!0-9]*) echo "[E] img_size 必须是正整数（单位 MiB）：${IMG_SIZE}"; exit 1 ;;
          esac
          . ainas-buildroot/grub_rr.sh "${{ inputs.grubver}}" "${{ inputs.bioslst}}" "${{ inputs.namestr}}" "${IMG_SIZE}"

      - name: Upload artifact
        if: success() && inputs.push == false && inputs.push_build == false
        uses: actions/upload-artifact@v7
        with:
          name: grub
          path: |
            grub.img.gz
          retention-days: 5

      - name: Check and Push
        if: success() && inputs.push == true
        run: |

          # 用 cp 而非 mv：push_build 步骤可能还要用同一个 grub.img.gz
          [ -f "grub.img.gz" ] && cp -f grub.img.gz rr/files/initrd/opt/rr/grub.img.gz

          cd rr
          echo "Git push ..."
          git pull
          status=$(git status -s | grep -E 'grub.img.gz' | awk '{printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update $(date +%Y-%m-%d" "%H:%M:%S)"
            git push -f
          fi

      - name: Push 到 ainas-build
        if: success() && inputs.push_build == true
        run: |
          set -euo pipefail
          GRUBVER="${{ inputs.grubver }}"
          case "${GRUBVER}" in
            grub-*) ;;
            *) echo "[E] grubver 必须形如 grub-2.14：${GRUBVER}"; exit 1 ;;
          esac
          IMG_FILE="ainas/grub${GRUBVER#grub-}.img.gz"

          [ -f grub.img.gz ] || { echo "[E] 未找到 grub.img.gz"; exit 1; }

          git pull --rebase
          cp -f grub.img.gz "${IMG_FILE}"
          git add "${IMG_FILE}"
          if git diff --cached --quiet; then
            echo "[INFO] ${IMG_FILE} 无变化，跳过提交"
          else
            git commit -m "chore(grub): 更新 ${IMG_FILE} ($(date '+%Y-%m-%d %H:%M:%S'))"
            git push
          fi
