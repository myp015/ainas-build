# GitHub Actions workflow for building and pushing Kodi Docker image
name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        app: ["rr"]

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: myp015/ainas-rr
          token: ${{ secrets.AiNas }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: myp015/dockers
          token: ${{ secrets.AiNas }}
          path: dockers

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gettext jq curl unzip cpio xz-utils lz4 lzma bzip2 gzip zstd file

      - name: Prepare rr initrd
        run: |
          # 与 rr.yml 的 docker 段一致：buildroot 基础 initrd 覆盖 files/initrd 后，
          # 解包到 Dockerfile 所在目录（镜像 rootfs 就是 initrd）。
          . scripts/func.sh "${{ secrets.AiNas }}"

          getBuildroot "files/mnt/p3" "true"
          convertpo2mo "files/initrd/opt/rr/lang"
          repackInitrd "files/mnt/p3/initrd-rr" "files/initrd"
          unpackInitrd "files/mnt/p3/initrd-rr" "dockers/rr/initrd"

          # unpackInitrd 用 sudo cpio 解包，部分目录为 root 0700；buildx 以 runner 身份读 context。
          sudo chown -R "$(id -u):$(id -g)" "dockers/rr/initrd"

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Calculate version
        id: version
        run: |
          # Calculate version
          version=""
          # 与 rr.yml 一致：空输入 → 版本号为空，后续不构建、不推送
          if [ -n "${{ inputs.version }}" ]; then
            if [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              version="${{ inputs.version }}"
            else
              LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.DOCKERHUB_PASSWORD }}" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}/tags" | jq -r ".results[].name" | grep -v latest | sort -V | tail -n 1 2>/dev/null)"
              if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then  # format %y.%-m.$i
                version="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              else
                version="$(date +'%y.%-m').0"
              fi
            fi
          fi

          echo "version: ${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: steps.version.outputs.version != ''
        uses: docker/build-push-action@v7
        with:
          context: ./dockers/${{ matrix.app }}
          file: ./dockers/${{ matrix.app }}/Dockerfile
          # rr 的 initrd 是 x86_64，只构建 amd64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:latest
