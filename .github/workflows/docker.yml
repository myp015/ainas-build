# GitHub Actions workflow for building and pushing Kodi Docker image
# 对齐 RROrg/rr-build/.github/workflows/docker.yml，仅保留本仓库必需的适配：
#   - matrix 只保留 rr（myp015/dockers 目前只有 rr 的 Dockerfile）
#   - dockers 仓库改为 myp015/dockers
#   - 增加 ainas-rr initrd 准备步骤（镜像 rootfs 取自 ainas-rr）
#   - rr 的 initrd 是 x86_64，platforms 只构建 amd64
name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        # 上游：["kmscon", "kodi", "chromium-desktop", "ubuntu-desktop"]
        # 本仓库目前只维护 rr：复刻 wjz304/rr 的构建镜像，rootfs 取自 ainas-rr。
        app: ["rr"]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: myp015/dockers
          token: ${{ secrets.AiNas }}
          path: dockers

      - name: Checkout ainas-2in1
        if: matrix.app == 'rr'
        uses: actions/checkout@v6
        with:
          repository: myp015/ainas-2in1
          token: ${{ secrets.AiNas }}
          path: ainas-2in1

      - name: Prepare rr initrd
        if: matrix.app == 'rr'
        shell: bash
        env:
          ACTION_TOKEN: ${{ secrets.AiNas }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$ACTION_TOKEN"

          # 与官方 rr-build 的 docker 段一致：镜像 rootfs 就是 RR 的 initrd。
          # ainas-rr 的 updateall Release 资产里包含最终的 initrd-rr。
          mkdir -p /tmp/rr-initrd
          gh release download --repo myp015/ainas-rr \
            --pattern 'updateall-*.zip' --dir /tmp/rr-initrd --clobber
          unzip -o /tmp/rr-initrd/updateall-*.zip 'initrd-rr' -d /tmp/rr-initrd

          # unpackInitrd 来自共享函数库
          . ./ainas-2in1/script/2in1func.sh
          mkdir -p "dockers/${APP}/initrd"
          unpackInitrd /tmp/rr-initrd/initrd-rr "dockers/${APP}/initrd"

          # unpackInitrd 用 sudo cpio 解包，部分目录（如 etc/wireguard）是 root 0700。
          # buildx 以 runner 身份读取构建上下文，不交还属主会 permission denied；
          # COPY 进镜像时仍会归 root，不影响最终镜像权限。
          sudo chown -R "$(id -u):$(id -g)" "dockers/${APP}/initrd"

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Calculate version
        id: version
        run: |
          # Calculate version
          version=""
          if [ -n "${{ inputs.version }}" ]; then
            if [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
              version="${{ inputs.version }}"
            else
              LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.DOCKERHUB_PASSWORD }}" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}/tags" | jq -r ".results[].name" | grep -v latest | sort -V | tail -n 1 2>/dev/null)"
              if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then  # format %y.%-m.$i
                version="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              else
                version="$(date +'%y.%-m').0"
              fi
            fi
          else
            version="$(date +'%Y%m%d%H%M')"
          fi

          echo "version: ${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./dockers/${{ matrix.app }}
          file: ./dockers/${{ matrix.app }}/Dockerfile
          # rr 的 rootfs 是 x86_64 的 initrd，只构建 amd64
          platforms: ${{ matrix.app == 'rr' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:latest
