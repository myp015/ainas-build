# GitHub Actions workflow for building and pushing Kodi Docker image
name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        app: ["kmscon", "kodi", "chromium-desktop", "ubuntu-desktop"]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.AiNas }}
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: RROrg/dockers
          token: ${{ secrets.RRORG }}
          path: dockers

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Calculate version
        run: |
          # 按月低增版本号（26.10.0 / 26.10.1 ...），同月重复发布第 3 段 +1
          # 显式传入 version 且格式匹配当前年月时，以传入为准；否则自动计算
          # （对齐 cks.yml：原逻辑空输入时用时间戳 %Y%m%d%H%M，改为空输入也走自动低增）
          if [ -n "${{ inputs.version }}" ] && [ "$(echo ${{ inputs.version }} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 自动：查 Docker Hub 对应 app 最新 tag，同月则第 3 段 +1，跨月则 .0
            # （Docker Hub 命名空间独立，tag 重复 push 会覆盖，无需 git refs 防冲突）
            LATEST_TAG="$(curl -skLH "Authorization: token ${{ secrets.DOCKERHUB_PASSWORD }}" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}/tags" | jq -r ".results[].name" | grep -v latest | sort -V | tail -n 1 2>/dev/null)"
            if [ -n "${LATEST_TAG}" ] && [ "$(echo ${LATEST_TAG} | cut -d '.' -f 1,2)" = "$(date +'%y.%-m')" ]; then  # format %y.%-m.$i
              if [ "$(echo ${LATEST_TAG} | awk -F '.' '{print NF}')" -ge 4 ]; then
                # 旧格式 4 段 tag（如 26.9.13.1）不参与低增，回退到月份首版
                VERSION="$(date +'%y.%-m').0"
              else
                VERSION="$(echo ${LATEST_TAG} | awk -F '.' '{$3=$3+1}1' OFS='.')"
              fi
            else
              VERSION="$(date +'%y.%-m').0"
            fi
          fi

          echo "VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./dockers/${{ matrix.app }}
          file: ./dockers/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:latest
